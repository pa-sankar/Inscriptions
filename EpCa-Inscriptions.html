॥ ಯಿದಕ್ಕೆ ಧರ್ಮಸಾಕ್ಷಿಗಳು\nಆದಿತ್ಯ ಚಾಂದನೈಲಾನಲಶ್ಚ ದ್ಯೌರ್ಬೂಮಿರಾಪೋಹೃದಯಂ ಮನಶ್ಚ ಅಗಸ್ಯ ರಾಜತ್ಯ್ಮ ಪುಜಛೆಸನ್ನೇ ಧರ್ಮ\nಶ್ಯ್ಮ ಜಾನಾತಿ ನರಸ್ಯಮರ್ತ್ಯಂ ॥ ದಾನಪಾಲನಯೋರ್ಮಧ್ಯೆ ದಾನಾತ್ ಶ್ರೇಯೋನುಪಾಲನಂ ದಾನಾತ್ ಸ್ವರ್ಗಮಾವ್ರಾ\nಪ್ನೋತಿ ಪಾಲನಾದಚ್ಯುತಂ ಪದಂ ॥ ದಾನಾತ್ಸ್ವರ್ಗದ್ದಿಗುಣಂ ಪುಣ್ಯಂ ಪರದತ್ತಾ ನುಪಾಲನಂ ಪರದತ್ತಾ ಪಹರಣೇಣ ಸ್ವದತ್ತಂ\nನಿಷ್ಫಲಂಭವೇತ್ ॥ ಸ್ವದತ್ತಾ ಪುತ್ರಿಕಾ ಧಾರ್ತ್ರಿ ಪಿತೃದತ್ತಾ ಸಚೋದರೇ ಅನ್ಯದತ್ತಾ ಸ್ವಮತಾತಚ್ ದಕ್ಷಭೂಮಿಂ\nಪರಿತ್ಯಜೇತ್ ॥ ಯೋಸ್ಮೃವೆಭಿನೀಗೆ ಲೊಕೇ ಸರ್ವೆ ತಾಮೇವ ಭೂಭುಜಾನಂ ಬ ಭೊಗ್ ಸ್ನಾನಕರಾಗ್ರಾಹ್ಯಾನ್ವಪಿದತ್ತಾನ\nಸುಂಧರಾ ॥ ಶ್ರೇಯಸ್ಸಂ ॥\n\n82\n\n[Kannada original]\nದ ಯೂ ಮಲಕೈ ಬರುವ ಕಾಯ ಜಿ ೯೦ ವರಹ ಭಟ್ಟ ಭಟ್ಟಿ. ೨೦೦ ಬೆಲೆಯು ಚಪ್ರ ಗ್ರಾಮದವೆರ ಮುಂಡಿ ಟ್ಟು; ಲಿಂಗ ಮುದ್ರೆ ಶೇಲಾಪತಿಯನ್ನು ಮಾಡಿಸಿಕೊಟ್ಟು ಯಾ ತಿಥಿಯಲ್ಲಿ, ಪಿತಾದಿ ಸಮಸ್ತ ಪಿತೃಗಳಿಗೆ ಅಕ್ಷಯ ಶಿವಲೋಕ ಪ್ರಾಪ್ತಿಯಾಗುವೆಸು ಎಂದು ಅಪೇಕ್ಷೆಗೊಂಡು ಧರ್ಮಸಾಧನವನ್ನು ಬರೆಯ ಬನ್ನೆನಾಗಿ ಯಾಗ ಗ್ರಾಮಕ್ಕ ಚಕ್ರಕಟ್ಟು ಅಸ್ವ ಭೋಗಕೇಜಿ ಸಾಮ್ಯಮುನ್ನಾದ ಆನಕಾಲ ಭೂಮಿಯನ್ನು ಶಿವಹಿತ್ತವಾಗಿ ಗಣಾರಾಧನೆಯನ್ನು ಮಾಡಿಸಿಕೊಡು ದು ಶಿವಪೂಜಾ ಕಾಲದಲ್ಲಿ, ಅಕ್ಷಿಣಾದ ಕೌನ್ಮಲ್ ಜಾತಿಸ್ವರೂಪ ಪೃಥ್ವಿನೀತೆತ್ತು ಸಪ್ಪುಖ್ಯತ್ಪಲಾಲ್ವೆನ್ಮತಿನೇ ರಹಿತು. ಕ್ಯಪ್ಪಸನ್ನಿಧೇಪರಾಭಯಿಷ್ಕಟ್ಟು ತುಂಡಕ್ಯ ಮೇ ಶಂಕರ ಜನ್ಮ ಜನ್ಮನಿ | ಯೊಂ ಅಕ್ಷಿಣಾದ ದನನ್ನು ಮಾದತ್ತು, ಯಾರೆಕೊಬದಾಗಿ ಬಂದು ಮೆಪ್ಪಸ್ ಭೂನಾಧತ್ಯಾ ಸಾಕ್ಷಿಗಳು – ಆದಿತ್ಯ ಚೇದೋಮ್ಯೋ ಅನಿಲೋ೯ ನಳಕ ವ್ಯಾಭೀ೯ ಮಿರಾಪ್ಯೋ ಹ್ಯದಯಂ ಯಮಕ್ಕ ಅಹತ್ಯೆ ರಾತ್ರಿಶ್ವ ಪ್ರಭುಲ್ಯೊ ಸೌಂದ್ಯ ಧರ್ಮಸ್ಯ ಜಾನಾತಿ ನರಕ್ಯಿ ವೈ ತೃಕೆ | ಸ್ವದತ್ತಾಂದಿಗುಣಂ ಪುಣ್ಯಂ ಪರದತ್ತಾ ನುಪಾಲನಂ ಪರದತ್ತಾ ಹಾರೇಣ ಸ್ವದತ್ತಂ ನಿಷ್ಪಲಂ ಭವೇತ್ ಯಂಬು ಭೂನಸಾಧನಕ್ಕೆ ಸ್ವಹಸ್ರಾಕ್ಷಿ ವಿಸ್ಪತಾ ಶ್ರೀ ವಿ ||\n\n[English translation, Gemini-rendered, verify]\nLet this charitable grant of land be made... [Kannada original text follows describing land gifts, taxes, curses against violators, blessings for protectors, and witnesses].", "roman_pages": [65, 66], "original_pages": [121, 124], "translation_pages": [97, 97]}, {"id": "epca|I|12", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 12, "find_spot": "On a copper plate at Mahādevapura (Mercāra).", "date": "Date 1782 A.D.", "translation": "Liṅga-Rājēndra-Vadeyar\nVi\nSidhalingappa, deputy (guru) of Kodagu, caused the repairs to be made in the year\nŚarvari, the 13th of the bright fortnight of Kārtika.\n\n8\n\n58\nThe śrimad-rājādhirāja rāja-parameśvara prahuḍa-pratāpa apratima-vīra-narapati, seated\non the jewelled throne of the Kodagu samsthāna, ruling the empire of the world; of the\nBhāradvāja-gōtra, Āśvalāyana-sūtra and Rikshabhānukādhyāya; of the Vīra-Śaiva religion;\nAppājendra-Vadeyar’s son, Liṅga-Rājendra-Vadeyar—\nAdored be Śambhu, beauteous with the chāmara-like crescent moon kissing his lofty head,\nthe original foundation-pillar of the city of the three worlds.\nBe it well—the 4881st[year] of the victorious increasing Kali (era) having expired, the\nyear Vikāri being current, on the 10th of the dark fortnight of Māgha, Wednesday, at 7$\\frac{3}{4}$\nhours of the daylight,—submitted to the will of Śiva (i.e. died).\nAt this time of his becoming subject to Śiva, the moon to the waters of the womb of that\nMahārāja (i.e. his son), Vīra-Rājendra-Vadeyar, being in his presence, performed the funeral\nrites,—and, according to his orders, had his tomb made in Mahādēvapura, had a temple built\nand the god Basavēśvara consecrated above the tomb, and had a maṭha of the Murige sect\nerected. And, to provide for the worship at all times of the gaṇas and of this god, assigned\nthis Mahādēvapura land, in the year Nala, on the 1st of the bright fortnight of Chaitra,\nFriday, setting up (boundary) stones, stamped with the liṅga, to the villages of Chikka-\nHarade, Jambūru, Bēlūru, and Basavanahalli,—and caused a deed of the gift to be written\nand given.\nThe repairs were begun in the year Śarvari, on the 13th day of the bright fortnight of\nKārtika, and completed in the year Śubhakritu, on the 10th of the bright fortnight of Vaiśākha,\nMonday.", "text_roman": "Linga-Rājēndra-Vadeyaru\nVi\nKoḍagina charamūrtigalāda Śīdhalingappadavaru Śārvari-samvatsarada\nKārtika-śudha 13 yu Mandavāradallu jīrṇōddāra māḍisiddu.\nśrīmad rājādhirāja rāja-paramēśvara prahuḍa-paratāpa apratima-vīra-narapati Koḍa\ngina samsthānada śrī-ratna-siṁhasānarūḍharāgi prithvi-sāmrājyam gaiyutt-idda Bhāradvāja-\ngōtrada Āśvalāyana-sūtrada Rukshabhānnkādhyāya Vīra-Śaiva-matastar-āda Appajēndra-\nVāḍeyaravara putrarāda Liṅga-Rājēndra-Vāḍeyaru—\nnamas tunga-śiras-chumbi-chandra-chāmara-chāravē |\ntrailōkya-nagar-ārambha-mūla-stambhāya Śambhavē ||\nsvasti śrī-vijayābhyudaya Kali-sanda 4881 ne varatamānakke salluva Vikāri-samvatsarada\nMāgha-bahula 10 yu Budhavāra divi galige 7½ ge Śīvādhinav-āddu—\nyī Śivādhinav-āguva tat-kāladallu yī Mahārājara garbhābdhi-sulhākarāyamānarāda\nVīra-Rājēndra-Vāḍeyaru sannidhānadallu yiddu sat-karmavannu virachisi appane-prakāra\nMahādēvapuradallu kriya-samādhiyannu mādisi dēvasthānavannu kaṭṭisi ā-samādhi-mēle\nBasavēśvara-dēvara-pratiṣhṭeyannu mādisi Murige-sampradāyada-maṭhavannu kaṭṭisi sadā-\nkāladallu gapārādhane kriya-samādhiyannu vuddiśya yī-Mahādēvapura-bhūmi Chikka-Harade\nJambūru Bēlūru Basavanahalli grāmake saba liṅga-mudre-śilā-pratiṣhṭeyannu mādisi Nala-\nsamvatsarada Chaitra-śudha 1 vu Bhārgavāradallu vappisi dāna-sāsanavannu baradu-koṭṭu-\nyidbeyāgi jīrṇōddāra-āddu Śārvari-samvatsarada Kārtika-śudha 18 divasa prārambha\nŚubhakṛitu-samvatsarada Vaiśākha-śudha 10 Guruvārakke ʻākairu āgi-yidhe.", "text_original": "ಮಹಾದೇವಪುರದ ತಾಮ್ರ ಶಾಸನ\n\nವಿ\nಲಿಂಗ ರಾಜೇಂದ್ರನಡೆಯರು ಕೊದಗಿನ ಚರಮೂತೀಗಳಾದ ಶಿಧೀಗಸ್ನಿದ್ದವರು ।\nಕಾವೇರಿ ಸಂವತ್ತೆದರೆ ಕಾರ್ತಿಕ್‌ ಕದ ಒಂ ಯು ಮುಂದಾರದಲ್ಲನು ಜ್ಯೋತ್ಪರ್ಣ ದ್ಧ ರವಮಡಿಸಿದತ್ತು ।\nಶ್ರೀಮನ್ಮಹಾರಾಜರಾಜ ರಾಜಪರಮೇಶ್ವರ ಪ್ರಮಧಪ್ರತಾಪ ಅಪ್ರತಿಮ ವೀರನರಪತಿ ಕೊದಗಿನ ಸಂಸ್ಥಾನದ ಶ್ರೀ\nರತ್ನಸಿಂಹಾಸನಾರೂಢರಾಗಿ ಪ್ರೀತಿಯ ಸಮತ್ಸಲ್ಯ್ಯ ಗೈಯುತಿದ್ದ ಧಾರಾಧ್ವಾಜಗೇಂದ್ರತೆ ಅತ್ಯಲಾಯಿನ ಸೂತ್ರದ ರುಪ್\nಭಾನುಕಾಧ್ಯಾಕೆಯ ವಿರತ್ಮಿವಮತೇರಾದ ಅಜ್ಯಾಜೀಂದ್ರವಡೆಯರರ ಪುತ್ರರಾದ ಲಿಂಗರಾಜೇಂದ್ರವಡೆಯರು ।\nನಮಸ್ತು ಗಣೇಶಾಯ ಒಂ ಚಂದ್ರಚಾಮರ ಬಾರವೇ । ತೈ ಲೋಕ್ಯನಗರಹಾರಮ್ಮನೂ ಇಲಸ್ಸೆಂಭಾಯ\nಕಂಭವೇ ॥\n\nಸ್ವಸ್ತಿ ಶ್ರೀ ವಿಜಯಾಭ್ಯುದಯ ಕಲಿ ಸಂವ ౧೪೧೮ ನ ವರ್ತಮಾನಕ್ಕೆ ಸಲುವ ವಿಕಾರಿ ಸಂವತ್ಸರದ ಮಾಘ\nಬಹುಳ ೧ಂ ಯು ಬುಧವಾರ ದಿವಿಗೆಲ ೬ಗೆ ಶಿವಾದಿನವಾದ್ದು ॥\nಯೆನಾ ಹಿಪಷಿಣವಾವಗುವ ತತ್ಕಾಲ್ಲದಲ್ನು ಯಿಅ ಮಹಾರಾಜರ ಗರ್ಭಾಸ್ಯ್ಬಸುಧಾಕಾರಾಯವಹಾನರಾದ ವೀಲರಾಜೆಂ\nದೆದೈತೆಯು ಸನ್ನಿ ಧಾನದಲ್ಲೇ, ಯುದು ಸಕ್ತ್ಯಮನ್ವಚ್ಚಿ ವೀಚಿಸಿ ಅಪ್ಪನನ್ಯಕಾರೇ ಮಹಾದೇವಪುರದಲ್ಲ ಕಿಯ\nಸಮವಧಿಯನ್ನು ನಾಡಿಸಿ ದೇವೌಸ್ಥಾನನನ್ನು ಕಟ್ಟಿ ಸಿ ಆಸೂಧಾಮಲಿಯಲ್ಲಿ ಬಸವೇಶ್ವರದೇವರೆಡೆ ಪ್ರತಿಷ್ಟೆಯನ್ನು ಮಾಡಿಸಿ\nಮುರಿಗೆ ಸಂಗದಾಯದ ಮಹಸಮ್ಮದ ಹಟ್ಟಿಸಿ ಸದಕಾಕಾಲದಲ್ಲೆ ಗಣಾಚಾರಾಧನ ಯಾ ದೇವತಾರಾಧನೆ ವೃದ್ದಿಕ್ಕೋ ಯಿಅ\nಮಹಾದೇವಪುರದ ಭೂಮಿ ಬೆಕ್ಕಹರವೆ ಜಂಬುರ ಬೆಲೂರು ಬಸವನಹಳ್ಳಿ ಗ್ರಾಮಕ್ಕೆ ಸಹ ಲಿಂಗಮುದ್ರೆ ಶಿಲಾಪ್ರತಿಷ್ಠ\nಯನ್ನು ಮಾಡಿಸಿ ನಲಸಂವತ್ಸರದ ಜ್ಯೇತ್ರ ಕುನ ೧ ವು ಭಾಗ೯ವಾರದಲ್ಲೆ, ವೆಸ್ಟ್ರಿಸಿ ದಾನಶಾಸನವನ್ನ ಬರೆದುಕೊಟ್ಟು\nಯಿಧೂಯಿ ಜೇಣೋತ್ಪಾದ್ಯ ರಿ ಅದ್ದು ಕಾವರಿಸಿಸಿವತ್ತೆದರೆ ಕಾರ್ತಿಕ್‌ ಶುಧ ೧೨ ದಿವಿಸೆ ಪ್ರಾರಂಭ ಶುಭೇಕ್ಯತು ಸಂವ\nತ್ಸರದ ಮೈಕಾಸು ಶುಧ ೧ಂ ಗುರುವಾರಕ್ಕೆ ಅಕ್ಷರು ಅಳಿಯಿದೆ।\n\n90\n2 ನೆಯ ಪಾಕ್ಷ್ಮ\n31 ಗುರುಗಲ್ಯಧಾನಸ್ಯತ್ತ್ವಸ್ಯ\n32 ಕಟವನಸೂಳಾಪಿಸ್ಪನೋ\n33 ನವ್ಯತೀಂದ್ರವರೇಣಂಘಿ\n34 ನ್ಯನ್ನಿಸಂಘೋದ್ಯನೀಲಗೆ\n\nCoorg Inscriptions\n35 ಣಾಮಹಾರಾಜು ಭಾಮಣ್ಣಾ\n36 ಯನಾಫಣವರಮೋರ್ಹೇ\n37 ನಕ್ಕಾದಿತ್ಯತ್ರಯಾಸ\n38 ಕರ್ಳಮಾಹಾಕಭು\n39 ಕಾರ್ಳಾಟಗ್ರಾಮಾದಿಷ್ಟಿ", "roman_pages": [66, 66], "original_pages": [122, 132], "translation_pages": [97, 98]}, {"id": "epca|I|13", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 13, "find_spot": "On a copper plate at the Abbi maṭha in Yadava-nād.", "date": "Date 1796 A.D.", "translation": "At the feet of Niranjana-dēva of the Abbi maṭha, deputy of Sāntavīra-svāmi, the deputy\nof the Pākōḍu Mahanta-svāmi Mallikārjuna-svāmi, disciple of the Murigi-svāmi.\nAdored be Śambhu, beauteous with the chāmara-like crescent moon kissing his lofty\nhead, the original foundation-pillar of the city of the three worlds.\nBe it well. In the year 1718 of the victorious increasing Sālivāhana era, the year Nala\nbeing current, on the 1st day of the bright fortnight of Chaitra, Friday (8 April 1796),—\nWhen, dedicated by the lotus hands of the svāmi of the Sidhapura maṭha, who was follower\nof the doctrine of those enthroned in the upper cave at Śivagaṅga and of the Vīra-Śaiva\nreligion; the śrimad-rājādhirāja rāja-parameśvara prahuḍa-pratāpa vipratima-vīra-narapati,\nseated on the jewelled throne of the Kodagu samsthāna, was ruling the empire of the world ;—\nof the Bhāradvāja-gōtra, Āśvalāyana-sūtra, and Rukshabhānukādhyāya, Appājendra-Vadeyar's\ngrandson, Liṅga-Rājendra-Vadeyar's son, Vīra-Rājendra-Vadeyar wrote and presented a\nrenewed deed of gift as follows:—\nWhereas the two villages which formerly, in the year 1650 of the Sālivāhana era, the\nyear Kilaka, on the 2nd day of the bright fortnight of Kārtika, Wednesday (23 October\n1728), our senior grand-uncle (grandfather's elder brother) Dodda-Virappa-Vadeyar,—in\naddition to the two villages Hosalli and Jigatalli which had formerly come to the Abbi-maṭha\nof Yadava-nād,—when Dodda-Virūpāksha-svāmi paid a visit to Madikēri, holding his feet\nand making petition, in order to obtain merit as long as sun and moon endure, newly\npresented to the Abbi-maṭha the Bāchallī village, having a ground rent of 16 varaha;\nand these three villages, Hosalli, Jigatalli and Bāchallī, had been made over to the Abbi\nmaṭha, with the erection of (boundary) stones stamped with the liṅga, in the presence of the\npeople of the four (boundary) villages.\n\n59\nOn this 1st day of the bright fortnight of Chaitra, Friday,—in order that our father and\nall ancestors may attain to the eternal Śiva-lōka,—we have written a renewed gift of the land\non a copper plate and presented it.\n    And within the four boundaries of these three villages, Hosalli, Jigattalli, and Bāchalli,\nwhich belong to the Abbi matha, the eight rights of full possession, namely, hidden treasure,\nunderground stores, springs, timber, minerals, present profit, future profit, actualities and\npossibilities, etcetera,—the whole of that land, as an offering to Śiva, in order that, performing\nthe worship of the gaṇas and continuing the work of merit as long as sun and moon endure,\nat the time of Śiva-pūjā blessings may be continually invoked with the hymn of benediction\n(saying)—\n    Recollection of former births, dominion of the world, the glory of good fortune, surpassing beauty,\n    Faith in thee, knowledge, long life, (objects of) desire,-(of these) be thou giver to me, Śankara, from age to age-\nhave we written and given this renewed gift of land.\n    Witnesses thereto :-Sun and moon, and fire, sky, earth and water, heart (or\nconscience) and Yama, day and night, and the two twilights; these know the deeds of a\nrighteous man.\n    Than making a gift oneself, to protect another's gift is twice as meritorious : by taking\naway another's gift one's own gift becomes fruitless.\n    The said grant of land was according to order written on Friday by the private\nsecretary Śambhaiya.", "text_roman": "Murigi-svāmiyavara pādaka Mallikārjuna-svāmiya Pākōḍu-Mahanta-svāmiyavara chara\nmūrtigalāda Śantavīra-svāmiyavara charamūrtigaḷāda Abbi-maṭhada Niranjana-dēvara\npādakke.\nnamas tuṅga-śiras-chumbi-chandra-chāmara-chāravē |\ntrailōkya-nagar-ārambha-mūla-stambhāya Śambhavē ||\nsvasti śrī-vijayābhyudaya-Śālivāhana-śaka-varusha 1718 ne varatamānakke salluva\nsāmpradāyastarāda Śidhapurada maṭhada svāmiyavara kara-kamala-sañjātārāda Vīra-Śaiva-\nmatastar-āda śrīmad rājādhirāja rāja-paramēśvara prahuḍa-pratapa vipratima-vīra-narapati\n\nKodagina samsthānada śrī-ratna-simhāsanaṙūdharāgi prithvi-sāmrajyam gaivutt-irualu\nBharadvāja-gōtrada Āśvalāyana-sūtra Rukshabhānukādhyāgalāda Appajēndra-Vaḍeyaravara\npautrarāda Linga-Rājēndra-Vaḍeyaravara putrarāda Vira-Rājēndra-Vaḍeyaravara baradu\nvappista jirṇṇōddārada dāna-śāsanada kramav-entandare-prāku Śālivāhana-śaka-varusha 1650\nne Kilaka-samvatsarada Kārttika-śuddha 2 Budhavāradallu hire-ajjayanavarada Doḍḍa-\nVīrappa-Vaḍeyaravara Yadava-nāḍu Abbi-maṭhakke prāku naḍaḍu-baruttidda grāma\nHosaḷḷi-grāma vandu Jigaṭṭali-grāma vandu vubhaya-grāma yeradu yidallade Doḍḍa-\nVirūpākṣha-svāmiyavaru Maḍikērige chittaisalāgi pāda-viḍidu binnaha-maḍikoṇḍu āchan\ndrārkavāgi dharma-barabēk-endu nūtanavāgi Abbi-maṭhakke biṭṭu koṭṭa grāma Bāchaḷli-\ngrāma-vandakke kandāya ga 16 hadināru-varaha saha Hosaḷli-grāma 1 Jigaṭṭali-grāma\n1 Bāchaḷli-grāma 1 antu grāma 3 ra chatuś-śime-yellekaṭṭinalli yiruva nidhi-nikṣhēpa-jala-taru-\npāṣhṇa-akshīṇa-āgāmi-siddha-sādhyangal-emba ashta-bhōga-tēja-svāmya muntāda a sakala-\nbhūmiyannu Śivārvapitāvgi gaṇarādhaneyannu naḍiśikoṇḍu āchandrārkavāgi dharmavannu\nnaḍista Śivapūjā-kāladallu āśīrvādada ślōka-\n    jāti-smaratvam prithvi-patitvam savubhāgya-lāvanyam ativa-rūpam |\n    tvad-bhakti vidyā paramāyur ishṭam tvam daś cha mē Śankara janma-janmani ||\nyamba āśīrvādavannu māḍuttā-yirabēk-embadāgi baradu vapista jirṇṇōddārada bhū-\nsādhanakke sākshigaḷu-\n    āditya chandrō anilō nalaś cha dyaur bhūvir āpō hridayam Yamas' cha |\n    ahō rātriś cha ubhayaś cha sandhyā dharmasya jānāti narasya vṛittaḥ ||\n    svadattā dviguṇam puṇyam paradattānupālanam |\n    paradattāpahārēṇa svadattām niśphalam bhavēt ||\nyamba bhū-sādhanakke appane-prakāra Bhārgavāra baradāta khāsa-rahasyada Śambhaiya.\n                                                                        śrī Vi.", "text_original": "ಹುದವನಾಡೆ ಅಭ್ಯಮಿಕಡ ತಾಮ್ರ ಶಾಸನ\nಮುರಿಗೆ ಸ್ವಾಮಿಯವರ ವಾದೆಕ ಮಲ್ಲಿ ಕಾವೀರ್ನಾಸ್ಥಾವಿಯ ಪಾಳೋಣೆಯು ಮಹೆನ್ನ ಸ್ವಾಮಿಯವರ ಚರಮೂ\nತೀ ಗಾಗೆದರೆ ಕಾತಕೇಲಿಸ್ವಾಮಿಯವರ ಚರಮೂತ್ತ್ರೀಗಳಾದ ಅಜೇಮುದ್ರೆ ನರಜಿನದೇವರ ಪಾದಕ್ಕೆ-\nನಮಸ್ತುಂಗ ಶಿರstung ಒಂ ಚಂದ್ರಚಾಮರ ಬಾರವೇ । ತೈ ಲೋಕ್ಯನಗರಹಾರಂ ಬ ಮೂಲಸ್ತಂಭಾಯ ಶಂಭವೇ ॥\nಸ್ವಸ್ತಿ, ಶ್ರೀ ವಿಜಯಾಭ್ಯುದಯ ಕಾಲಿನಾವಜ್ಜನ ಕಳವರುಷ ೧೫೧೯ ನೇ ವರ್ತಮಾನಕ್ಕೆ ಸಲುವ ನಲಸಂವತ್ಸರದ\nಜೈತ್ರ ಶು ೧ ಭಾಗ೯ವಾರದಲ್ಲೆ, ಕಿವಿಗೆಂಗಮೇಲನ ಗವಿನೋಹಾಸನಾರೂಢರ ಸಾಂಪ್ರದಾಯಸ್ತ ರಾಡ ಶಿಧಪುರದೆ\n\n[Kannada original]\n\n81\nಮಹದ ಸ್ವಾಮಿಯವರ ಕರಕಮಲಸಂಜಾತರಾದ ವಲ್ ಕೃಮತಸ್ಥರಾದ ಶ್ರೀಮದ್ ರಾಜಾಧಿರಾಜ ರಾಜ ಪರಮೇಶ್ವರೇ\nಪ್ರೌಢಪ್ರತಾಪ ವಿಪ್ರತಿಪಿನ ವೀರನರಸಿಂಹ ಕೌಡಣ್ಯನ ಸಂಸ್ಥಾನದ ಶ್ರೀ ರತ್ನಸಿಂಹಾಸನಾರೂಢರಾಗಿ ಪೃಥ್ವೀ ಸಾಮ್ರಾ\nಜ್ಯಂ ಗೈಯ್ಯುತ್ತಿರು ಳೋ ಭಾರದ್ವಾಜಗೋತ್ರದ ಆಕ್ಷಲಾಯನಸೂತ್ರ ರುಪ್ರಭೂಣಾಚಾರ್ಯಯಲ್ಲಾ ದ ಅಪ್ಪಾಜೀಂದ್ರಯದೇವ\nರವರೇ ಪತ್ರರಾದ ಲಿಂಗರಾಜೇಂದ್ರನದೆಯವರೇ ಪುತ್ರರಾದ ವೀರರಾಜೇಂದ್ರನಡೆಯರವರು ಬದಟು ಮೈಸ್ತ್ರೇ\nಯೋಳ್ಳೋದ್ದಾರ ದಾನಶಾಸನದೆ ಕ್ರಮೆವೆಂತದರೆ - ಚಾಶಕು ಶಾಲವಾಹನ ಶಕವರ್ಷ ೧೬೪೦ ನೇ ಕೆಳಕಸಂವತ್ಸರದ\nಕಾರ্তিকಾಸುದ್ಧ ೧ ಬುದವಾರದಲ್ಲಿ ಹಿರೇ ಅಪ್ಪಾಜಿಯವರದು ದೋಡ್ಡವಿರಪ್ಪ ಯಡೆಯರವರು ಯದನೆದದು ಅಪ್ಪಾ\nಮಹಕ್ಕೆ ಪ್ರೋಕುನದದು ಬರುತಿದ್ದ ಗ್ರಾಮದ ಹೂಸಳ್ಳಗ್ರಾಮ ವಂದು ಜೆಗಟ್ಕಲ್ಯಾಗ್ರಾಮ ವಂದು ಪುಥವ್ಯಾಗ್ರಾಮ ವರು\nದು ಯುದ್ಧದಲ್ಲಿ ದೋಡ್ಡ ವಿರೇಷಪಾಕ್ಷಸ್ವಾಮಿಯವರು ಮೆದಕೆರಿಗೆ ಬೆಚ್ಚಿ ಸಲಾಗಿ ಪಾದವಿಡಿದು ಭಿನ್ನ ಹವನಾಡಿ\nಕೊಂಡು ಆಚೋದಾರ್ಕವಾಗಿ ಧರ್ಮಬರಬೇಕೆಂದು ನರಕನಾಗಾಗಿ ಅಭ್ಯಾಜ್ಞಾವನ್ನು ಬಟ್ಟು ಕೊಟ್ಟು ಗ್ರಾಮ ಬಾಡಳ್ಳ\nಗ್ರಾಮ ವೆಂಕಟ್ಟೆ ಕಂದಾಯ ಗೆ ೧೬ ಹವಿನಾರು ವರೆಹ ಸಹ ಹೊಸಲ್ಲ ಗ್ರಾಮ ೧ ಬೊಟ್ಟೆ ಳ್ಳ ಗ್ರಾಮ ೧ ಬಾಚಳ್ಳ\nಗ್ರಾಮ ೧ ಅನ್ನಾಗ್ರಾಮ ೨ ರೇ ಜೆತುಮ್ಯೋಗಲ್ಲೆ ಕಟ್ಟಿನಲ್ಲಿ ಯೂರುವ ನಿಧಿ ನಿಕ್ಷೇಪಜಲತರು ಪಾಷಾಣ ಅಕ್ಷಿಣ\nಅಗಾಮಿ ಸಿದ್ಧಸಾಧ್ಯೋಗಲಂಬ ಅಷ್ಟಭೋಗತೇಜಸ್ವಾಮ್ಯ ಮುನಾದ ಅಸಕಲಭೋಗಮೀಯನ್ನು ಶಿವಾರ್ಪತವಾಗಿ\nಗಣಾರಾಧನೆಯನ್ನು ನಡೆಸಿಕೋಣು ಆಚೋದಾರ್ಕವಾಗಿ ಧರ್ಮವನ್ನು ನಡೆಸ್ಟೆ ಶಿವಪೂಜಕಾಲದವರು ಅರ್ಚವಾದೆ\nಕೊಳ್ಳಿ. ಬಾಸಿರುತ್ತೆ೦ ಪ್ರೀಲ್ಯಪತಿತ್ವಂ ಸುಭ್ರಭಾಗ್ಯಲಯಮೃತಿಮತಿರಸಂ ॥ ತದ್ಧತ್ವಿನೇರ್ಮೆಯರಮಯಿರಿಸ್ಪಂ\nಸ್ಥಾನದೈ ಮೇ ಶಂಕರಂ ಜನ್ಮಜಸ್ಥನಿ ॥ ಯಂಬು ಅಭಿಹಾರದವನ್ನು ಮುದ್ರಾ:ತ್ಮಾಮೋರೆಕಂಟಬಾಣಾ ಬದಟು ಮೇಸ್ತ\nಜೀರ್ಣೋದ್ದಾರದೆ ಭೋನಾಥನೆಕ್ಕ ಸಕ್ಷೆಗಳಂ-ಅಎತ್ತವೆನ್ನಿ) ೧ ಅನಿಲೋನಲಕ್ಷ ಕ ದ್ವಾಪ್ರಭೂರ್‌ಮಿರೂಪವೃದ್ಯಮೂ\nಯಮಕ್ಕೆ | ಅಧೋಗಾತಿಶ್ಚ ಉಭಯತಃ ಸಂಧ್ಯಾಧರ್ಮಸ್ಯ ಜಾನಾತಿನರಸೃವೃತ್ತಿ | ಸ್ಪದತ್ತಾ ದ್ವಿಗುಣಂಪುಣ್ಯಂ ಪರದ\nತ್ತಾನುಪಾಲನಂ | ಪರದತ್ತಾಪಹಾರೇಣ ಸ್ವದತ್ತಂನಿಷ್ಕಲಂಭವೆತ್ ॥ ಯೋಭ ಏಷಧನಸಾಕ್ಷಿ ಅಪ್ಪೇಪ್ರಕಾರ ಬಾರಗ್‌\nವಾರ ಬರಿದಾತ ಲಾಸರಸರೈಯದೆ ಶಬ್ಯಯಿ-\nಶ್ರೀ ವೀರ ॥", "roman_pages": [66, 67], "original_pages": [122, 123], "translation_pages": [98, 99]}, {"id": "epca|I|14", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 14, "find_spot": "On a copper plate at Mahādēvapura (Mercara).", "date": "Date 1796 A.D.", "translation": "At the feet of Śantavīra-svāmi, deputy of the Koḍali Mahanta-svāmi, the deputy of\nMahā-Murigā-svāmi.\n    Adored be Sambhu, beauteous with the châmara-like crescent moon kissing his lofty\nhead, the original foundation-pillar of the city of the three worlds.\n    Be it well. In the year 1718 of the victorious increasing Sâlivâhana era, the year Nala\nbeing current, on the 1st day of the bright fortnight of Chaitra, Friday (8 April 1796),—\nWhen, dedicated by the lotus hands of the crown svāmi of the Siddapura matha, who was\nfollower of the doctrine of those enthroned in the upper cave at Śivaganga, and of the Vira-\nŚaiva religion; the śrimad-râjâdhirāja rāja-paramēśvara prahuḍa-pratâpa māha, who was\nnarapati, seated on the jewelled throne of the Kodagu samsthâna, was ruling the empire of\nthe world;—of the Bharadvâja-gōtra, Âśvalâyana-sūtra, and Rukshabhānukâdhyâya,—\nAppâjēndra-Vaḍeyar's grandson, like the moon in raising the waters in the womb of Linga-\nRâjēndra-Vaḍeyar,-Vīra-Râjēndra-Vaḍeyar, as an offering for Śiva, granted a deed of gift\nas follows:-\n    When the svāmi visited this Mahādēvapura matha, performing obeisance to him with the\neight members and holding his feet, in order to obtain merit as long as sun and moon endure,\nhe wrote and made over utkir land as follows:-as an offering for Śiva, to the matha 700\nbhaṭṭis of paddy, the produce of this land having a bijavari of 17 bhaṭṭis; and to the matha\nbhaṭṭis of paddy, the ground rent of the villages marked out by the erection of stones with\nfor extra expenses, the ground rent of the villages marked out by the erection of stones with\nthe stamp of the linga and presented, as follows:-from Chikka Harade and Jambūru villages,\nwhose bijavari of 43 bhaṭṭis has a ground rent of 39 varaha, deducting the former grants for\npura-varga, dēva-mânya, and bhūta-uttâra, altogether 6½ varaha for bijavari of 6½ bhaṭṭis, the\nground rent of the remaining free land, 36¼ varaha for bijavari of 36¼ bhaṭṭis; from Belūru,\nbelonging to Thenka-nad-mande in Yadava-nad, with Gudugūru in Basavanahalli, the two\n\n8-A\n\n60\nvillages having a ground rent of 50 varaha for bijavari of 50 bhaṭṭis, deducting the former\ngrants for pura-varga, dēva-mānya, bhūta-uttāra, and nāyi-maṇṇu, altogether a ground rent\nof $17\\frac{1}{2}$ varaha for $17\\frac{1}{2}$ bhaṭṭis, the ground rent of the remaining free land, $32\\frac{1}{2}$ varaha for a\nbijavari of $32\\frac{3}{4}$ bhaṭṭis. Total, from the 4 villages, after deducting the former grants, ground\nrent of free land coming to the maṭha,-69 varaha, and 700 bhaṭṭis of produce.\n    Having presented this in this tithi, with the erection of stones stamped with the liṅga,\nin the presence of the people of the four villages,-with the desire that father and all other\nancestors may attain to the eternal Śiva-lōka, there are given, within the four boundaries of\nthese villages marked out by the erection of stones stamped with the liṅga, the eight rights of\nfull possession, namely, bidden treasure, underground stores, springs, timber, minerals, present\nprofit, future profit, actualities and possibilities, etcetera; and the whole of that land, as an\noffering to Śiva, in order that performing the worship of the gaṇas, at the time of Śiva-pūjā\nmay be recited the hymn of blessing (saying)-\n    Recollection of former births, dominion of the world, the glory of good fortune, surpassing beauty,\n    Faith in thee, knowledge, long life, (objects of) desire,-(of these) be thou giver to me, Śaṅkara, from age to age,-\n    has been written and given this grant of land.\n    Witnesses thereto:-Sun and moon, wind and fire, sky, earth and water, heart (or\nconscience) and Yama, day and night, and the two twilights; these know the deeds of a\nrighteous man.\n    Than making a gift oneself, to protect another's gift is twice as meritorious : by taking\naway another's gift one's own gift becomes fruitless.\n    Approval to the gift of land in my own hand,\n(Signed)\tŚrī-Vi.", "text_roman": "śrīman mahā-Murigā-svāmigalavara charamūrtigalāda Koḍali-Mahanta-svāmigalavara\ncharamūrtigalāda Śantavira-svāmiyavara pādakke-\n    namas tunga-śiraś-chumbi-chandra-chāmara-chāravē |\n    trailōkya-nagar-ārambha-mūla-stambhāya Sambhavē ||\nsvasti śrī-vijayābhyudaya-Śālivāhana-śaka-varsha 1718 ne vartamānakakse salluva Nala-\nsamvatsarada Chaitra-śuddha 1 Bhārgavāradallu Śivagange-mēlana-gavi-simhānarūdhara-\nsāṁpradāyastarāda Vira-Śaiva-matastarāda Siddāpurada maṭhada paṭṭada-svāmiyavara kara-\nkamala-saujātarāda śrimad rājādhirāja rāja-paramēśvara prahuda-pratāpa apratima-vīra-\nnarapati Kodagina samsthānada śrī-ratna-simhāsanaṙūdharāgi prithvi-sāmrajyam gaiyyutt-\niralu Bhāradvāja-gōtrada Āś [va] lāyana-sūtra Rukshabhānukādhyāgalāda-sudhākārayamānarāda\nVaḍeyaravara pavutrarāda Linga-Rājēndra-Vaḍeyaravara garbhābhdhi-sudhakārayamānarāda\nVira-Rājēndra-Vaḍeyaravaru Śivārpanakke samarpisida dāna-śāsanada kramav-entandare-\nMahādēvapurada maṭha yidakke svāmiyavaru chittaisalāgi sāshtāṅga-praṇāpisi pāda-viḍidu\nāchandrārkavāgi dharma-barabēk-endu baradu vappisida vuttarāda-bhūmi-vivara-Śivār\npanada-bagye maṭhakke yí bhūmi bijavari bhaṭṭi 17kke beliyuva bhaṭṭi 700 maṭhakke mēlu-\nvechohada-bagye linga-mudre-śilā-pratishteyannu māḍisi biṭṭu koṭṭa grāmagalinda baruva\nkaṇdāyada vivara Chikka-Harade Jambūru grāmake bija bhaṭṭi 43 kke kaṇdāya 39 varaha\nprākina vuttara yí grāmada pura-varga dēva-mārya bhūta-vuttara saha bija bhaṭṭi 6½ ge\n6½ varaha hōgalāgi śuddha-ninta-bhūmi bijavari bhaṭṭi 36½ varaha Yaḍava-nāḍu valittada\n\nThenka-nāḍu-mandege sërida Bēlūru Basavanahalli vaḷagana Guḍugūru saha grāma 2 kke\nbijavari bhaṭṭi 50 kke kaṇḍāya 50 varahakke prākina vuttara yi grāmada pura-varga dēva-\nmānya bhūta-vuttāra gavuḍ-umbali nāyi-maunnu saha-khaṇḍi ga 17½ ge kaṇḍāya 17½\nhōgalāgi śudha nintaddu bija bhaṭṭi 32½ ge kaṇḍāya 32½ varaha antu grāma 4 kke\nprākina vuttara hōgalāgi śuddha-nintaddu yi maṭhakke baruva kaṇḍāya 69 varaha bhaṭṭa bhaṭṭi\n700 beleyu chavu-grāmadavara mundiṭṭu linga-mudre-śilā-pratiṣhṭeyannu mādisi koṭṭu yi\ntithiyallu pitrādi samasta-pitrigaligu akshaya-Śiva-lōka-prāpti-yāgabēku-yamba apēksheyinda\nbhū-sādhanavannu baradu vappistēvigi yi grāmakke chavu-kaṭṭu-linga-mudre-śilā-pratiṣhṭe-\nvaḷagāda nidhi-nikshēpa-jala-taru-pāshāna-akshīna-āgāmi-siddha-sādhyangal-emba ashta-\nbhōga-tēja-sāmya muntāda a sakala-bhūmiyannu Śivārpitavägi gaṇārādhaneyannu maḍisiḳoṇḍu\nŚiva-pūjā-kalladallu āśirvādada ślōka-\n     jāti-smaratvam prithvī-patītvam savubhāgya-lāvaṇyam ativa-rūpam |\n     tvad-bhakti vidyē paramāyur iṣhṭam tvam daśaha mē Śankara janma-janmāni ||\n     yamba āśirvādavannu māḍutta-yirabēk-embadāgi baradu vappista bhū-sādhanakke sākshigalu—\n     āditya chandrō anilō nalaś cha dyaur bhūmir āpō hṛdayam Yamaś cha |\n     ahaś cha rātriś cha vubhayaś cha sandhyā dharmasya jānāti narasya vṛttaḥ ||\n     svadattā dviguṇam puṇyam paradattānupālanam |\n     paradattāpahāreṇa svaduttam nishphalam bhavēt ||\nyamba bhū-sādhanakke sva-hastā vappitā—\nśri Vi.\n\nFootnote\n1. ", "text_original": "ಮಹದೇವನಪುರದಲ್ಲಿ ರುವ ತಾಮ್ರ ಶಾಸನ\n\nಶ್ರೀಮನ್ನ ಹಾಮೂರುಗನಾಸ್ವಾಮಿಗಳವರ ಚರಮೂರ್ತಿಗಳಾದ ಕೋಡಲimಹೊಂದತಪ್ಪನಿಗೆಳವರ ಚರಮೂರ್ತಿಗಳ\nಅಾದ ಶಾಕತಶಿವನೊಾಮಿಯವರ ಪಾದಕ್ಕೆ-\n\nನಮಸ್ತುಂಗಶಿರಶ್ಚುಂಬಿ ಚಂದ್ರಚಾಮರಚಾರವೇ | ತ್ರೈಲೋಕ್ಯನಗರಾರಂಭಮೂಲಸ್ತಂಭಾಯ ಶಂಭವೇ ॥\nಸ್ವಸ್ತಿ ಶ್ರೀವಿಜಯಾಭ್ಯುದಯದ ಶಾಲಿವಾಹನ ಶಕವರ್ಷ ೧೬೧೯ ನೇ ವಕಮಾಮಾಕ್ಕೆ ಸಲ್ಲುವ ನೈಸಂವತ್ಸರದ\nಚೈತ್ರಶುದ್ಧ ೧ ಭಾಗವಾರದೊಲ್ಲ ಶಿವಗೇಮೊಲನ ಗಸಿಂಹೋನಾಸನಾರೋತರ ಸಾಂಪ್ರದಯಕರಾದ ವೀರೆ\nಕೃಣೇವಸ್ಕಾರಾದ ಸಿದ್ಧಾ ಪ್ರದರ ಮಹದ ವಟ್ಟದ ಸ್ವಾಮಿಯವರ ಕರಕಮಲ ಸಂ ಹಕಾರಾದ ಶ್ರೀಮದ್ರಾಜಾಧಿರಾಜ\nರಾಜಪರಮೇಶ್ವರ ಪ್ರೌಢದ ಪ್ರತಾಪ ಅಪ್ರತಿಮ ವೀರೆನರತಿ ಕೌಡಣ್ಯನ ಸಂಸ್ಥಾನದ ಶ್ರೀರತ್ನ ಸಿಂಹಾಸನಾರೋಥ\nರಾಗಿ ಪೃಥ್ವೀ ಸಾಮ್ರಾಜ್ಯಂ ಗೈಯ್ಯುತ್ತಿ ರಲು ಭಾರದ್ವಾಜ ಗೋತ್ರದ ಆಕ್ಕಲಾಯನ ಸೂತ್ರದ ರುಪ್ರಭೂಣಾಚಾರ್ಯ್ಯಾ\nಯಲಾದ ಅಪ್ಪಾಜೀಂದ್ರಯದೇವವರ ಪತ್ರರಾದ ಲಿಂಗರಾಜೇಂದ್ರನಡೆಯರವರು ರಬ್ಭಾರ್ಭಸಧಾಕಾರಣಮಾನ\nರಾದ ವೀರರಾಜೇಂದ್ರನಡೆಯರವರು ಶಿವಪೂಜೆ ಸಮರ್ಪಿಸದೆ ದಾನಶಾಸನದಕಮೆವೆಂತೆದರೆ | ಮಹದೇವಪುರಮತ\nಯುದ್ದಕ್ಕೆ ಸ್ವಾಮಿಯವರು ಕ್ಷೇತ್ರಯಸಲಾಗಿ ಸಾಕ್ಷಾಣ್ಯಾಗಪಾಣಿಪಿ ದಾವಿಡಿದು ಆಚೋದಾರ್ಕವಾಗಿ ಧರ್ಮಬರಬೆ\nಕെന്നു ಬಡದುವಸ್ತಿಪದ ಪುತ್ರರಾದ ಭೂಮಿಸುವಿರೆ | ಶಿವಪೂಜೆದಬಗ್ಗೆ ಮುತಕ್ಕೆ ಮೇಲುವೆಚ್ಚೆದ ಬಗ್ಗೀ ಲಿಂಗಮುದ್ದೆ\nಕಿಳಸಥಿಕ್ಷೆಯಯನ್ನು ಮಾದಿಸಿ ಬಿಟ್ಟುಕೊಟ್ಟೆ ಗ್ರಾಮಗಳಂದ ಬರುವ ಕಣಾಯ ವುದರ ವೀರ ಚಿಕ್ಷಪಾದೆ ಜಂಬೂರು ಗ್ರಾಮ\nಕ್ಕೇ ಬಟ್ಯಿಲ್ಲೆ ಹಣಕೆ ಕಂದಾಯ ೪೯ ವರಹ ಪಾಕೆನ ಪುತ್ರರಾದ ಯರ ಗ್ರಾಮದ ಪುರಸಗಡಮನ್ನಾಸ ಭಾತಕ\nವೃತ್ತಾರಸೆಯೆ ಬಜಾಭಟ್ಟಿ ಕೆ ೧ ಗೆ ೧೬ ವರಹ ಹೊಗಲಾಗಿ ಕುದ್ಯೆನಿನ ಭೂಮಿಬಿಜಾವ ಭಟ್ಟಿ ಕೆ ೧ ಕಂದಾಯ\n೩೩೧ ವರಹ ಯದನಮಾಡುವಲತ್ತದ ಲೇಕನಾದುಮಂದೆ ಕೆರಿದೆ ಬೆಲೂರು ಬಸವನಹಳ್ಳಿ ವಗ್ಗೆನಾ ಗುಡುಗಳು ಸಹ\nಗ್ರಾಮ ೧ ಕ್ಕೆ ಬಟವಾರಿಭಟ್ಟ, ೧೦ ಕ್ಕೆ ಕಂದಾಯ ೯೦ ವರಹಕ್ಕೆ ಪಾಕೆನ ಪುತ್ರರಾದ ಯಿರ ಗ್ರಾಮದ ಪುರಸಗಡವಿನ\nಮನ್ನಾಸಭೂವಪ್ರತ್ಯಾರ ಗವುಡಬೂಲನಾಯಮ್ಮನ ಸಹ ಬಿಂದಿಗೆ ೧ ಗೆ ಕಂದಾಯ ೧೨ ॥ ಹೊಗಲಾಗಿ ಕುದ್ಯೆನಿನ\nದ್ವಿ ಬಜಾಭಟ್ಟಿ ೨೧೦ ಗೆ ಕಂದಾಯ ೨೧೦ ವರಹ ಅಂಟುಗ್ರಾಮ ೪ ಕ್ಕೆ ವಾರಿಕನುತ್ತಾರಾಕೆ ಹೋಗಲಾಗಿ ಕುದ್ಯೆನಿನ", "roman_pages": [67, 68], "original_pages": [123, 123], "translation_pages": [99, 100]}, {"id": "epca|I|15", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 15, "find_spot": "On the throne.", "date": "Date 1808 A.D.", "translation": "Kali expired 4909.", "text_roman": "Kali sandda 4909.", "text_original": "ಗದ್ದಗಯ ಮೇಲೆ \nಕಲಿ ಸಣ್ಣ ಕರಂ", "roman_pages": [68, 68], "original_pages": [124, 124], "translation_pages": [100, 100]}, {"id": "epca|I|16", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 16, "find_spot": "On a stone at Danagal.", "date": "Date 1815 A.D.", "translation": "In the year Yuva, the 5th of the bright fortnight of Jēshṭha; the Virakta-maṭha of\nChilala Śhāka-svāmi.", "text_roman": "Virājapurada maṭha.\nIva-samvatsarada Jēshṭha-śudha 5 rallu Chilala svāmigaḷa virakta maṭha.", "text_original": "ದನಗಿಳ್ಳಿನಲ್ಲಿರುವ ಶೀಲಾಸಾಸನ\nವೀರರಾಜಪುರದ ಮಕ\nಇವಶಃ: ವತ್ತೆರದೆ ಜಿನ್ನೆ ಕುದಳಿ ೪ ರಲ್ನು, ಬೀಲಳಪಾಕಸಾಮ್ಯೋಗಾರ ವೀರ್ಕಮಟ್ಟ", "roman_pages": [68, 68], "original_pages": [124, 124], "translation_pages": [100, 100]}, {"id": "epca|I|17", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 17, "find_spot": "On copper plates in the Ōmkārēśvara temple at Mercara.", "date": "Date 1820 A.D.", "translation": "Be it well. In the year 1739 of the victorious increasing Śālivāhana era, the year\nĪśvara, on the 2nd of the dark fortnight of Jēshṭha, Sunday, (1st June 1817), the 1,796,392nd\nKali day,-on this auspicious day,-like a pārijāta to the milk ocean the Chandra-vaṁśa, born\nin the Bhāradvāja-gōtra, of the Āśvalāyana-sūtra and Rik-śākha, proficient in supporting the\nVira-Śaiva religion, seated on the illustrious jewelled and beautiful throne in the ancient\nKshīra-nagara 1 in the auspicious Kodagu-samsthāna, a sun in unequalled valour and glory,\nof uninterrupted splendour, of a fame which illuminated all the points of the compass, a\nYudhishṭhira in upholding all manner of royal virtues,-the mahārāja-Appāji-Rājēndra's\ngrandson, Linga-Rājēndra-Vaḍeyar's son, śrī-Linga-Rājēndra-Vaḍeyar, reflecting that by the\n\n61\nperformance in this world of good deeds must be obtained the perfection of fruit in both this\nworld and the next, and that with object he should cause to be set up a Siva-linga as an\nact ensuring the acquisition of the highest merit, so resolved in his mind,—And on that day,\nin an auspicious moment, having commenced the erection of a beautiful new Oṁkārēśvara\ntemple, a lotus ornament to the earth, which with its skillfully designed maṇṭapas, etcetera,\nmight be called a royal lotus,—from that time to the year Vikrama, the 12th of the bright\nfortnight of Chaitra, Sunday, (26th March 1820), or 2 years 9 months and 25 days,—on that\nauspicious 1,797,421st Kali day,—having completed all the preparations for this great wonder,\nhe caused to be set up the fortune-bestowing Śiva-linga named Oṁkārēśvara, and satisfied his\ndesires;—that is to say, through the power bestowed by the great mercy of the holy Chan\ndraśēkhara, the said divine purpose fulfilling every wish of the mind, the setting up of the\nŚiva-linga was perfectly accomplished.\nWhoso with devotion praise the holy Mahēśvara, to them at all times whatever merit\nmay be obtained will itself become perpetual: which, that it may be known to all people, has\nthis śāsana been written. Be it prosperous.\n\nYearly, for the gods Oṁkārēśvara, `Kumārēśvara, and śrī-Nandiśvara, to be continued in\nperpetuity as long as sun and moon endure, for the daily service, for the offering of food, for\nthe perpetual lamp, for the general service, for the five lunar observances, and for the salaried\nservants, are granted 1,221 one hundred and twenty-one Kaṇṭhīrāyi varaha;\nwhich money, with remission on grain, cloths and other articles, to be granted every year\nfrom the palace-divān’s office treasury for the support of religion, being appointed to be spent\non the services,—it is directed that at the three seasons divine worship be carried on according\nto the śāstras without intermission, that a daily inquiry be held, and that the accounts and\npapers of this temple be examined annually.\n\nSuch is the decree for the allowance. By order. The Kali year 4922, the year Vikrama,\nthe 22nd of the true Jēshṭha, Monday.\n(Signed) Śrī-Linga-Rājēndra-Vaḍeyar.\n\nFootnote\n1. Hālēri.", "text_roman": "svasti śrī-vijayābhyudaya-śālivāhana-śaka-varsha 1739 ney Īśvara-samvatsarada\nJēshṭha-bahula-bidigeyu Bhānuvārakke Kali-dina 1796392 ne yi-śubha-divasadalli Chandra-\nRik-śākhigalāda Vīra-Śaiva-mata-dhurīṇa-pravīṇarāda śrīmat-Koḍagu-samsthāna-samsthita-\nsamādya Kshiṇanagara-madh-ya-paribhṛjamāna-maṇi-gaṇa-khachita-chāru-simlāsānarūḍhar-\nāda apratima-pratāpa - prakāśa - prahasita - mārtāṇḍa - maṇḍalarāda akhaṇḍakhaṇḍa¹-\nvaibhava-samētarāda sakala-digantarāla-vidyōttama-samāna-śhāna-kīrti-prakhyātarāda samasta-\npraśasta-rājadharm-āvadhārana-Yudhishtḥirarāda mahārāja-Appāji-Rājēndraravara pau trar-\nāda Linga-Rājēndra-Vādeyaravara putrarāda śrī-Linga-Rājēndra-Vādeyaravaru yi-lōkadalli\ntat-kāraṇadinda mahattāda-puṇya-phala-pradāyakavāgi-yiruvanthā Śivalinga-pratiṣhṭāpanaī\nkartavyav-endu chittadalli niéchaiśi tad-divasa-śubha-muhūrtadalli asadruśa śrī-kuśala-\n\nmautapādi-yukta rājakamalākar-ākhyā padmakarābhirāma nūtan-Ōmkārēśvara-dēvasthāna\nvannu prārambhuisi tad-ārabhya Vikrama-samvatsarada Chaitra-śuddha-dvādasiyu-Bhānuvā\nrada-varige varusha 2 tingalu 9 dina 25 Kali-dina 1797421 ne yētadrusa su-divasadalli\naty-āścharyakavāndhāddannu sāmagriyāvägi nirmisi śrīkaravāgi-yiruvantha Ōmkārēśvara-\nnāmaka-Śīvalingavannu pratishtāpisi santushta-chittarāddu hyägandare śrīmach-Chandra-\nsēkharana parama-kypāṇugraha-sāmarthyadinda sakala-manōratha-pradavāgi-yiruvantha\nyētad-dēvatā-yatna Śīvalinga-pratishtāpana-u nirvighnadinda virachitay-āyitu yāru bhakti-\nyinda śrī-Mahēśvarana bhajisuttārō avarige sarvatra-anikara-sādhyavāgi-yiruvantha śubha-\nphala-u svayam-ēva sādhyay-āguttade yendu sarva-jana parijuānārthāvāgi barasi-yiruvantha\nśāsana || śubham astu ||\n\nantu varusha 1 kke Ōmkārēśvara-Ganadhīsvara-Kumarēśvara-śrī-Nandīśvara-dēvarige\nsaha āchandrārkavāgi śāśvitadinda nadadu-baratakka-bagye nitya-kyla amrita-padi nandā-\ndīpa viśēsha-katle pancha-parv  ಯಂತ್ರದ್ರೆ ತಾಯುತ್ತಿ ಶಿವಲಿಂಗಪ್ರತಿಷ್ಠಾಪನಲು ನಿರ್ವಾಥೃ ದಿಂದ ವಿರಚಿತವಾಗಿರುವ ಯಾರು ಭಕ್ತಿಯಿಂದ ಶ್ರೀ ಮೇರೇಶ್ವರದ ಭಜಿ ಸುತ್ತರಾರೋ ಅವರಿಗೆ ಸೇವರ್ಗ ಅನೀರಸದ್ವಾಯ್ಯಾಗಿ ಇರುವಮಂಥ ಕುಭಫಲಗಳು ಸ್ವಯಮೇವ ಸಾಧ್ಯವಾಗುತ್ತದೆ ಯೋಂದ್ ಸಮರ್ಜಿನಸರಿಜನ್ಯಾ ನಾಥವಾ ಗಾಗಿ ಬರೆಯಿರುವುಮಧ ಶಾಸನ | ಶುಭಮಸ್ತು ||\nಅಂತು ವರುಷ ೧ ಕ್ಕೆ ಓಂಕಾರೇಶ್ವರಗಣಾಧಿಪಶ್ವರಕುಮಾರೇಶ್ವರ ಶ್ರೀನಂದೀಶ್ವರ ದೇವರಗೆ ಸಹ ಆಚಾರ್ಯ ಕರ್ವಾಗಿ\nಶಾಸ್ತ್ರದಿನದ ನಡೆದುಬರತಕ್ಕಬ್ರುತ್ಯ ನಿಕ್ಕಬಟ್ಚೆ ಅಮೃತಪಡಿನೊವಾಧಿನ ವಿಶೇಷಕಟ್ಚೆ ವಂಜಪನೆಸಂಬಳಗಾರ ಜನಕ್ಕಾ\nಸಹ ಆನೆಶಕ.ಒಡಿಸಿ ಯುದವೆ ಕರ್ತೇರಾಮಿ ಇಂ.೧೧ ವಂಡುಮಾವೀರ ಯೆನ್ನರೆ ಯೆವ್ಯತೊಂದೆವರಕ್ಕೆ ಹೆಣದಿಂದ\nಜೀವಿತಫಲಮೂತದರಿಂದ ಉತ್ತರವೆನ್ನ ಧರ್ಮಸರ್ಗಹುದಗೆಲ್ಯೆ ಅರುಮನೆ ದಿವಾಕಚ್ಛೇರಿ ೪ನ್ನಾಂತ್ಸಿನಿಂದ ಪ್ರತಿ\nಸಂವತ್ಸರದಲ್ಲೂ ಕೊಡಿಸಿ ಕೊಟ್ಟು ಸೇವಾಫರ್ಘವಾಗಿ ವಿನಿಯೋಗಕ್ಕೆಂದು ನೇಮಿಸಿಮುಖಿರುವಂತವರೆಂದೆ ಕಾಲತೆಯದರಲ್ಲಿ\nಶಾಸ್ತ್ರ )ಪ್ರಕಾರ ದೆವಿತಾಸೇತ್ನೆಯನ್ನು ಸಾಂಗವಾಗಿ ಮಾಡಿಸುತ್ತಾ ದಿನಪ್ರತಿ ನಿಕಾಸಿಕೊಂಡು ವರುಷಂ ಪ್ರತಿ ರು.೨೧\nದೇವಸ್ಥಾನದ ಲೆಕ್ಕಕ್ಕಮುಂತಾದ್ದು ನನ್ನ ಜಡಿ ತೆಗದು ಕಾಲಚ್ಚ್ಯತೆ ಬರುವವಾಗಿ ಯೊಂಬ ತೆಸ್ತೆಳು ನಿರೂಪಕ ಆಪ್ಪಣೆ\nಪ್ರಕಾರ ಕಳಿವಸ೯ ೪೯.೧೧ ನೆ ವಿಕ್ರಮಸಂಬತ್ಸರದ ನಿಜಪಕ್ಷ್ಯಂ ತಾರೀಖ ೩೦ ನೆ ಭಾನುವಾರ ॥\nಶ್ರೀಲಿಂಗರಾಜೇಂದ್ರ ವಡೆಯೆವರದು ॥", "roman_pages": [68, 69], "original_pages": [124, 125], "translation_pages": [100, 101]}, {"id": "epca|I|18", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 18, "find_spot": "On a stone at Kibbeṭṭa.", "date": "Date 1831 A.D.", "translation": "In the year Khara, on the 1st of the dark fortnight of Kārttika,—Channaiya’s guru\nRājaiya’s younger brother’s son Channa, for the worship of incense and lights to the god\nMallikārjuna,—having made obeisance to Vi(ra-Rājēndra)-Vaḍeyar,—presented as described\nSet up at sunrise.", "text_roman": "Kara-samvatsarada Kārtīka-ba 1 rallu Channaina guru-u Rājaiyyanavara tammana\nkumāru Channa Mallikārjuna-dēvarige dūpa-dīpa-ārādhanege Vi || Vaḍeyara namaskāra-mādi\nkoṭṭa vivara udeya-kāladalli stāpane-mādiddu.", "text_original": "ಕೆಬ್ಬೆಟ್ಟ್ದಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\n\nಖರೆ ಸಂವತ್ಸರದ ಕಾರ್ತಿಕ ಬ ೧ ರಲ್ಲೂ ಚೆನ್ನೈನ ಗುರುಲ ರಾಜ್ಯಾಖ್ಯಾನವರೆ ತಮ್ಮುನ ಕಮಾರ ಚನ್ನ ಮಲ್ಲಿಕಾರ್ಚನವೆರ್ನರಿಗೆ ದೋಸದಿನ ಆರಾಧನೆಗೆ ನಿ ॥ ಮೆಸೆಯರ.ನಮಸ್ಮಕಾರಮಾಡಿ ಕೊಟ್ಟು ವಿವರ ಉದೆಯಕಾಲದಲಿ, ಸ್ಥಾಪನೆ ಮಾಡಿದು -\n\n98", "roman_pages": [69, 69], "original_pages": [125, 140], "translation_pages": [101, 101]}, {"id": "epca|I|19", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 19, "find_spot": "On a stone at Iggoḍlu.", "date": "Date 1831 A.D.", "translation": ". . . the 1st of the dark fortnight,—the devotional copper-tablet that Vīra-Vaḍeyar\nset up at the Aigala-matha of the [Hālēri] land (in (memory) of the courage of Hālēri Mamadai-\narasa’s son.", "text_roman": ". . . . . . de ka bauļa 1 neyallu Vira-Vaḍeyaru Hālēri Mamadai-arasinavara\nkuvara vīriyadalli mādida bhakti-tāmbra [Hālēri]-bhūmiya Aigala-mathakke.", "text_original": "ಇಗೋಳ್ಳಿಯಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\n\n..................ದೇಕ ಬಲುಳ ೧ ನೆ ಯಲ್ಲ್ಯ, ವೀರೆವಡೆ ಸುರು ಹಾಲೇಲಿ ಮಮ್ಮುನೆ ಅರೆಸಿನವರೆ ಕುವರ ವೀಲಯವದೊಲ್ಲಿ ಮಾಡಿದ ಭಕ್ತಿ ತಾಂಬ (ಹಾಲೇಲಿ) ಭೂಮಿಯ ಬಗಳಮತಕ್ಕೆ.", "roman_pages": [69, 69], "original_pages": [125, 125], "translation_pages": [101, 101]}, {"id": "epca|I|20", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 20, "find_spot": "On a stone at Danugal.", "date": "Date 1831 A.D.", "translation": "In the auspicious year named Khara, on the 10th of the bright fortnight of Āśvija,—to\nSiddalinga-svāmi of the Yeḍatore-maṭha.\n\n60\nvillages having a ground rent of 50 varaha for bijavari of 50 bhaṭṭis, deducting the former\ngrants for pura-varga, dēva-mānya, bhūta-uttāra, and nāyi-maṇṇu, altogether a ground rent\nof $17\\frac{1}{4}$ varaha for $17\\frac{1}{4}$ bhaṭṭis, the ground rent of the remaining free land, $32\\frac{1}{4}$ varaha for a\nbijavari of $32\\frac{1}{4}$ bhaṭṭis. Total, from the 4 villages, after deducting the former grants, ground\nrent of free land coming to the matha, $-69$ varaha, and 700 bhaṭṭis of produce.\nHaving presented this in this tithi, with the erection of stones stamped with the linga,\nin the presence of the people of the four villages,-with the desire that father and all other\nancestors may attain to the eternal Śiva-lōka, there are given, within the four boundaries of\nthese villages marked out by the erection of stones stamped with the linga, the eight rights of\nfull possession, namely, hidden treasure, underground stores, springs, timber, minerals, present\nprofit, future profit, actualities and possibilities, etcetera; and the whole of that land, as an\noffering to Śiva, in order that performing the worship of the gaṇas, at the time of Śiva-pūjā\nmay be recited the hymn of blessing (saying)-\nRecollection of former births, dominion of the world, the glory of good fortune, surpassing beauty,\nFaith in thee, knowledge, long life, (objects of) desire,-(of these) be thou giver to me, Śankara, from age to age,-\nhas been written and given this grant of land.\nWitnesses thereto:-Sun and moon, wind and fire, sky, earth and water, heart (or\nconscience) and Yama, day and night, and the two twilights; these know the deeds of a\nrighteous man.\nThan making a gift oneself, to protect another's gift is twice as meritorious : by taking\naway another's gift one's own gift becomes fruitless.\nApproval to the gift of land in my own hand,\n(Signed) Śrī-Vi.\n\n15\nDate 1808 A.D.\nKali expired 4909.\n\n16\nDate 1815 A.D.\nIn the year Yuva, the 5th of the bright fortnight of Jēshṭha; the Virakta-maṭha of\nChilala Śhaka-svāmi.\n\n17\nDate 1820 A.D.\nBe it well. In the year 1789 of the victorious increasing Śālivāhana era, the year\nĪśvara, on the 2nd of the dark fortnight of Jēshṭha, Sunday, (1st June 1817), the 1,796,892nd\nKali day,-on this auspicious day,-like a pārijāta to the milk ocean the Chandra-vamśa, born\nin the Bhāradvāja-gōtra, of the Āśvalāyana-sūtra and Rik-śākha, proficient in supporting the\nVira-śaiva religion, seated on the illustrious jewelled and beautiful throne in the ancient\nKshīra-nagara 1 in the auspicious Kodagu-samsthāna, a sun in unequalled valour and glory,\nof uninterrupted splendour, of a fame which illustrated all the points of the compass, a\nYudhishthira in upholding all manner of royal virtues, - the mahārāja-Appaji-Rājēndra's\ngrandson, Linga-Rājēndra-Vaḍeyar's son, śrī-Linga-Rājēndra-Vaḍeyar, reflecting that by the\n\nperformance in this world of good deeds must be obtained the perfection of fruit in both this\nworld and the next, and that with that object he should cause to be set up a Śiva-liṅga as an\nact ensuring the acquisition of the highest merit, so resolved in his mind,—And on that day,\nin an auspicious moment, having commenced the erection of a beautiful new Oṃkārēśvara\ntemple, a lotus ornament to the earth, which with its skilfully designed maṇṭapas, etcetera,\nmight be called a royal lotus,—from that time to the year Vikrama, the 12th of the bright\nfortnight of Chaitra, Sunday, (26th March 1820), or 2 years 9 months and 25 days,—on that\nauspicious 1,797 421st Kali day,—having completed all the preparations for this great wonder,\nhe caused to be set up the fortune-bestowing Śiva-liṅga named Oṃkārēśvara, and satisfied his\ndesires;—that is to say, through the power bestowed by the great mercy of the holy Chan\ndraśēkhara, the said divine purpose fulfilling every wish of the mind, the setting up of the\nŚiva-liṅga was perfectly accomplished.\n\nWhoso with devotion praise the holy Mahēśvara, to them at all times whatever merit\nmay be obtained will itself become perpetual: which, that it may be known to all people, has\nthis śāsana been written. Be it prosperous.\n\nYearly, for the gods Oṃkārēśvara, Kumārēśvara, and śri-Nandīśvara, to be continued in\nperpetuity as long as sun and moon endure, for the daily service, for the offering of food, for\nthe perpetual lamp, for the general service, for the five lunar observances, and for the salaried\nservants, are granted 1,221 one thousand two hundred and twenty-one Kanthīrāyi varaha;\nwhich money, with remission on grain, cloths and other articles, to be granted every year\nfrom the palace-dīvān's office treasury for the support of religion, being appointed to be spent\non the services,—it is directed that at the three seasons divine worship be carried on according\nto the śāstras without intermission, that a daily inquiry be held, and that the accounts and\npapers of this temple be examined annually.\n\nSuch is the decree for the allowance. By order. The Kali year 4922, the year Vikrama,\nthe 22nd of the true Jēshṭha, Monday.\n(Signed) śri-Liṅga-Rājēndra-Vaḍeyar.\n\n18\nDate 1831 A.D.\n\nIn the year Khara, on the 1st of the dark fortnight of Kārttika,—Channaiya's guru\nRājaiya's younger brother's son Channa, for the worship of incense and lights to the god\nMallikārjuna,—having made obeisance to Vi(ra-Rājēndra)-Vaḍeyar,—presented as described\nSet up at sunrise.\n\n19\nDate 1831 A.D.\n\n. . . the 1st of the dark fortnight,—the devotional copper-tablet that Vira-Vaḍeyar\nset up at the Aigala-maṭha of the [Hālēri] land in (memory of) the courage of Hālēri Mamadni-\narasa's? son.\n\n20\nDate 1831 A.D.\n\nIn the auspicious year named Khara, on the 10th of the bright fortnight of Āsvija,—to\nSiddaliṅga-svāmi of the Yeḍatore-maṭha.\n\n62\n\nFootnote\n1. Hālāri.", "text_roman": "śrīmatu Khara-nāma-samvatsarada Āsvija-śuddha 10 rallu Yejatore-maṭṭada Sidda-\nlinga-svāmiyarige.", "text_original": "ಧನುಗಲ್ಲಿನಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\n\nಶ್ರೀ )ಮತು ಬರುನಾಮೆ ಸಂವತ್ಸರದ ಅಪ್ಪೋಜಿ ಕುದ್ದೆ ೧೦ ರಲ್ಲೂ ಯೆಡತೊರೆ ಮಟ್ಟದ ಶಿಡ ಲಿಂಗಸ್ವಾಮಿಯುವರೆಗೆ.", "roman_pages": [69, 69], "original_pages": [125, 125], "translation_pages": [101, 104]}, {"id": "epca|I|21", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 21, "find_spot": "On a stone at Mayamuḍi.", "date": "Date 1831 A.D.", "translation": "The holy god Gangādhara.\nVira-Rājendra-Vaḍeyar.", "text_roman": "śrī.-Gangādhara-dēvaru.\nVira-Rājēndra-Vaḍeyaravaru.", "text_original": "ಮಯಮಡಿಯಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\nಶ್ರೀ)ಗಂಗಾಧರದೇವವರು ॥  ವೀರರಾಜೇಂದ್ರ ವಡೆಯೆವರದು", "roman_pages": [69, 70], "original_pages": [125, 125], "translation_pages": [104, 104]}, {"id": "epca|I|22", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 22, "find_spot": "*On a stone at Irpi.*", "date": "Date 1841 A.D.", "translation": "In the Śālivāhana-śaka year 1763, the year Śārvari, the raiyats of the Kiggatṭu ten\nnāds have through their faith repaired the temple of the god Rāmēśvara of Irpi on the\nLakshmaṇtīrtha (river).", "text_roman": "Śalivāhana-śaka-varsha 1763 ne Śarvari-samvatsaradallu Kigaṭṭu-hattu-nāḍu raihitaru\ntamma-bhaktiyinda Lakshmaṇatīrthada-bali yiruva Irpina Rāmēśvara-dēvara dēvastana-\nvannu jīrnōddāra māḍisi yiddāre.", "text_original": "ಇಸ್ರ.=ಯಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\n\nಶಾಲಿವಾ ಹನ ಶಕವಷ೯ ೧೩೩೬ ನೇ ಶಾವ=ರಿ ಸಂವತ್ಸರದಲ್ಲಿ ಕೆಗ್ಗಟ್ಟು ಹತ್ತುನಾಡೂ ರೈತುರೆ ತೇಮೆ ಭಕ್ತಿಯಿಂದ ಲಕ್ಷ್ಮೀ ತೀರ್ಥದ ಬಲಿಯಿರುವ ಇರ್ಪಿನ ರಾಮೇಶ್ವರ ದೇವರ ದೇವಸ್ಥಾನವನ್ನು ಜೀರ್ಣೋದ್ಧಾರ ಮಾಡಿದೆಯು\nದ್ದಾರೆ.", "roman_pages": [70, 70], "original_pages": [125, 125], "translation_pages": [104, 104]}, {"id": "epca|I|23", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 23, "find_spot": "*On a stone at Mahādēvapura (Mercāra).*", "date": "Date 1842 A.D.", "translation": "Sōmaśēkhara Śiva-yōgīśvara, (spiritually) born from the lotus hands of Śantavīra-svāmi,\ndeputy of the holy Murigi-svāmi, in the Kali year 4643 expired, the year Sōbhanakṛitu, on\nthe 2nd of the bright fortnight of Kārttika, Monday, under the constellation Rōhiṇi, before\n7 o'clock in the morning, erected the kalaśa over this throne.", "text_roman": "śrī-Muriga-svāmigalavara charamūrttigalāda Śantavira - svāmiyavara kara-kamala-\nsanjanitarāda Sōmaśēkhara-Śivayōgīsvararu Kali sanda 4643 ne Sōbhanakṛitu-samvatsarada\nKārttika-śuddha-bidigeyu Guruvāra Rōhiṇi-nakshatra prātaḥkāla gaṇṭe 7 ra vaḷage yi-\ngaddige-mèle kaḷaśa-sthāpane-māḍisiddu.", "text_original": "ಮಹಾದೇವಪುರದಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\nಶ್ರೀ )ಮುರಿಗಾ ಸ್ವಾಮಿಗಳವರ ಚರಮೂರ್ತಿಗಳಾದ ಶಾಂತವೀರಸ್ವಾಮಿಯವರ ಕಾರಕಮಲಸೊಜಿನಿತರಾದ ಸೊಣ್ಣೆ\nಮಹೇವರ ಶಿವಯೋಗೀಶ್ವರರು ಕಾಲಸಿಂದ ೪೬೮ಷಿ ನೇ ಕೌeಭಕೃತು ಸಂವತ್ಸರದ ಕಾರ್ತಿಕ ಶುದ್ಧ ಬಿದಿಗೆಯ ಗುರು\nವಾರ ರೊಹಿಣಿ ನಕ್ಷತ್ರ ವ್ರತಕಾಳಾ ಗಂಚಿ ಒ ರಗೆ ವಾಗಗೌನ್ಯೆಲೆ ಕಾಲಕ್ಕಾಥ್ಮಾನ ಮಾಡಿಸಿದ್ಧ\n11-A", "roman_pages": [70, 70], "original_pages": [125, 125], "translation_pages": [104, 104]}, {"id": "epca|I|24", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 24, "find_spot": "*On a stone at the old village site of Gaṇagūr in Beṭṭiyaṭ-nāḍu.*", "date": "Date 1597 A.D.", "translation": ". . . . . Be it well. In the year 1519 of the victorious Śālivāhana era, the year\nHēvilamba, on the 5th of the bright fortnight of Aévayūja, Tuesday,—of the .\ngōtra, Āśvalāyana-sūtra and Ruk-śākha, Najarāyapattaṇa Śrīkaṇtha-Rājaya's son Rudraṇaṇa\nmade to .\n. . . . a grant of land at Gaṇagūr, in order that his father and mother\nand forefathers might attain to a station in Kailāsa. Whoso destroys the\nvillage granted (is guilty of) .\n. . his father and mother, and (incurs the\nanger) of the ruler) cf Nanarājapaṭṭana .\n. Fortune.", "text_roman": "...... svasti śrī-vijayābhyudaya-Śālivāhana-śaka-varusha 1519 neya Hēvilamba-\nsamvatsarada Aśvayuja-śu 5 Bhaumavāra . . . . . . . gōtrada Āśvalāyana-sūtrada Ruk-\nśakhe [Nanjarāya] paṭṭanaḍa Śrīkantha-lītajayana putrarāda Rudraganapangalu . . . . . .\nravarige Gaṇagūru maha . . . . . ngalu tamma tande-tāyi . . . pitrugalige Kailāsa-\npadavi āgali yendu koṭṭa bhūmi-dāna koṭṭa-gramakke āvan . . . . alipidare tande-tayi\n. . . Nanjarāyappaṭṭaṇada . . . . . . śrī", "text_original": "ಬಟ್ಟೆ ಯತ್ತ ನಾದಿನಲ್ಲಿ ಗಣಗೋರು ಗ್ರಾಮದ ಹಳೆಗ್ರಾಮದ ನಿವೇಶನದಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\n1 ........... ಸ್ವಸ್ತಿ ಶ್ರೀ\n2 ವಿಜಯಾಭ್ಯುದಯ ಶಾಲೀವಹನ\n3 ನ ಶಕವರ್ಷದ ವಂಗ೯ ನೇಯ ರೇವಿಲಂ\n4 ಬಿ ಸಂವತ್ಸರದ ಆಕ್ಚಯುಜಿ ಸು ೫ ಭೌಮ\nವಾರದ\n5 ..... ಗೋತ್ರದ ಅಕ್ಷಲಾಯಣ ಸೌತ್ರದ ರು\nಕು ಕಾವೆ\n6 ನಂಜರಾಯನೆಯ್ತಾನದ ಶ್ರೀಕಂಠರಾಜಯ\n7 ನ ಪುತ್ರನಾದೆ ರುದ್ರಗೇಣಗಳು ನಕುಸಂಜಿ\n8 ......... ಹವೆರಿಗೆ ಗಣಗೋರು ಮಹಾ\n9 ..........ಂಗಗಳು ಕಮ್ಯತಂದೆ ತಾಯಿಯಿ\n10 ......... ದೇವತಾ ಪಿತೃಗಳಿಗೆ ಕೈಲಾಸ\n11 ಸದವಿ ಅಗಳಿಯಂದು ಕೊಟ್ಟ ಭೂಮಿದಾ\n12 ನ ಕೊಟ್ಟ ಗ್ರಾಮಗೆಕ ಅವನೆ\n13 ...... ಅಳಿದಿದರೆ ತಂದೆತಾಯಿ\n14 ....... ಜದವೆನಲ್ಲಿ ನಂಜರಾಯ\n15 .......ನಾಡದು ಜಮಗೇಯ ಅಮಂದೆ\n16 .......ಅತೆಯಿ ನಾಕಶೆಯ ಅನತರೊ\n17 ........ಶ್ರೀ", "roman_pages": [70, 70], "original_pages": [126, 126], "translation_pages": [104, 104]}, {"id": "epca|I|25", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 25, "find_spot": "*On a stone slab in the wall of the Commissioner's Office, Mercāra*", "date": "Date 1824 A.D.", "translation": "Vi\nMaharaja Veer Rajender Wadeer 1\n\nBe it well. In the year 1743 of the victorious Śālivāhana era (= 1822 A.D.), the year Ishu,\non the 11th of the bright fortnight of Pālguna, Sunday, the 1,798,128th Kali day, on this\nauspicious day,-When, a tree of paradise from the milk ocean the Lunar race, born in the\nBhāradvāja-gōtra, of the Āśvalāyana-sūtra and Ṛik-śākha, fully conversant with the Vira-\nŚaiva creed, seated on the beautiful throne resplendent with clustres of jewels in the\nimmaculate Kshiranagara 2, situated in the fortunate Kodagu samsthāna, eclipsing by the\nglory of his valour the brightness of the sun, an Ākhaṇḍala (Indra) of unbroken (akhanda)\nwealth, celebrated with a fame which pervaded all the points of the compass, in possessing\nall distinguished royal virtues a Yudhiśhthira,-the Mahārāja Linga-Rājēndra-Vaḍeyar's\ngrandson, Linga-Rājēndra-Vaḍeyar's son, śrī-Vira-Rājēndra-Vaḍeyar, with justice, mercy and\nrectitude was ruling the empire of the world, at all times devoted to meditation on\n\n1 In English capital letters.\n\n2 Hālāri.\n\n63\nMahādeva ;-after some time, the elephants in his country having increased beyond bounds,\nwere causing destruction to the fruits and crops raised by men for their sustenance, killing\nwayfarers, and doing damage to the houses,—so, when the subjects respectfully petitioned\nthat they were unable to bear these calamities, considering in his mind that it is the duty of\na king to put down the evil and uphold the good, he prayed to Gaurīdhava (Śiva) to give\nhim power to remove these troubles, and having gained the help of Śāmba-Śaṅkara's (Śiva's)\nsupreme favour, from that date to the year Tāraṇa (= 1824 A.D.), the 12th of the dark\nfortnight of Chaitra, Monday,—2 years, 1 month and 25 days,—to the 1,798,913th Kali day,—\nduring those days, going among the herds of rutting elephants ranging in the midst of the\nforests by means of his painted chariot like a lion, he made good the pronunciation of gaja\n(elephant) in the popular form aja (goat).\n\nThe number of elephants which by the valour and power of his arm he in various ways\nbrought to an end, and of those which by his orders trained soldiers captured alive with\nchains, is as follows:—In the year Chitrabhānu (1822 A.D.), on the 10th of the dark\nfortnight of Āshāḍha, in Nanjarāyappaṭṭaṇa tālok, elephants killed 6, captured 9; on the 7th\nof the dark fortnight of Śrāvaṇa, in the same tālok, elephants killed 42, captured 29; on the\n5th of the bright fortnight of Adhika Āśvayuja, in the same tālok and in Uluguli-Mūdigēri-\nnād, elephants killed 47, captured 15; on the 11th of the same bright fortnight, in Nanja-\nrāyappaṭṭaṇa tālok, Horūr-Nūrokkal-nād and Uluguli-Mūdigēri-nād, elephants killed 34,\ncaptured 6; on the 11th of the bright fortnight of Nija Āśvayuja, in Nanjarāyappaṭṭaṇa tālok,\nelephant killed 20, captured 6; in the year Svabhānu (1823 A.D.), on the 5th of the\nbright fortnight of Nija Chaitra, in Kodagu-Śrīraṅgapaṭṭaṇa, elephants killed 4, captured\n18; on the 3rd of the bright fortnight of Vaiśākha, in Beṭṭiyatta-nād and Channanakōte,\nelephants killed 21, captured 41; in the year Tāraṇa (1824 A.D.), on the 12th of the\ndark fortnight of Chaitra, in Kigaṭṭu-nād, elephants killed 10, captured 40; on thirty other\ndays, elephants killed 49, captured 24 ;-altogether, in thirty-eight days, elephants killed by\nhis own hand 233, captured alive by trained soldiers according to order 181 ;-total\nof both 414.\n\nIn this manner the desires of all being accomplished, astonishment was expressed as\nfollows:-In the forests, herds of elephants, towering like mountains, hid the sun as when\nthe sky is overcast with storm-clouds, and roamed about trumpeting; but with seven-tongued\nweapons (fire-arms) like thunderbolts he slew them in a moment, while men captured alive\nstout and lofty rutting elephants as if they were mice,—this was indeed a marvel.", "text_roman": "Maharaja Veer Rajender Wadeer 1\n\nsvasti śrī-jayābhyudaya-Śālivāhana-śaka-varsha 1743 ne Ishu-samvatsarada Phālguna-\nśuddha 11 yu Bhānuvārakaḍe Kali-dina 1798128 ne yi-śubha-divasadalli Indu-vamsa-kshīra-\npārāvāra-pārijātāyamānarāda Bhāradvāja-gōtra-sañjatarāda Āśvalāyana-sūtra-Rik-śakhigal-\nāda Vira-Śaiva-mata-dhurīṇa-pravinarāda śrīmat-K o d a g u-samsthāna-samsthitānavadhya-\nKshīranagara-madhya paribhrājamāna-maṇi-gana-khachita-chāru-simhānārūḍharāda\napratima-pratāpa-prakāśa-prahasita-mārttanda-maṇḍalārakhaṇdalākhaṇḍa-vaibhava-\nsamētarāda sakala-dig-antarāla vidyōttamāna-kirtti-prakyātarāda samasta-praśasta-rājadharmm-\nāvadharana-Yudhishṭhirarāda mahārāja-Linga-Rājendra-Vādeyarapautrarāda Linga-\nRājendra-Vādeyaravara putrarāda śrī-Vīra-Rājēndra-Vādeyaravaru sad-dharma-suśila-\nsucharyadinda prithvi-sāmrajyam geyutta anugāladallu Mahādēva-dhyāna-pararāgi irut-iruva\ntad-anantara sva-dēśadallu varanaqaḷu mitimiri mānavarutamma udara-pōshaṇ-ārthavāgi\nrachisi-iruvanthā phala-pairugalannu karadu-māḍiddarindalu pāntha-janarannu himse-\ngaiddarindalu bhavan-ōpadrava-gōlisiddarinda sahinta pappa-bhādhegalinda nistarisalārev-\nendu prajegalu binnaisalagi dushta-nigraha-śishṭa-paripālane yesaguvanthāddu rājadharmmav-\nendu chiṭṭadallu avadharisi yidannu pariharisatakka-sāmarthyavannu karunisabēk-enta\n\nGauridhavanuge prārthisalāgi tat-Samba-Śaṅkarana prama-kripānugraha-sahāyav-āda-kāraṇa\ntad-dinad-ārabhya Tārana-samvatsarada Chaitra-ba 12 yu Chandravāra-paryanta varusha 2\ntingalu 1 dina 25 kke Kali-dina 1798913 ētādṛiśa-divasada-valage araṇya-madhyadalli\naitaruva-matta-gajagala samūhakke tad-vāhanālankāra-yuktadim chittaisi kaṇṭhīravanavol\npaḍi-paṭṭi gajagal-emba uchcharaṇege nāpnuḍi-kānipante aja-sadṛiśam gaidu sva-sāmarthyada\nbhuja-bala-parākramadinda vidha-vidhadallu virāma-gaida-kunjaragalu appane-prakāra\npaṭu-bhaṭaru sa-jīvadina kaisere-hidida nigalu dahītu sala gaṇane-yaśḥt-endare Chitrabhānu-\nsamvatsarada Āshāḍha-ba 10 lu Nañjarāyapaṭṭaṇa-tālōkinalli layavāda-āne 6 kaisere-hidida-\nāne 9 Śrāvaṇa-ba 3 llu sadari-tālōkinalli layavāda-āne 42 kaisere-hidida-āne 22 adhika-\nĀśvayuja-śuddha 5 llu sadari-tālōkinalli Uluguli-Mūdigēri-nāḍinalli saha layavāda-āne 47\nkaisere-hidida-āne 15 1 śuddha 11 lu Nañjarāyapaṭṭanada-tālōkinalli Horūru-Nūrokkalu-\nnādinalli Uluguli-Mūdigēri-nādinalli saha layavāda-ā ne 34 kaisere-hidida-āne 6 nija-\nĀśvayuja-śuddha 11 lu Nañjarāyapaṭṭanada-tālōkinalli layavāda-āne 20 kaisere-hidida-āne\n6 Svabhānu-samvatsarada nija-Chaitra śuddha 5 llu Kodagu-Śrīrangapaṭṭanadalli layavāda-\nāne 4 kaisere-hidida-āne 18 Vaiśākha-śuddha 3 llu Beṭṭiyatta-nāḍinalli Channanakōṭeyallu\nsaha layavāda-āne 21 kaisere-hidida-āne 41 Tāraṇa-samvatsarada Chaitra-ba 12 llu Kigaṭṭu-\nnādinallu layavāda-āne 10 kaisere-hidida-āne 40 yitara-trimśad-dinadallu layavāda-āne 49\nkaisere-hidida-āne 24 antu ashṭa-trimśad-divasakke sva-hastadinda layavāda-āne 233 paṭu-\nbhaṭaru appane-prakāra prāṇa-yuktavāgi pāṇi-grahanaV-esagida-āne 181 ubhayam gaja 414\nI-teradallu sakala-manōratha-prada-āgalāgi vismaya-paṭṭaddu hyāge andare vipinagalallu\nadri-samānitav-āda kari-samūhavu dinakaranannu mēgha-jāla-mutthva teradante bhōrguḍi\nsutā gamisai-āgi siḍilin-ōpadi-yiruvanthā saptarōchitāstra-āyudhaṁgalida tat-kshanadallu\nnigrahisidanthāddu sthūlōnnatavar-āgiruvantha mada-gajagalannu mūshikan-ante bhāvisi\nmanujaru prāṇa-samētavāgi parigrahisi-iruvantha atyāścharya.\n\nFootnote\n1. In English capital letters.", "text_original": "ಮಡಿಕೇರಿಯಲ್ಲಿ ಕಮಿಷನರ ಕಛೇರಿಯ ಗೋಡೆಗೆ ಕಟ್ಟ್ಬಿರುವ ಶಿಲಾಶಾಸನ\n\nವಿ\n\n1 ಸ್ವಸ್ತಿಶ್ರೀ ಜಯಾಭ್ಯುದಯ ಶಾಲೀವಹನ ಶಕವರ್ಷ ೧೩೪೧ ನೇ ಇಸವಿ ಸಂವತ್ಸರದ ಪೌಲ್ಗುಣಖ್ಯು ೧೧\nಯು ಭಾನ್ಯುವಾರದೆ\n2 ಕ್ಯ ತಳಿದಿನೆ ೧೩೯೪೮೧ ನೇ ಈ ಶುಭದಿವಸದಲ್ಲಿ ಯೂದುವೆಸಕ್ಷ್ಮೀಸವರಾಣಿಪರಾರಿಪಾಜತಾಯ\nಮಾನನಂದೆ |\n3 ಧರಣ್ಯಾಜಗೋದ್ರ ಸಾಂಜೇತರಾದ | ಆಕ್ಚಲಾಯಣಸೌತ್ರಮುಕಶಾಖೆಗಳಾದೆ | ವೀರಕ್ಷತಿವಮೆತಧುರೀಣಾ\nಪ್ರವೀಣರಾದೆ |\n4 ಶ್ರೀ ಮಹೇಂದ್ರಸಂಸಂಖ್ಯಾನಸಂಸ್ಥಾನದ ಶ್ರೀಕೇನಗಣಮದ್ಯನಭಿಭಾಜಿಮಾನಮಣಿಘಣನುಚಿತೆಚಾರುಸಿಂ\nಹಾಸನೆ\n5 ನಾರೀಧರಾಧೆ| ಆವಪ್ರತಿಮವೃಥಾಪ್ರಕಾಶಪ್ಯಾಪಸಿತಮೂತಾರ್ಣಡಮಂಡೇಲರಾದೆ | ಅಖಂಡಲಾಖಂಮಡೈನ್ಯಭವೆ\nಸಮೇತಕರಾದೆ |\n6 ಸೆಕಲದಿಂಗತೋರಾದೆ| ದಿವ್ಯೋತಮವನಕೇತ್ಮೀಪೃಪ್ರಖ್ಯಾತರಾದೆ | ಸಮಸ್ತ ಪ್ರಶಸ್ತಿ ರಾಜದೇವಮಾವಹೇರಣೆಯೌಧಿ\nಪ್ರೇಂರಾಣದೆ | ಮಹಾರಾಜಲಿಂಗರಾ\nಜೋೇದೇವಡೆಯರ ಪೌತ್ರರಾದ | ಲಿಂಗರಾಜೇಂದ್ರನಡೆಯರವೆರ ಪತ್ರರಾದೆ | ಶ್ರೀ ವೀರೆರಾಜೇಂದ್ರ ವಡೇಯ\nರವರು | ಸದೇವಸೌಶೀಲಯಸುಖೆ\n7 ಯೋದಿಂದೆ ಪೃಥ್ವೀಸಾಮ್ರಾಜ್ಯಭುಗ್ಯುತ, ಅನುಗಾಲದಲ್ಯು ಮಹಾದೇವವಫ್ಯಿನಪರರಾಗಿ ಇರುತ್ತಿರುವ\nತೆಧಿನಂತೆ ಸ್ವದೇಶದಲ್ಲೂ ವಾರಣಾಗಲು\n8 ಮಿತಿಮೀಾರಿ ಮಾನವರು ತಂಮ ಅಧರದೈವಸ್ಥಾಪನವಾಗಿ ರಚಿಸಿರುವಮಂಠ ಫಲಪ್ಯೋರುಗಳನ್ನು ಕರಡು\nಮಾಡಿದ್ದರಿಂದಲು ಪಂಚಪಾತಕನನು\n9 ಹಿಸೆಗ್ಯೆದ ರಿಂದಲು ಭವೇನೌಷಧಗಳೋಗ್ನಿಸಿದ ರಿಂದ ಸಹ ಇಂಥಖ್ಯ ಸಾಧಿಗಲಿಂದ ನಿತ್ಯರಿಸಲಾರೆವೆಂದು\nಪ್ರಜೆಗಳೂ ಬನ್ನಿ ವ್ತಸಲಾಗಿ ದುಷ್ಯು\n10 ನಿಗ್ರಹ ಶಿಷ್ಟ ಪರಿಪಾಲನೆ ಯೊಸೆಗುವದೆಧುವ ರಾಜಧರ್ಮವೆವಂದು ಚಿತ್ರದಲ್ಲೆ ಅದಧರಿಸಿ ಯಿದವನ್ನು ಪರಿಹರಿ\nಸೊಕ್ಕ ಸೌಮಖ್ಯಮ್ಮು ಕರುಣಿ\n11 ಸಬೇಕಂತ ಗೌರೀದೇವನಿಗೆ ಪ್ರಾರ್ಥಿಸಲಾಗಿ ತತ್ತ್ಯಾಂಬಿಕಕರಣೆ ಪರಮಕೃಪಾನುಗ್ರಹಸುಹಾವಾದೆ\nಕಾರಣ ರಿಧಿ ನಾರಾಬೆಟ್ಟ ತಾರಣಾ ಸಂವೆತ್ಮರದ\n\n13 ಜ್ಯೇಷ್ಠ ಬ ೧೨ ಯು ಚೌದವಾರ ಪರ್ಯ್ಯಂತರ ವೇದಪ್ಪಿ ೨ ತಿಂಗಳು ದಿನ ೫೬ ಕ್ಕೆ ಕಲಿದಿನ ೧೩೯೪೯೧೩\n  ಪ್ರಾತ್ಯಕ್ಷ ದಿವಸದವೆಳಗೆ ಅರಣ್ಯಮಧ್ಯೆ\n14 ದಲ್ಲಿ ಬಿಳರುವ ಮುತ್ತಗೇಗಳ ಸಮೂಹಕ್ಕೆ ತದ್ವಾಹನಲಂಕಾರಯುಕ್ತಿದಂ ಚಿತ್ರ ಬ್ರಿಸಿ ಕಂಟೀರವೇನ\n  ನೃಪಲ್ ಸದಿನೆಟ್ಟೆ ಗಜಗಳಂಬು ಆಹಬ್ ರಣಗೆ\n15 ನಾಣ್ಯಾ ದಿ ಕಾರಣಂಠ ಅಜ್ಞ ಸದ್ಭಂಗಿಗೊ ಮೈ ಸ್ಪೌಸಮರ್ಥ್ಯದ ಭುಜಬಲ ಪರಾಕ್ರಮದಿನಿದ ವಿಧಿನಿದಳನ್ನಿ\n  ರಮಣ್ಗೈದ ಕಂಜಿಗರು ಅಪ್ಪುವೆಪ್ಪಿ\n16 ಕಠರ ಪಟುಭಟೇರು ಸಜಿವದಿಂದ ಕೃಸೆನೆ ಹಿಂದೆ ದಂತಿಗಳು ಸೇನ ಗಣನೆ ಯೆಸ್ತೆಂದರೆ ಚಿತ್ರಭಾನು ಸಂವತ್ಸ\n  ರದ ಅಷಾಢ ಬ ೧೦ ಲಗ್ನ ನೊಂತ್ಯಾಯ\n17 ಪಟ್ಟಣ ತಾಳೋಕಿಶೆನಿ ಲಯವಾದ ಅನೆ ೨ ಕೃಸೆರೆಂದಿದ ಅನೆ ೯ ಶ್ರಾವನ ಬ ೨ ಲಗ್ನ ಸದಿ, ತಾಳೋಕಿಶೆನಿ,\n  ಲಯವಾದ ಅನೆ ೪ ಕೃ ಸೆರೆಹೋದಿದ ಅನೆ\n18 ಆನೆ ೨೨ ಅನೆಕ ಅಕ್ಷಯೋಜು ಕೃ ೫ ಲಗ್ನ ಸದಿ, ತಾಳೋಕಿಶೆನಿ ಉಲುಗುವಿ ಮೂಡಗೇಲಿ ನಾಹಿನಲ್ಲಿ ಸಹ\n  ಲಯವಾದ ಅನೆ ೪ ಕೃ ಸೆರೆ ಹೋದಿದನೆ ೫\n19 ಈಕ್ಸ್ ವ ೧೧ ಲಗ್ನ ನೊಂತ್ಯಾಯ ಪಟ್ಟಣ ತಾಳೋಕಿಶೆನಿ, ಹೌರರುಸುರೋಕ್ಕೃಲು ನಾಡಿನಲ್ಲಿ ಉಲುಗುವಿ\n  ಮುಂಡಿಗೆಲಿ ನಾಡಿನಲ್ಲಿ ಸಹ ಲಯವಾದ ಅನೆ\n20 ೫೬ ಕೃಸೆರೆ ಹೋದಿದ ಅನೆ ೬ ನಿಜ ಅಕ್ಷಯೋಜು ಕೃ ೧೧ ಲಗ್ನ ನೊಂತ್ಯಾಯಪಟಣ ತಾಳೋಕಿಶೆನಿ ಲಯ\n  ವಾದ ಅನೆ ೧೦ ಕೃಸೆರೆ ಹೋದಿದ ಅನೆ ೬ ಸ್ವೆಭಾನುವೆ\n21 ತೃರದ ನಿಜ ಜ್ಯೆತ್ ಸೃ ೫ ಲಗ್ನ ಕೋಡೆಗು ಶ್ರೀರಂಗಪಟ್ಟಣದಲ್ಲಿ ಲಯವಾದ ಅನೆ ೪ ಕೃಸೆರೆ ಹೋದಿದ ಅನೆ\n22 ದಿನಲ್ಲಿ ಜನ್ಮದಕೋಟಿಲಯವು, ಸೆರೆ ಲಯವಾದ ಅನೆ ೨೨ ಕೃಸೆನಿ ಹಿಂದೆ ಅನೆ ೪೧ ತಾರಣ ಸಂವತ್ಸರದ\n  ಜ್ಯೇಷ್ಠ ಬ ೧೨ ಲಗ್ನ ಕೆಗ್ಗಟ್ಟೆ ನಾಡಿ\n23 ಿನಲ್ಲಿ ಲಯವಾದ ಅನೆ ೧೧ ಕೃಸೆರೆ ಹೋದಿದ ಅನೆ ೫೧ ಯಿತರ ತ್ರಿಂಚದಿ ಿನಲ್ಲಿ ಲಯವಾದ ಅನೆ ೪೯ ಕೃ\n  ಸೆರೆ ಹೋದಿದ ಅನೆ ೧೪ ಆಂತು ಅಸ್ಕ್ರಾಂತಿ\n24 ಕಸ್ತೃನಕೆಸ್ಟ್ ಸ್ನೇಹಸ್ಥದಿಂದ ಲಯವಾದ ಅನೆ ೨೩೩ ಸಿಖು ಭಟೇರು ಅಪ್ಪಣೆ ಪ್ರಕಾರ ಪ್ರಾಣಿಮೈಕ್ಸ್ ವಾಗಿ\n  ಪಾಣೀಗ್ರಹಣವಸಾದ ಅನೆ ೨೪೧೮ ಲು\n25 ಭಾಲುಂ ಗಜ ೫೦೪ ಯರಾ ತರೆದಲ್ಯ, ಸಕಲ ಮನೋಲಥ್ ಪದವದಾಗಲಾಗಿ ನಿಸ್ಸಯಬಟ್ ಯುದ್ದ ಹಗ್ಡೆಯೋಧರೆ\n  ವಿಪಿನಾಗಳನ್ನು ಅದಿಸಮಾನಾಧಿಪವಾದ ಕರೀ\n26 ಸಮೋಹೇನ್ನು ದಿನಕರನ್ನೃು ಮೇಘಜಾಲ ಮುಖ್ಯವೆ ತರದೆಂತೆ ಭೂಳಗೂ ದಿಸು ತಾಗಮಿಸಲಾಗಿ ಶಿದಿಲಜ್ಯೋ\n  ಪಾದಿ ಯಿರುವಂಥ ಸಂನ್ಯಾ\n27 ಚೀ(ತಾಸ್ಯೃ) ಆಯುಷ್ಯಳಗಾಂದ ತತ್ಪಾಣದಲಿನ್ನ ನಿಗಲೃಸಿದೇಫಾದದೃ ಸತ್ಯ ಲೋಣಕನವಾಗಿರುವಂಥ ಮುದೆಗೆಜ್\n  ಗಳನ್ನ್ಯಾ ಮುಖಿಕಶಂತತೆ\n28 ಭಾವಿಸಿ ಮನುಜರು ಪತ್ರಣಸಮೇತವಾಗಿ ಪರಿಗ್ರಹಿಸಿರುವೆಂಥ ಆತಾಕ್ಷ ಯೇ", "roman_pages": [70, 71], "original_pages": [126, 127], "translation_pages": [104, 105]}, {"id": "epca|I|26", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 26, "find_spot": "On a stone at Cherala-Sirimangala (Horūr-Mūdigēri-nād), lying in Bhaktanakoṭe", "date": "Date 1544 A.D.", "translation": "In the year 1466 of the auspicious Śālivāhana era, the year Krōdhi, on the 1st of the\nbright fortnight of Chaitra,—śrīman mahā-maṇḍalēśvara Chaṅgālva-Śrīkaṇṭharasu granted to\nLingann-odēr-dēva the land belonging to Bagutanakōṭe, free of all imposts. Whoso destroys\nthis free grant will be in a dreadful hell.", "text_roman": "in the Minakolli forest.\n\nśrīmatu Śālivāhana-śaka-varusha 1466 neya Krōdhi-saṁvatsarada Chaitra-śu 1 lū śrīman\nmahā-maṇḍalēśvara Chamgālva-Śrīkamtharasugalu Liṁgam-oḍēru-dēvarige Bagutanakōṭēge\nsalluva bhūmiyanu sarvamānyavāgi koṭṭaru yi koḍageyanu alupidavuru raurava-narakadalli\nyiruvaru.", "text_original": "[Kannada original]\nಮಡಿಕೇರಿ ತಾಲ್ಯೂಕು ಹೋಜೋರು ಮೂಡಗೇರಿನಾಡು ಚೇರಲ ಸಿರಿಮಂಗಲ ಗ್ರಾಮದ ಸರಹದ್ದಿಗೆ\nಸೇರಿದ ಮೀನಾಕೊಳ್ಳಿ ಕಾಡಿನಲ್ಲಿ ಭಕ್ತ್ ನಳಕೇಟಿಯಲಿ ಬಿದ್ದಿ ರುವ ಕಲ್ಲು\nಪ್ರಮಾಣ ೭' ೬\" × ೨' ೯\".\n1 ಶ್ರೀಮತು ಶಾಲೀವಾಹನ ಶಕರು ೨\n2 ಗಣಿಕಾಟ ನೆಯ ಕೋಣೇಭಿಸವತ್ರದ\n3 ಜ್ಯೇತ್ ಸೃ ೧ ೧೮ ಶ್ರೀಮತ್ತ ಹಾನಮಂಡಲೇ\n4 ಶ್ವರ ಚೋಂಗಾಲ್ಯ ಶ್ರೀಕಂಠೆರಸುವಗಳಳಂ\n5 ಗಣೆಗೋದೇರು ದೇವರಿಗೆ ಬಗಿನಸಕೊ\n6 ಟಿಗೆ ಸೆಲ್ಲುವ ಭೂಮಿಯನು ಸೇಪಮಾ\n7 ನ್ಮನಾಗಿ ಕೊಟ್ಟರು ಯೂ ಕೋಡೆಗಯನರಂ\n8 ಪಿಡೆವರು ರೌರವನರಕದಲ್ಲಿ\n9 ಯಿರುವವರು\n\n[English translation, Gemini-rendered, verify]\nStone lying in the forest of Mīnakōḷḷi, near the boundary of the village of Sirimaṅgala in Cērala, Mūḍagērināḍu, Hōjōru, Madikēri taluk.\nDimensions 7' 6\" × 2' 9\".\n1 Śrīmatu Śālivāhana śakaru 2\n2 gaṇikāṭa neya kōṇēbhisavatrada\n3 jyēt sṛ 1 18 śrīmatta hānamaṇḍalē\n4 śvara cōṅgālya śrīkaṇṭherasuva-gaḷaḷaṁ\n5 gaṇegōdēru dēvarige baginasako\n6 tige selluva bhūmiyanu sēpamā-\n7 nnāgi koṭṭaru yū kōḍegayananaraṁ\n8 piḍevaru rauravanarakadalli\n9 yiruvaravu\n86", "roman_pages": [71, 71], "original_pages": [127, 128], "translation_pages": [105, 105]}, {"id": "epca|I|27", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 27, "find_spot": "On a virakal at Herūr (same nād), lying in paisāri land, Survey No. 56/1.", "date": "Date about 1220 A.D.", "translation": "(Very much effaced).\n. . . . Munivarāditya . . . . had Herūr built . . . . Alapa of Herūr\ndid this and Chaṅgāluva had it decorated. Munivarāditya sending for Malala . . . .\nappointed him as paṭṭaṇa-svāmi . . . .\n\n64", "text_roman": ". . . . . . . . . . . . . . . . . . . . . . . . . . . . leya Māchiga . . . . . . rānega\n. . . . . . . . . . haraha be . . . . . . . . . . . uliya Hērtūra etti kaṭṭisidake\nsvasti śrīmatu . . . Munivarādityam nahō . . . . . uliya Hērtūra etti kaṭṭisidake\ndha magam Herūra kō . . . karambha ga handala . . . . . . munna nela\nnegardda . . . . . nahana arasa . . . . . . epḍala mannane sā . . . lda Herūra Ālapa yidam\n. . . vandu huṭṭidam niba . . . . . . . . . isuva . . . . . . lda karaśi va\nChaṅgāluva alankarisida . . . Munivarādityla Malala . . . . . . kāvaka\n. . . . badalādu paṭṭana-svāmiya sē . . . ya koṇḍu hosa mu . . . . . . kaṭi\n. . . . . . . . . ga oppiga meraba . . . . . . . . . . . . . . . . . .", "text_original": "ಅದೇ ನಾಡು ಹೆದೂರು ಗ್ರಾಮದ ಸವೀ ನಂ. $\\frac{59}{1}$ ರ ಊರುಗುತ್ತೆ ವಿಸ್ತಾರಿ ಜಮಿನಿನ ದಾರಿಯ ಬಳಿ \nಬಿದ್ದಿ ರುವ ನೀರಕಲ್ಲು,\nಪ್ರಮಾಣ $5^{\\prime}\\times3^{\\prime}6^{\\prime\\prime}$.\n(ಮುಳುಬಾಗಗ ಪಾಕ್ಟ ಸಕ ವಡೆದು ಹೋಗಿದೆ)\n\n1 ......ಹರಹುವೆ\n2 ...ಲಯಮಾಚೆಗ\n3 ..ರಾಸ್ನಗ\n4 ...ಸ್ತಿ, ಶ್ರೀನಸ್ತು\n5 ...ಮುನಿವಾರಭಿಕ್ತನನೂ.ಅಳಿಯದೆ \nರೊರ ಎತ್ತಿ ಕಟ್ಟಿ ಸಿದ ಕೆ...\n6 ...ಧಮಗಯೇರೋರಕೋ\n7 ...ಕರಮ್ಯಗೋನ್ನಲ\n8 ...ಮದ್ದೆನಳ- ಮೆನೆದಕ\n9 ...ನಹೂ ಅರಸೆನೆಮೆ ಎ\n10 ತ್ಕಾಲಮನ್ನಣ್ತೋಸ\n11 ...ದೆಮುನ್ನನೆಲಸ\n12 ಟ್ಚಮಂದು ಸುಟ್ಟದನೊಬ \n13 ...ಹ ಇಸುವೆ- ಲ್ಲೆಹೊರೆಯಾಲನೆಯಿಂದ \nಜಂಗಾಲಯವ ಅಲಂಕರಿಸಿದ.\n14 ಮನ್ನಿನವಾರಭತ್ಯಮುಲಲ\n15 ...ಕರೆಸೆವ......ಬಡ\n16 .. ಆಯುತ್ಕಸ್ಥಾನಸ್ವಾಮಿಯಸೇ\n17 ಯಕೋಣ್ಮಯರೋಸಮ\n18 ಕಾವಳ......\n19 ...ಗೆ ಒಪ್ಪಿಗೆಂ ಎರಬ...\n20 ......\n21 ಕಟಿ ದ್ದ ಗ...\n(ಮುಂದೆ ೩ ಪಂಕ್ತೆಗಳು ಹೋಗಿವೆ)\nಕಲ್ಲಿನ ಎಡಪಾಶ್ರ್ವದಲ್ಲಿ-\n25 ...\n26 ಲನ...\n27 ರಮಾ...\n28 ಅಸು..\n29 ಬಟಮ..\n30 ...\n31 ವೆಚಗರ.\n32 ಗಹಕನ್ದ ವಡ .\n33 ಸಯೆ.ದಚಾರಿ\n34 ಜಗದಯಲ .\n35 ತಟುಬವೆ...\n(ಮುಂದೆ ಅಸ್ಪಷ್ಟ)\n\n[Kannada original]\nಅದೇ ನಾಡು ಹೆದೂರು ಗ್ರಾಮದ ಸವೀ ನಂ. $\\frac{59}{1}$ ರ ಊರುಗುತ್ತೆ ವಿಸ್ತಾರಿ ಜಮಿನಿನ ದಾರಿಯ ಬಳಿ \nಬಿದ್ದಿ ರುವ ನೀರಕಲ್ಲು,\nಪ್ರಮಾಣ $5^{\\prime}\\times3^{\\prime}6^{\\prime\\prime}$.\n(ಮುಳುಬಾಗಗ ಪಾಕ್ಟ ಸಕ ವಡೆದು ಹೋಗಿದೆ)\n[English translation, Gemini-rendered, verify]\nA hero-stone lying near the path in the oorugutte extensive land of survey no. $\\frac{59}{1}$ of Hethur village in the same nadu,\ndimensions $5^{\\prime} \\times 3^{\\prime} 6^{\\prime\\prime}$.\n(The lower portion has broken off and gone)", "roman_pages": [71, 71], "original_pages": [128, 128], "translation_pages": [105, 106]}, {"id": "epca|I|28", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 28, "find_spot": "On a *vīrakal* at Andagōve-Kallūr (same *nād*) in *Basavēsvara-dēva’s* jōḍi land,", "date": "Date 944 A.D.", "translation": "(The greater part is effaced).\nBe it well. In Saka 866, the year Krōdhi, . . . . . ma, cutting off his head,\ndied. His family . . . . . gave . . . . . Whoso destroys this has slain tawny cows\non the banks of the Ganges aud killed a Brāhman. Būchaga's mother, as a memorial of the\ndeath of her son, had this set up. Bavanayya wrote it.", "text_roman": "Survey No. 89.\n\n. . . . . . . . . . . . . . . . . . ma tale gadisi satta\nsvasti Śaka 866 Krōdhi-saṁvatsara . . . . . . . hāra . . . . . para koṇḍa\nātana santati . . . . . koṭṭa . . . . . kavileyan alida Brahmatti Büchagan abbā\nsali . . . . . ram . . . . Gange . . . . . . . ṟisida baredam Bavanayya.\ntana ma . . . . parōksha-vinayava ma . . . . . ṟisida baredam Bavanayya.", "text_original": "ಅದೇ ನಾಡು ಅಂದೊಗೋವೇಶಹಳ್ಳಿಯ ಸರ್ವೆ ನಂ. 89 ಬಸವೇಪ್ಪನವರೇವರ ಜೋಡ್ಡಿ ಭೂಮಿಯಲ್ಲಿ ನ ವೀರಕಲ್ಲು\nಪ್ರಮಾಣ $5^{\\prime}\\times3^{\\prime}$.\n\n1 ಸ್ವಸ್ತಿಶ್ರೀ ವಂಟ\n2 ಕೋಳಿಥಸೊನ್ವತರ\n8 .... ಮತೆಲಗಿದಿಸತೇ ಆತನ ಸೊಸತಿ...\n9 ......ಕೋಟಿ್ಯ.........\n10 ಹಾರೇ...ಸರ\n11 ಕೋಣ್ಮ ಗೇತಿ .....\n12 ರಂ. ಗಂಗೆ......\n13 ಕವಿಲೆಯ್ಪನೌದೆ ಬ್ರಹ್ಮತ್ರಬೂಚಗನ\n14 ಬಣ್ಣ ತನಮು......\n15 ವರೆಲಷ್ಯನಿ...\n16 ಯವಮಾ...\n17 ತೀಡಿದದರೆಜಾಚವಾಯ್ಕಿ\n\n[Kannada original]\nಅದೇ ನಾಡು ಅಂದೊಗೋವೇಶಹಳ್ಳಿಯ ಸರ್ವೆ ನಂ. 89 ಬಸವೇಪ್ಪನವರೇವರ ಜೋಡ್ಡಿ ಭೂಮಿಯಲ್ಲಿ ನ ವೀರಕಲ್ಲು\nಪ್ರಮಾಣ $5^{\\prime}\\times3^{\\prime}$.\n[English translation, Gemini-rendered, verify]\nHero-stone in the jodi land of Basaveppanavareva in survey no. 89 of Andogovesahalli in the same nadu,\ndimensions $5^{\\prime} \\times 3^{\\prime}$.", "roman_pages": [72, 72], "original_pages": [128, 128], "translation_pages": [106, 106]}, {"id": "epca|I|29", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 29, "find_spot": "*On a pillar of the Ayyappa temple on the Kunda hill (Beṭṭiyattu-nād).*", "date": "Date 1857 A.D.", "translation": "In order to repair and construct anew as a Śivālaya the ancient stone temple of\nMahādēva on the Kunda hill in Beṭṭiyattu-nāḍ, where Īśvara appeared,---the Takka-mokastaru\nof this nāḍ, with all the people, and also the Takka-mokastaru of Kakkēri village in Ammati-\nnāḍ, having agreed together, began the work in the year 1776 of the Sālivāhana era, (1854\nA.D.), the Kali year 4955, the year named Ānanda, on the 18th of the month Tulā, the\n15th of the bright fortnight of Kārttika, Thursday, at an auspicious moment, on the expiry\nof the 1,810,060th Kali day.\n\nAnd for the restoration of this great (sacred) place, Maṇeppanḍra . . . . . having\nprovided a fund, as an offering to Īśvara,-list of people who rendered service :--- Kanḍeyarā-\nvuta . . . . . śānabhāga Brāhmaṇa-Veṅkapaiya, subhedār Koḍanḍēra-Mudaiya, and\npārupatyagār Maṇeppanḍra-Puchaiya assisted by having . . . . . made. Koḍanḍēra-\nMēdaiya assisted by having the door-posts made. Saṅvanḍra-Bōlaiya, Maninḍe-Timmaiya-\ngavuḍa, and Chinne-gauḍa's (son) Channappa assisted with the god's water-pipe, curtain and\nstairs. The jahāgīrdār of Kunḍa-grāma, Hayāt-Khān-sābi, assisted with the Nanḍīśvara in\nfront.\n\nIn this manner all the people united, and by the favour of Śiva completed the work of\nrestoring this Śivālaya in the year named Paiṅgala (1857 A.D.), on the 15th of the bright\nfortnight of Vaisākha, Friday, at an auspicious moment.\n\nTo those who performed this service . . . . . will be welfare (saukhya) in this world,\nand salvation (mukti) in the next.", "text_roman": "śrī . . . . . . īśvara-prasannanāgi . . . Beṭṭiyattu-nāḍu Kundada-beṭṭada\nmēle nelasiruva Mahādēvara śilāmayavāda purāṇa-gudiyannu nava-nettavāgi Śivālayadallu\njīrṇōdhāra-māḍuvadakke yi-nāḍu Takka-mokastaru ādiyāgi sarvē-janaru mattu Ammati-nāḍu\nKakkēri-grāmada Takka-mokastaru saha anumati-paṭṭu Śālivāhana-varusha 1776 kke\nKali-varusha 4955 ne Ānanda-nāma-saṁvatsarada Tulā-māsa 18 ne Kārtika-śuddha 15\nGuruvārakke Kali-sanda-dina 1810060 dina sanda-śubha-mūrtadali prārambhisida yi-mahā-\nsthala jīrṇōdhāradallu Maneppandra . . . . . . . Īśvarārpitan-endu maulya-koṭṭu sēva-\nmādida janara vivara . . . Kaṇḍeya-rāvuta . . . . tadalūra . . . mādisida . .\nsāya mādidavaru sānabhāgaru Brāhmaṇa-Veṅkapaiya śubhēdāru Koḍandēra-Mudaiya pāru\npātyagāru Maneppandra-Puchaiya bāgilu-nilake sāya mādisida Koḍandēra-Mēdaiya dēvara\npāṇivaṭa terekula meṭukela saha sāya mādidu Saṇvandra-Bōlaiya Maṇinde-Timmaiya-gauḍuda\nChinnē-gauḍana Chaṇṇappa Nandīśvarana prasannakke sāya mādidu Kunda-grāmada jahāgī-\nradār Hayātta-Kāna-sābi yi-mēre sarvē-janaru kūḍi jīrṇōdhāra-māḍida yi-Śivālayada\nkelasau Paiṅgaṇa-nāma-saṁvatsarada Vaiśākha-śuddha 15 Śukravāra śubha-muhūrtadalu yi-\nŚīvānugrahadinda pūraisidhe yi-sēve-mādidavarige . . . . yihadadi saukhya paradali\nmukti.", "text_original": "ಕಿಗ್ಗಟ್ಟನಾಡು ತಾಲ್ಲೂಕು ಬಟ್ಟ್ಯತ್ತು ನಾಡು ಕುಂದದ ಬೆಟ್ಟದ ಮೇಲೆ ಕುಂದದೆಯ್ಯ್ಪನ \nದೇವಸ್ಥಾನದ ಕಂಭದ ಮೇಲೆ\nಶ್ರೀ\n1 ......... ಈಶ್ವರವ್ಯಸೇನನಾಗಿ......\n2 ಬಟ್ಟ್ಯತ್ತು ನಾಡು ಕುಂದದಬೆಟ್ಟಮೇಲೆ ನಲಿದು\n\n3 ಮಹಾಮಿದೇವರ ಶಿಲಾಮಯವಾದ ಪುರಾಣಾಗತಿ\n4 ಯನ್ನು ಸನತ್ವಾವಗಿ ಶಿವಾಲಯದಲ್ಲೂ ಜಿನೋರ್ಧಧಾರಮಾ\n5 ದುವದೆಕ್ಕೆ ಯಿಮಾನಾಡು ತಕ್ಕ ವೇಕತ್ಸರೊ ಅಡಿಯಾಗಿ ಸವೆ\n6 ೯ ಜೀವರು ಮತ್ತು ಅಮೃಶಿನಾದು ಕಳ್ಳೆರಂಗಮದತ\n7 ಕ್ಕವೊತ್ಸರೊ ಸಹ ಅನುಮತಿಎಟ್ಟು ಕಳಿವಾರಸನ\n8 ಕಶಾಬ ವೆರುಷ ೨೬೨೬ ಕ್ಕೆ ಕೆಳಿಮಸನೆ ಕಣಿಗೆ\n9 ೯ ನೇ ಆನಂದನಾಮ ಸಂವತ್ಸರದ ತುಲಾಮಾಸದ ೧೯ ನೇ\n10 ಕಾತ್ಸಿಕಶುದ್ದಿ ೧೫ ಗುರುವಾರಕ್ಕೆ ಕಳಿಸುದೆ ದಿನ ೧೯\n11 ೧೧೧೦ ದಿನ ಸಂದಪುಭಮೂತ ದಲಿ ವಪ್ರರಬಿದೆಯೂ\n12 ಮಹಾಸ್ತ್ರಳ ಜಿನೋರ್ಧಧಾರದಲ್ಲುಮನೆ...\n13 ...ಯಸ್ಕಲ್ಯಾರಪ್ಪಿತವೆಂದು ಮುಳುಲ್ಯುಕೊಟ್ಟು ಸೇವಮಾಡಿದಿನರೆ\n14 ನಿವೆ?...ಕಂಡೆಯಿರಾವಂತೆ......\n15 ...ತದೆಲೊರೆ...ಮಾಢಿದೆ...\n16 ಸಲಿಯಿನಾತಿವೆದರುಕಾಣ\n17 ಭಾಗರು ಬ್ರಾಮ್ಹಣೇನಂ\n18 ಕಸ್ಮಯಲಷ್ಟುದಾರೊಕಡೊಂ\n19 ದೇವಮುಯೆಯ;ಪಾರುಸತ್ಯ\n20 ಗಾರುಮನ್ಪಿಂದ್ರಪುಣ್ಯ\n21 ಬಾಗಿಲನಿಕಿಸೆಯಮಾದಿ\n22 ಸಿದಕೊಂರ್ನೆರೇಮದ್ದೆಯು\n23 ದೇವದವರಜವತರಿಕಲಾ\n24 ಮೆಟುತುಕಾಲಸಹಸಹಾಯಮಾ\n25 ಡಿಡುಸಂಣ್ಯಾಂಇಬೊ.ಲ್ಯೊಯ\n26 ಮಣೂಂಜಿಕಿಮ್ಯೆಯಗಲು\n27 ಡಕೀಣವಾಳುನ ೧೫೦ನ್ಯಂ ಸಂವಿಷ್ಠರನ ಪ್ಬಿಸವಕೈ್ನಳೂ\n28 ಯಮಾದಿದು ಕುಂಡಗ್ರಾಮದ ಬಾಹಗೀರದಾರಹಯುತ\n29 ಕಾನಾಸಾಟಿ ಯಿವಾಮ್ಯೊ ಸೇರ್ವ ಜಿನರು ಕೊಡಿ ಜಿನೋರ್ಧಧಾರಮಾಡಿ\n30 ದೆಸುಸಿಕಾವಾಲಯದ ಕೆಲಸಲು ಹ್ಯಂಗಲನಾಮಸುವೆತ್ತರಡ\n31 ಮೈಕಶಾಕಷ್ಟು. ೧೫ ಸುಕ್ರವಾರ ಕುಭಮುಖೂತದೆಲು ಯಿವಾ\n32 ಕಿಸಾನುಗಹದಿಂದೊ ಪುರ್ವ್ಯಸಿದ್ಧ ಯಾಸೋನೆಮಾಡಿವದರಿಗೆ\n33 ......ಯಿಹಹವೆ ಸೊಕ್ಯಾಪರದೆಲಮುಕ್ಕೆ", "roman_pages": [72, 72], "original_pages": [128, 129], "translation_pages": [106, 106]}, {"id": "epca|I|30", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 30, "find_spot": "*On a stone at Nallūr (Hattuɡaṭṭu-nād) in a hittal west of Tītaɡamāḍu Mādayya’s house.*", "date": "Date ? about 1050 A.D.", "translation": ". . . . . when Koḍangāla . . . . . son was ruling-Biliya-seṭṭi, falling with\ndevotion at the feet of all the yatis, gained this glory of the gods.\n\nProsperity to the Jina śāsana. The lord of Maduvanga-nād, Kiviriyayya, kept the vow\nfor twelve (days) in the Changala basadi and expired. His sons Bāki and Buki set up this.", "text_roman": ". . . . . . . Koḍangāla . . . e maga . . . . . . dile ālḍade mendu yati-\nvarargg-ellam sādaraadi Biliya-seṭṭiya-pādadoḷ eragi tālidad-I-sura-kīrti bhadram astu Jina-\nśasanāya śrīman Maduvanga-nāda dora Kiviriy-Ayyangaḷ Chāngalada basadiyol panneraḍam\nnōntu muḍipidan avara maṅkal Bākiyu Bukiya ṇiṟisidar.", "text_original": "ಹೆತ್ತುಗೆಟ್ಟುನಾಡು ನಲ್ಲೂರು ಗ್ರಾಮನ ತಿರ್ತದಮadu ಮಾದಯ್ಯನ ಮನೆಗೆ ನಟ್ಟಿಮೆ ಹಿತ್ತಲ\nವತಿನಲ್ಲಿ ಪರಿಮಲೆ\nಪ್ರಮಾಣ 4' x 1' 6\".\n(ಮೇಲುಭಾಗದ ಒಡೆದು ಹೋಗಿದೆ)\n1 ಕೊಡಂಗಾಳ ಎಮಗ ........ ......\n2 ದಿಲ್ಲ ಆಟ ದೆಮೆಯ ಯತಿವೆರ\n3 ಗೆಗ್ಗಲ್ಲಂಗsadರೆಬಿಳಿಳಿಖುಸೇ\n4 ಟಿಟ್ಟಿಯಾವಪದೊಲಗೆಗೀತಜೀ\n5 ದೇವಸೆರ ಕೆಕ್ತಿಕ್ಷಭದೆವನ\n6 ಸ್ತು ಜಿನಕಸನಾಯ ಶ್ರೀಮಂ\n7 ಮುದುವೆಂಗನಾಡದೇವರೆಕಿನಿರಿ\n8 ಯುಯ್ಯಂಗಲ್ ಚಾಂಗಲರಡಟ\n9 ಸಿದಿಯೊಳ್ ಪನ್ನಿ ರದಂಸೋಣೊ\n10 ತುಮುಪಿಪಿದೆನ್ ಅವರ ಮತ್ಸ\n11 ಲ್ಯಾಕಿಯೊ ಬಿಕಿಯನೀಟಿಸಿ\n12 ದರ\n\n88", "roman_pages": [46, 72], "original_pages": [129, 130], "translation_pages": [106, 106]}, {"id": "epca|I|31", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 31, "find_spot": "*On a stone on the tank bund at the same village, Survey No. 117, near Tītaɡamāḍu’s house.*", "date": "Date ? about 1050 A.D.", "translation": "Prosperity to the śāsana of the Jinēndras, a destroyer of sin, a sun in dispersing the\ndarkness the doctrines of civil sects.\n\nBe it well. Fortune . . . . . desiring the other world, benefactress of others,\n. . . . . without hesitation deciding 'I will obtain mukti,' taking leave\nof her relatives, she gained the tomb,-the wonder of all, Jakkiyabbe. The mantraki of\n\n65\n\nChandiyabbe-gāvundi, śrāvaki of Kastūri-bhaṭṭāra, Jakkiyabbe performed sanyasanam and\nexpired. Her husband, the chief śrāvaka Edayya. Fortune.", "text_roman": "bhadram bhūyāj Jinēndrānām śāsanāvyāgha-nāśinē|\nku-tirtha-dhvānta-saṅghāta-prabhinna-ghana-bhānavē ||\nsvasti śrī.\npa . . . dhanam paratra-hita-kāraṇakam paramōpakārakam |\nkude ta . . . tājdi . . yatiga . . matiga . . bhayā . . dantama. . |\ntēdeyade muktiyam paḍeven endu vichārisi bandhu-varggava . .\nbiḍisi samādhiyam paḍedud elliyum achchari Jakkiyabbeya ||\nKastūri-bhaṭṭāramgge avara śrāvaki Chandiyabbe-gāvuṇḍī\nJakkiyabbe sanyasanam geydu muḍipidal || ākeya gaṇḍa parama-śrāvaka Eadyya maṅgalam.", "text_original": "[Kannada original]\nಅದೇ ಗ್ರಾಮದಲ್ಲಿ ತಿಮ್ಮರಾಯನದ ಮನೆಬಳ kerasುಯುವ ಸರ್ವೆ ನಂ. 117 ರ ಕೆರೆ ಪಿರೇ ಮೇಲೆ ನಟ್ಟ ಕಲ್ಲು\nಪ್ರಮಾಣ 3' 8\" x 1' 6\".\n[English translation, Gemini-rendered, verify]\nIn the same village, near Timmaraya's house, a stone planted on the bund of the tank in Survey No. 117.\nDimensions 3' 8\" x 1' 6\".\n\n1 ಭದ್ರಂ[||*]ಯಜ್ಜಿನ್ನಪ್ಪಾಕಾರಕಸನಾ\nಯಾ\n2 ಶೋಣತಿನೇಕೃತೀತ್ಯಾ ಧ್ಯಾನ್ಯಸಂಘಾತಕಫಲ\n3 ನ್ವ ಭಿನಭ್ಬಾನವೇ ಸ್ವಸ್ತಿ ಶ್ರೀ ವದಂದೇಧಾನ\nಪಾರ\n4 ತೇರಿತಕರಣೇಕಾರವರೋಣಿವಕಾರೇ\n5 ಶಂಕುಂಡೇಕಂಡುತಾಕಜ್ಜಿಯದಾಯತಿಗಮತಿ\n6 ಗಣಕೇಭ್ಯಾದುದಂದೇಮೇಳ್ಳೈ ದೆಯದನೆಮಕ್ಕೆಯ\n7 ಂಡೇವೇನನ್ನು ನಿಖತಾರಿಸಿ ಬನ್ನವಗ್ಗೆ ವಡಂ\n8 ಬಡಿಸಿನಸಾಮಿಯಂಜಡೆದುಮೆಲ್ಲಿ\n9 ಯುಮಮೊಕ್ಕಿ ರಿಜಕ್ಕಿಯತ್ಬೆಯೆಕಸೊರಿ\nಭುತ್ವಾ\n10 ರಗೇf ಅವರೇಕಾಣವಿಕಜಿನಿ ಯುಬ್ಬೆಗಾವ್ರು\n11 ಣ್ವಿದ್ದೆದ್ದಯಮಂತ್ರಕೀಜಿಕಿಯಟ್ಬೆ ಸನ್ನ್ಯಸೆ\n12 ನಂಗೇಯ್ಯ ಮುಡಿಪಿಡಲ್ || ಆಕೆಯುಗ\n13 ಣ್ವಪರಮಶತ್ರಾವೆತ್ ಎದಯ್ಯ ಮಂಗಲಂ", "roman_pages": [72, 75], "original_pages": [130, 130], "translation_pages": [106, 107]}, {"id": "epca|I|32", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 32, "find_spot": "*On a stone at Niḍuta (Niḍuta hobli) in Bīre-dēvara vana.*", "date": "Date 1278 A.D.", "translation": "*(Very much effaced all down the middle of the stone.)*\nBe it well. Fortune. In the year 1201 of the . . . Śakas 1, the year Bahudhānya, on\nthe . . . of the dark fortnight of Vaiśākha, for the god Mallikārjjuna of Malapanahalli\na grant of lands was made by Hiriya-Virappa and Chika-Virappa. (Details of the lands.\nUsual imprecations.)", "text_roman": "*svasti śrī* . . . . dbhayat-Syakalra-vorusha 120[1] [Bahu]dhānya-samvatsarada Vai\nśākha-ba . . . . haliya gu ga . . dava . . Malapanahallīya Mallikārjjuna-dēvara-pra .\n. . . [Gadi]-nāḍu Aṇi[le]nā . . . [Mu]ḷlu-nāḍu ekōti . . . . tā maṇ[ta]ttu ā-\nMallikārjjuna-[devara] . . . . hora-bhūmīya ja- . . . nam . . . . . yanna\nLakaṇṇa [Jaka]-Rāma[ya] . . . . . Hiriya-Viramṇa Chika-Viramṇa\n. . . tiya taṇḍakkavu (|) ān-nāḍu-mum[de]. . . [tta] gadde bedalu Baṇasamudrada\n. . . . ko 10 dēvara keṇeya kelage kāra [gadde] . . [hu]vina gadde ko 10\nBaṇigaṇahalliya[lu Tiru]male-gaiḍa kattisida ȧ-kereya kela[ge ko 3 . . . [yo]ḷage sa 2\ndēvara hiṃdaṇa-pareya ga[ddde] . . . . yahṇpage sa 2 ko 1 [ā]-hatreya teṃkaṇaḍa [ho]\n. . ṃgo [ko] 1 ali paduva halla gadde sa 1 Korakaḍahu Hariyamṇage sa 1\nKoraḳadaḥu Viramṇa . . [maṇṇa] dēvara gadde sa 1 [Māla] lakereya . .\n. . . . sa 6 Hiḍijiyakereya . . . . lu ūra muṃḍana ko . . . [te]mdade\n. m 100 ūra hiṃdaṇa ke . . rike 60 aṃntu bedalu . . 700 gadde sa 22 nū Malli-\ngauḍa . . Hariyamṇa Viraṇṇamgeyú samavāgi amrutapadiGe biṭṭa dharmmam āru\nalipida[de] Gamgeya ṭadiyali ka[vi]leya koiṃḍa pā . . . . tam vā paradattam vā yō\nharēta vasundhula . . . . r-vvarisha sahasrāṇāṃ vishtāyāṃ jāyatē . . . .\nsāsana . . . .", "text_original": "ನಂಜಿರಾಜವಕ್ಕ ತಾರ || ನಿಡತ ಹೋಜಳ ನಿಡತದ್ದಲ್ಲಿ ಬೋರೇದೇವೀರ ವನದಲ್ಲಿ, ನಟ್ಟ ಕಲ್ಲು.\nಪ್ರಮಾಣ 2' 6\" x 1' 3\".\n\n1 ಸ್ವಸ್ತಿ ಶ್ರೀ......ದೈಯತ್ಯ ನ್ರಕೈಯರುದ್ರದೆ\n2 ೦೧೧ ಬಹುಧಾನ್ಯ ಸಂವತ್ಸರದ ಮೈಶಾ\n3 ಖ ಬ......ಹೊಲಯಯಗ--ಗೆ\n4 ದವೆ......ಮಲವನಹಳ್ಳಿಯ ಮಲ್ಲಿ ರಾಜಜ್ಜನವೇ\n5 ವರೆಪ......ಗಡಿನಾಡು ಆ\n6 ಜಲಪ......ಮೊಳಯ್ಯನಾಡು ಎ\n7 ಕೋಟಿ........ತಾಮದತಟ್ಟ್ಯ ಆ\n8 ಮಲ್ಲಿ ರಾಜಜ್ಜನವೆ......ಹೊರಭೂಮಿoಯಜ\n9 ......ಣ..ಯನ್ನಾ ಲಕಣಾ\n10 ಜಕರಾಣಯೇ.......ನೆರಿಯವಿಪೇರಂ\n11 ಣಾಚಿಕವಿರೇಣಂ..........ಶಿಯತಂಡಕ್ಕವು\n12 ಆನಾರದಮುದೆ.........ಟ್ಟ್ಗದೆ ಬೆದೆಲು\n13 ಬಿನಸಮುತ್ತದೆ.........ಕೇಂ ಗಂ ದೇವೇಕಜಿ\n14 ಯೆಹೆಗೆಕಾರೇಗದ........ಹುಏನಗದ್ದೆ ಕಣಂ\n15 ಬನಿನಗಹೈಯಲು ತಿರುಮಲೆಗುಂಡಕಟ್ಟಿಸಿದೆ\n16 ಕೇಜಿ ಯೆಕರಗೆಕೊ.--ಯೊಳಗೆ ಸ ೨ ದೇವರೆ\n17 ೮ಂದೇವದೇವಿಯಗೆ......ಯೂಂಹೆಗೆ ಸ ೨ ಕೊಂ\n18 ಆ ಹತ್ರಯುತೇಕಣಾದೆಹೊ...ಗೆ ಕೆರ ೧ ಅಲಿಪದು\n19 ವೇಹರೈಗದೆ ಸ ೧ ಕೊಜಕದೆಹೂಲಿಯೊಳಗೆ ಸ ೧\n20 ಕೊೂಳಿಕದೆಯುವಿರಣ್ಣ...ಮಣ್ಣ ದೇವನಗದೆ ಸ ೧ ಮಾ\n21 ಕಳಿಕೆಜೊ೦.........ಸ ೬ ರಿಧಿ ಜೇಯಕೇ\n22 ಜಿಯ.........ಲು ಊರಮೂಂಡಣ\n23 ಕೋ--ಕೆಂಡದೆ--೨ ಗಂ೧ ಊರೆಯಿಂದಾಣೇ\n24 -ರಿಕೆ ೨೦೦ ಅನ್ಸನ್ನಿ ಬ್ರೆದೆಲು--೭೦೦ ಗದ್ದೆ ಸ ೨೦ ನೊ\n25 ಮೆಲ್ಲಿ ಗ ಉದೆ...ಹೀರಿಯಣ್ಣಾ ವೀರೆಣಗೆಯಾಸಮ\n26 ವಾಗಿ ಅಮ್ಮೆತವಡಿಗಿಬಿಟ್ಟ ಧಂಮ್ಮ್ಯ ಮಾರೂ ಅಳಪದಡೆ\n\n27 ಗಂಗಯ ತಡೆಯಲಿ ಕವಲಿಯ ಕೊಂದ ಪಾ\n28 ...ತೇನಾನರದತ ಎಮಯೋಹರೊದ ವಸುನ್ನ\n29 ನ್ಯೂರಿಸ ಸಹಸ್ರಾಣಾಂ ವಿಖ್ಯಾತಾಂಟಾಳಯ...\n30 ......ಶಾಸನ......", "roman_pages": [75, 75], "original_pages": [130, 131], "translation_pages": [107, 107]}, {"id": "epca|I|33", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 33, "find_spot": "*On a stone at Nandiguṇḍa (same hobli) in Government kharāb land, Survey No. 147.*", "date": "Date ? 1176 A.D.", "translation": "Be it well. When śrīman mahā-maṇḍalēśvara Vira-Chōla-Koṁgāluva-Dēva was ruling\nthe kingdom of the world:—Tāyi 2-Padumala-Dēvi, Sōmala-Dēvi, Tōlūr Duddarasa, Balleya-\ndaṇḍanāyaka, and Hadiyera Kirikana,—all these being present, in the year Manmatha, the\nmonth Kumbha, Sunday, the 10th, he granted in the Mullu-nāḍ Seventy, for the children's\nchildren of Anpattamma 3 to raise and receive customs dues as follows:—good ox, free;\nheadman's fee—for each hamlet in Ganahūr, 5 haṇa; tribute money—for each hamlet in\nGanahūr, 5 haṇa; king's tax, and pandal money, free; except the Ganga fixed rent, tax\non income and gifts, forced labour, demand, fines for . . . . . . and all such,\nfree.\n\nWhoso speaks of failing in the grant made by Vira-Chōla Koṁgālva-Dēva is guilty of\nslaughtering cows and Brāhmans on the banks of the Ganges, and of Brāhman murder.\nIn the Seventy, 5 gula of bhaṭla will be given for each house to Gangōja and Buchaṇa.", "text_roman": "svasti śrīman-mahāmaṇḍaleśvarara Vira-Chōla-Koṃgāluva-Dēvar prithivī-rājyam\ngaiyutt ire tāyi-Padumala-Dēvi Sōmala-Dēvi Tōlūra-Duddarasa Balleya-daṇḍanāyaka\nHadiyīga-Kirikaṇa yiṃti-inibaruṃ muṃtāg-iriddu Manumata-samvatsarada Kumbha-\nmāsa Ādivāra dasami yaindu Muḷlu-nāḍ-eppattakaṃ Aṇṇattammana makkaḷa makkaḷig ett\neydo saluvudu suṃkada beḍuṃgoḷu nall-ettu parihāra heggade-gadyāṇa Ganahūralu oṃdu\nhaḷige ḥaṇav aidu kāṇike gadyāna Ganahūral oṃdu haḷige ḥaṇav aidu ara tere haṃdala-\nhaṇa parihāra Gamga-siddhāya ḥoragāgi āya daya¹ biṭṭa besa haṇu vagērige parihāravaiṃ biṭṭa\n[I] Vira-Chōla-Komgālv-Dēva koṭṭudaṃ tappa nuḍida Gamgeya ṭadiya kavileyam Brām\nmaṇaṇam koṃḍa brahmātīyaṃ koṃḍa || eppattarolage maneg ai-guḷa bhatta saluvudu Cumg-\nōjamge Būchaṇaṃge ||", "text_original": "ಅದೇ ಹೊಂಬಳ ನಂದಿಗುಂದ ಗ್ರಾಮದಲ್ಲಿನ 147 ನೇ ಸರ್ವೇ ನಂಬರ ಸರಕಾರಿ ಬಾವಿನಲ್ಲಿ\nಪ್ರಮಾಣ 6′ x 2′ 6″.\n\n1 ಸ್ವಸ್ತಿ, ಶ್ರೀ ಮನ್ನูดಮಣ್ಣಾಲೋಸ್ಪರಂ ವೀರಶೋಳಕೌಂಗಾಳು\n2 ವ ದೇವ್ನಿಪ್ರೀವಿ ರಾಜ್ಯಾಂಗ್ಯಯುಕ್ತಿಯುತಾಯಿಯವದುಮು\n3 ಲ ದೇವಿಸೋಮಲದೇವೀ ತೀರ್ಲೋರೆಡೆದ ರಸಬಲ್ಲೆಯ\n4 ದಣ್ಣಾಯಕಡಯಿತುಅಕಿರಿಕಣಿಯಂತ್ರೀ\n5 ನಿಬುಂ: ಮುಂತಾಗಿದ್ಯ್ ಕ ಮನುಮತ ಸಂವತ್ಸರ\n6 ದ ಕಂಭನಾನಾಸ ಆದಿವಾತರದೆಸಿಮುಂದು ಮು\n7 ರನ್ನಾಡೇಷ್ಕಂ ಅಣ್ಣ ತಣ್ಣಮ್ಮಕ್ಕಳರಮಕ್ಕಳ\n8 ಗತ್ತ್ಯೊನ್ಣ ಸೆಲುಯುದು ಸುಂಕದೇವಿದೊಂಗೊಳು\n9 ನಲ್ಲಿತ್ತು ವಲಿಹರ ಹೆಗ್ಗಡೇಗ್ಗಾವನನಹೂರ\n10 లు ఒందు హెల్ಗಗೆ ಹಣ ಮೈದು ಕಾಣಿಕೆಗದ್ಮ್ಯಾನ\n11 ಗನಹೋರವೇಯೆಂಡುಯೆಳಹೇಣವ್ಯುದು\n12 ಅರಕಟಿ ಹಂದೆಲ ಹಣ ಪರಿಹಾರಗೆಂಗ\n13 ಸಿಧ್ಧಯ್ಯ ಹೊಸಗಾಗ ಅಯ ದಾಲ ಬಟ್ಟೆ ಬ\n14 ಸಹಡು ವಗೆಲಿಗೆ ಪರಿಹಾರವೆ ಬಟ್ಟು |\n15 ವೀರಶೋಳ ಕೊಂಗಾಳ್ಯ ದೇವಕೋಟ್ಟುತ್ತ ದಂತಸ್ತನು\n16 ಡಿಡಿದ ಗಂಗಯ ತಡೆಯ ಕವಲಿಯೊ\n17 ಬ್ರಾಹ್ಮಣನಕೊಂಡ ಬ್ರಹ್ಮಾತಿಯೊಕೊಂಡೆ ||\n18 ಮೃತ ಜೌಳಗೆ ಮನ ಗ್ರ್ಯುಳ ಭಕ್ತಿ ಸಲುಯುಮೆ\n19 ಗಂಗೋಜಿಂಗೆ ಭೋಜನಗೆ ||", "roman_pages": [75, 75], "original_pages": [131, 131], "translation_pages": [107, 107]}, {"id": "epca|I|34", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 34, "find_spot": "*On a stone at Muḷlūr (same hobli), west of the Pārśvanātha basti in the Basti temple.*", "date": "Date 1084 A.D.", "translation": "Be it well. Of the hundreds of years elapsed since the time of the Śaka king, the\n986th, the year Krōdhi, being current, on the 9th of the dark fortnight of Chaitra in that\nyear, Tuesday, under the Pūrvvā-Bhādrapada nakshatra, at the rise of Mīna (Pisces):—\nBe it well. Having crossed completely over the deep ocean of nectar, the āgama which\nissued from the lotus mouth of the holy Arbad-paramēśvara parama-bhaṭṭāraka, whose lotus\nfeet are illumined by the rows of gems set in the crowns of all the gods and demon lords,—\nśrīmad Guṇasēna-paṇḍita-dēva gained the abode of Mōksha-Lakshmi.\n\nHis guru, skilled in unfolding the essence of the siddhānta, Pushpasēna-vratīndra;\nhis eminent sangha, the Nandi-sangha; lord of the Draviḷa-gana of the great Arungul-\nāmnāya; proficient in the supreme arhantiya and other the three jewels, all the great science\nof grammar, āgama and others, and the six established systems of logic;—thus was the\nvratipati Guṇasēna-āryya, praised of āryyas.\n\n66\n\nFootnote\n1. The original seems to be udbhayat Syakara vorusha. Perhaps meant for jayābhyudaya-Śaka-varusha.\n2. Mother :—the queen mother.\n3. This seems to be the name of a person, as though aṇṇa means elder brother, and tamma, younger brother, when combined they do not double the t as here, nor take the singular termination. It is also unlikely that provision was making by so many donors for the grandchildren of the elder and younger brothers of all of them.", "text_roman": "(1stside) 🪷svasti-Śaka-nripa-kāl-ātīta-samvatsara-śataiṇgal 986 neya Krōdhi-samvatsaram\nparivarttisuttire 2tach-Chaitra-bahula navami Maṅgalavāram Pūrvva-Bhādrapade-naksha\ntram Min-ōdayadal || svasti samasta-surasūreṃdra-makuta-taṭa-ghaṭita-maṇi-mayukha-rēkh-\nālamkrita-chā (2nd side) ru-charanāravinda-yugala-bhagavad-Arhat-paramēśvara-paramā-\nbhaṭṭāraka-mukha-kamala-vinirggat-amṛita-gambhir-ābhbhōrāśi-pāragar appa śrīmad\nGuṇasēna-Paṇḍita-dēvar Mōksha-lakshmi-nivāsakka[m] sanda[r] [][]\n\n(3rd side) gurugaḷ siddhānta-tatva-prakaṭana-paṭugaḷ Pushpasēna-vratīndrar | vvara-\nsaṁghan Nandi-saṁghaṁ Dravila-gaṇa mah[ā]ruṅguḷ āmnāya-nātham[]param-ārhanty-\nādiratna-traya-sakala-mahā-śabda-śāstr-āgamādi sthira-shaṭ-tarkka-pravīṇar vratipati-\nGuṇasēn-āryyar āryya-praṇōtar ||\n\nFootnote\n1. Read pravarttisuttire.\n2. Read dāya. 6-A", "text_original": "ಅದೇ ಹೊಂಬಳ ಮೂಳೆನ್ಯೂರು ಬಸ್ತಿ ಗುಡಿಯಲ್ಲಿ ಪಾಶ್ರ್ವನಾಥ ಬಸ್ತಿಗೆ ದಕ್ಷಿಣಗೆ ನೇ ಕಲ್ಲು\n೧ ನೇ ಪಾರ್ಶ್ವ\n1 ಸ್ವಸ್ತಿ ಶಕನ್ಯಪಕಾಲಾತಾ\n2 ತಿತ್ರೆ ಸಂವತ್ಸರ ಕತಂಗಲ್\n3 FY೬ ನೆಯ ಕೋಟ್ಟಿದಸಂ\n4 ವತ್ಸರ ಪುರಿಯಲ್ಲಿತ್ತೆಸುತ್ತ್\n5 ರೇತಕ್ಜೆ ಒಲ್ತಯೆಹೂಲ್\n6 ನವೆಮಾಮುಲ್ ಲವಾ\n7 ರೆಂಪೋಣ್ವಾಭದ್ರ\n8 ಹಾನನಕ್ಷತವಿನಾ\n9 ನೋದೂಯೆಲ್ || ಸ್ವಸ್ತಿ\n10 ಸೆಮಸ್ಸೆ ಸುರಾಸೂರೆಂ\n11 ದ್ಯೇಮಕಟಕಟಫಟಿ\n12 ತಮಣ್‌ಮಯೂಖ\n13 18 ರೇಪೂಲಂಶೃತಚತಾ\n೨ ನೇ ಪಾರ್ಶ್ವ\n14 ರಜರ್‌ಹಾ\n15 ರೇಮೆಯು\n16 ಗೆಳಭಗವ\n17 ದೇಹತ್ತರ\n18 ಮೇಳ್ನೇರವರ\n19 ಮಣಿಟೂಠರಕ್\n20 ಮುಮುಖಮ\n21 ಲವಿಣಿಗಳ್ತಾತಾ\n22 ಗಮೂಮೃತ\n23 ಸಂಭ್ರೋರಂಭಣೋ\n24 ರಾಶಿಪಾರ\n25 ಗರಪ್ಪ ಶ್ರೀ\n26 ಮದ್ಯೆಣಸೇ\n27 ನಸಣ್ಮ ತದೇ\n28 ವಮ್ಮಿಂ ಶ್ರೇ\n29 ಲಕ್ಷ್ಮೀಣವಾ\n30 ಸೆಕ್ಯೊನ[ಸ್ರ್] ೬", "roman_pages": [75, 76], "original_pages": [131, 131], "translation_pages": [107, 108]}, {"id": "epca|I|35", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 35, "find_spot": "*On a second stone at the same place.*", "date": "", "translation": "*Date 1058 A.D.*\n\nWritten by Dhamma-seṭṭi $\\text{1}$. Be it well. In the 980th Śaka year, the year Vilambi,\nat the time of the uttarāyaṇa-saṅkrānti,—śrī-Rājēndra-Koṅgālva, for the basadi his father\nhad had made, granted in Haruvanahaḷḷi, Arakanahaḷḷi, and Niḍuta goḍu 3 khaṇḍuga,\nand similar grants in other villages (named), with the oil from one oil mill. Śrī-Rājādhi-\nrāja-Koṅgālva's mother, Pōchabbarasi, had (the grant) made to her guru Guṇasēna-paṇḍita-\ndēva, of the Draviḷa-gaṇa, Nandi-saṅgha and Arungal-ānvaya, and given with pouring of\nwater.\n\nWhoso takes away land given by himself or by another is born a worm in ordure for\nsixty thousand years.", "text_roman": "(1st side) Dharmma-seṭṭi barredam svasti Śaka-varsha 980 tteneya Viḷambi-sam-\nvatsarada uttarāyaṇa-samkrānti-yaṁdu śrī-Rājēndra-Kōṁgāḷvaṁ tamm ayyaṁ mādisida\nbasadige koṭṭa Hāruvanahalli Arakanahaḷli (2nd side) Nidutada-gōḍal khaṇdugaṁ 3 ke\nSakuniyu olagereyuṁ khaṇduga (3) Hēnnellūra bhūmi khaṇdugaṁ 10 oṁdu gāṇad\neṇṇe (3rd side) Kāngoṇdahalli haṁgala [p]āni khaṇdugaṁ 10 Huniṣedāru khaṇdugam 10\nGaṇapati gōdalu khaṇdugaṁ 3 Asagavoḷe khaṇdugaṁ 4 (4th side) śrī-Rājādhirāja-\nKōṁgāḷvan abbe Pōchabbarasiyar ttamma gurugaḷu Dravila-gaṇada Namdi-saṁghad\nArungal-ānvayada Guṇasēna-paṇdita-dēvargge mādisi dhārā-pūrvvakaṁ koṭṭaru || svadattaṁ\nparadattaṁ vā yō harēti vasundharā[m] shashṭir vvarsha-sahasrāṇ[i] viṣṭāyāṁ jāyatē\nkrimiḥ ||", "text_original": "ಅದೇ ಬ
