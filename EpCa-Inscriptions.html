<script id="record-data" type="application/json">[{"id": "epca|I|1", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 1, "find_spot": "On copper plates found in the Treasury at Mercara ^1.", "date": "Date 466 A.D.", "translation": "Be it well. Success through the adorable Padmanābha, resembling (in colour) the\ncloudless sky.\n\nA sun illumining the clear firmament of the Jāhnavī (or Ganga) kula, possessed of\nstrength and valour from the great pillar of stone dividing with a single stroke of his sword,\nadorned with the ornament of a wound received in cutting down the hosts of his cruel\nenemies, of the Kauvāyana gōtra, was śrīmān Koṅgaṇi-mahādhirāja.\n\nHis son, inheriting the qualities of his father, possessing a character for learning and\nmodesty, having obtained the honours of the kingdom only for the sake of the good govern-\nment of his subjects, a touchstone for (testing) gold the learned and poets, skilled among\nthose who expound and practise the science of politics, author of a commentary on the Duttaks-\nsūtra¹, was śrīmān Mādhava-mahādhirāja.\n\nHis son, uniting the qualities of his father and grandfather, having entered into war\nwith many elephants (so that) his fame had tasted the waters of the four oceans, was śrīmad\nHarivarmma-mahādhirāja.\n\nHis son, devoted to the worship of the twice-born, gurus, and gods, not leaving the feet\nof Nārāyaṇa, was śrīmad Viṣṇugōpa-mahādhirāja.\n\nHis son, whose head was purified by the pollen from the lotuses feet of Triyambhaka,\nhaving by personal strength and valour purchased his kingdom, daily eager to extricate the\nox of merit from the thick mire of the Kali-yuga in which it had sunk, was śrīmān Mādhava-\nmahādhirāja.\n\nHis son, the beloved sister's son of Kṛṣṇavarmma-mahādhirāja,—who was the sun in\nthe firmament of the Kadamba-kula,—his mind illumined with the increase of learning and\nmodesty, of indomitable bravery, reckoned the first among the learned, was śrīmān Koṅgaṇi-\nmahādhirāja, named Avinita.\n\nOf whose gift to Caṇḍauṇḍi-bhaṭāra, the disciple of Guṇanaṇḍi-bhaṭāra, who\nwas the disciple of Jayayaṇḍi-bhaṭāra, who was the disciple of Śīlabhadra-bhaṭāra, who was\nthe disciple of Abha[ya]ṇaṇḍi-bhaṭāra, who was the disciple of Guṇachandra-bhaṭāra, of the\nDēsiga-gaṇa and Koṇḍakuṇḍānvaya, in the year eighty-eight beyond three hundred,\nthe month Māgha, Monday, the Svāti-nakshatra, the fifth day of the bright fortnight,—\nthe minster (mantri) of Akālavarṣa-Pṛthuvi-Vallabha—having obtained (it) by grant from\nAvinita-mahādhirāja—presented the charming (village) named Badaneguppe, (situated) within\nthe Edenāḍu Seventy of the Pūnāḍu Six Thousand, to the Śrīvijaya Jina temple of Taḷarana-\nnagara, together with twelve kaṇḍuga in each of the six dependent hamlets, the ambali-\nmaṇṇu, the tala-vitti in Taḷarana-pura, twelve kaṇḍuga in Pogarigele, and twelve kaṇḍuga\naccording to the accepted royal measure in Pirikere.\n\n52\nBoundaries of the village of Baḍaneguppe¹ : east, the red rock, Gajasela, the śakti post\nat the tri-junction of Karivalli, Koṭṭagara and Baḍaneguppe, and so coming to the Kāgaṇi\npond on the south-east ; again south, the milk hedge, the balkani tree ; again facing west, the\nrow of medical plants, then the pond at the tri-junction of Baḍaneguppe, Koṭṭagara and Muḷtagi,\nChandigāla ; thence to the clearing-nut tree at the south-west ; again west, the peld-uḷdil\ntree, the banyan tree called Santara, thence the bed of the stream ; facing north, the row of\nmedical plants, the pond of the rose-apple, thence to the sacred tamarind tree at the north-\nwest ; again the neggila clump at the tri-junction of Baḍaneguppe, Muḷtagi, Koleyanūr, and\nDāsanūr, the long ? sacrificial circle, thence the hill which protects the north of the village of\nGajasela, descending to the big rock ; again facing east, the row of medical plants, then the\nkaḍapaḷtīgāla banyan tree ; again north-east, the pond at the tri-junction of Baḍaneguppe,\nDāsanūr and Polma, the tamarind tree at the paddy fields by the sluice, and to the level\nred mound which joins the eastern boundary.\n    Witnesses thereto :-Pēṛbbakkavāṇa, the man who is a friend in all things to the Ganga\nroyal family ; Marugareya Sendrika, JSON, Gañjeṇāḍ Nirggunda Maniyugureya, Nandyāla\nSimbalādapa, servants.\n    Country witnesses :-Tagaḍūr Kuḷugōvar, Gaṇiganūr Tagaḍūr, Ālgodaṇe Nandakar,\nUmmatūr Bellurar and Alageyar, Baḍaneguppe Jhamsanda-Bellurar and Perggiviyar.\n    Whoso takes away land presented by himself or by another is born a worm in ordure\nfor sixty thousand years. The earth has been enjoyed by many kings and Saka kings¹ ;\nwhosesoever at any time is the land, his at that time is the fruit. The property of the gods\nis a dreadful poison ; call not poison poison, poison kills a single person, but a gift to the\ngods (if seized) destroys sons and grandsons. Merit is a common bridge for kings, this do ye\nsupport from age to age, O kings,–thus does Rāmabhadra beseech the kings who come after\nhim.\n    Viśvakarmmā's writing.\n\nFootnote\n1. Dattaka was an early poet, of perhaps the 1st century, who, induced by the dancing girls of Pāṭaliputra, wrote a work on one section of the Kāmṛ-sūtra (See JR.AS. 1911, p. 183). In Kannada his name appears as Jattaka. Thus the Hoysala prince Ereyanga is styled in an inscription (Ak 102a) abala-Jattakan, or a Jattaku to the weaker sex. 7-A", "text_roman": "*(lb)* ^2svasti jitām bhagavatā gata-ghana-gaganābhrēna Padmānābhēna śrīmad-Jāhnavi[ka]*ku-\nlāmalā-vyōmabhāsana-bhāskaraḥ sva-khadgayka-prāhāra-khaṇḍita-mahā-silā-stambha-\nlabdha-bala-parākramō dāraṇōri-gaṇa-vidāraṇōpalabdha-braṇa-vibhūṣaṇa-vibhūshita Kaṇvā-\nyana-sa-gōtrasya śrīmān-Koṅgaṇi-mahādhīrāja || tat-putra pitur-anvāgata-guṇa-yuktō vidyā-\nvineya-vihita-vṛittaḥ samyak-prajāpalanā-mātrādhigata-rājyāt-prayōjana vidvat-kavi-kāñcha\nna-nikāshōpala-bhūtō nīti-sāstrasya vaktri-payōktri-kusalasya Dattaka-sūtra-vṛittih-praṇētām\nśrīmān-Mādhava n\nreye puna pūrbba-mukhade sanda bahumūlika-pa (IIIa) ntiye puna kaḍapaltigala vaṭa-\nvrikshame puna isānade Badaneguppeya-Dasanūra-Polmada-trisandhiya taṭākame koḍigaṭṭi\nchiñcha-vrikshame kemṭarambina¹ dineim pūrbbaḍe kuḍittu simāntaram || tasya sākshiṇā\nGanga-rāja-kula-sakalāsthayika-purusha Perbakkavāna Marugareya Sendrika Gamjenāda\nNirggunda Manyigureya Nandyāla Simbāl Ādapa bhrityayāṁ dēsa-sākshi Tagadūra Kuḷugō\nvaru Ganiɡanūra Tagadūra Āgoḍate Nandakarum Ummatūra Beḷḷurarum Ālageyarum\nBadaneguppeya Jhaṁsanda ² Beḷḷuraru Pergġiviyarum || svadatta paradattāṁ vā yō harētha\nvasundharī shashṭin* varsha sahasrāṇi vishṭayāṁ jāyate³ krimi || vasubhi vasudhā bhuktāṁ\nrājabhis Saka-rājabhi ⁴ yasya yasya yadā bhūmi tasya tasya tadā phalaṁ || dēsvan tu vishaṁ\nghōraṁ na vishaṁ vishaṁ uchyate vishaṁ ēkākinam honti dēvasva putra pautrikam || sāmān-\n[y]ōyaṁ dharmma hētun* nṛipāṇāṁ kālē kālē pālanīyō bhavadbhi sarbbān ētām bhāgina-\npāttivēndrā bhūyō bhūyō yāchate Rāmabhadrā ⁷ || Visvakarmma ⁸ likhitam ⁹\n\nFootnote\n1. Originally deciphered by me and published in 1872, Ind. Ant. i, 368; see also xii, 12. The facsimile now published is from an impression by Dr. Fleet. The original impression by Dr. Burgess is given in the Indian Antiquary, vol. i.\n2. A symbol here supposed to represent Ōm.\n3. The nna is inserted below the line.\n4. Vidya is inserted below the line, with a small cross above, to show where it should come.\n5. By mistake ina has been engraved for ima.\n6. This name should most probably be Abbaṇandi.\n7. The second ṇa is inserted below the line.\n8. The first sa is inserted below the line between two vertical strokes.\n9. The ga is inserted below the line.", "text_original": "ಮಡಿಕೇರಿಯಲ್ಲಿ ಸರಕಾರದ ಬಿಜುನಯಲ್ಲಿ ಸಿಕ್ಕಿದ ತಮ್ರ ಶಾಸನ-\n೨ ಪತ್ರಗಳು - ಪೂರ್ವದ ಹಳಗನ್ನಡರ.\n\n೧ ನೇ ಪತ್ರದ ಹಿಂಭಾಗ-\n1 [ ಸ್ವಸ್ತಿ _ ಜಿತಸ್ಮೃಗನತತಾ ಗೆತಘಿನಗೇನಾಗೇನ ಪದ್ಮನಾಜ್ಞೇನ ಶ್ರೀಮನ್ವಾ ವೃಯಿವೆಯಕು\n2 ಲಾಮಲವಾರೋಮ್ಯಮಾವಭಾಷಾಸಭಾಸಕರ ಸೌಖಬೆ ದ್ಯಪ್ರಸಹಾರಉಂಣ್ಯತೆ ಮಹಾಸಿಲಾಸತ್ಮ್ಮಲಬ್ಯಬಲ\n3 ಪರಾಕ್ರಮೋದಾರನೇಣೇಗಣೇನವಿದಾರಣೆನವಲಬ್ಯಬ್ರಾಹಣೇಷ್ಠಸನ್ನಿಭೇಷ್ಠನಿಭೇತಕನ್ಯಾಯನ\n4 ಸಂಗೋತ್ರಸ್ಯ ಶ್ರೀಮನಾನ್ಯಖ್ಯ ಸೀಮಹಾಭಿರಾಜ || ತತ್ಪುತ್ರಪುತುರಯಾಗತಗುಣಯುಖೋಇನ್ಮಣಿ\n5 ದೋನಿನಿಯವಿರುತೆವೃತ್ತಿ : ಸನ್ಯವಚ್ಛೇ ಜ್ಞಾಪಾರನಾಮತಾಜನಿಗತರಾವಜೃತ್ಯ) ಯೋರಜನವಿದ್ಯೆತ್ಯು\n6 ವಿಕಬ್ಯ ನನಿಶಾರಜೋಪಲವಲೊಣತೆ ನಿರ್ಕಿನಾಸ್ಯ) ಸ್ಯ ವಿಕಿ) ನಯೋಳಿ_ಕ ಕುವಸೆಸ್ಕ ದತ್ತಕಸುತ್ತ\n7 ವೃತಿ೨) ರೇತಾ ಶೀಮಸ್ನಾವಾಧನಾಮಸಾಧಿಂಜಾ || ತತ್ಪುತಿಪತ್ಯ್ಯಥಮಹಾಗುಣಯುಖೋಳ ಸರ್ವೇಶ\n8 ಚಾತಕಂಡ ಸನ್ಯಯುಷ್ಯನಾಪ್ಯ ಬತಚದುಮಸಿಲಿಸಲನ್ಯಾಧಿಕದಯಸೆ ಶ್ರೇಮನ್ದರಿವಸ್ಮಮಹಾಭಿರಾಜ || ತ\n9 ತ್ತು ) || ದ್ವಿಜಗುರುವೇವತಾಪೂಜಾಜಿನಸಹೂ ನಾನಾಜಯೇಚರನನದ್ಭತ ಶ್ರೀಮನ್ದೃಷಪ್ಪು ಗೋಣಪಮ\n\n೨ ನೇ ಪತ್ರದ ಮುಂಭಾಗ-\n10 ಹಾಧಿರಾಜ || ತಜ್ಯ ಪುತ್ರ || ತ್ರ್ಯುಯವ್ಯ ಕಚರಣಾಂಬೋಜೋರುಹಾರಜ್ರಪ್ಪಿತ್ಯುತ್ಪೈತೃಕಮಾಭ್ಯ ಸ್ಯೈಟುಜ\n11 ಬಲಾರಂಚರಾತ್ಮಕತ್ಯೊಕ್ಯತರಾಜಕಿಯಕಲಿಯುಗಬಳಚಾರಾವನನ ದೈ ಶೇರೆದೊಗನಿಕೃನೆನ್ಮ ದೃಶೀಮನಾನ್ಯಧ\n12 ವಮಹಾಧಿರಾಜ || ತಸ್ಯ ಪುತ್ರ || ಶ್ರೀಮದ್ಯುಂದೇವಬಕುಲಗೇಗೆನಧಸ್ಟಿ_ವಮಲರಿಕ್ಕನ್ಯಮ್ಯಾಗೈಮೆ\n13 ಹಾಧಿರಾಜಸ್ಯಸ್ವಯಾಬಾಹಿಗನೇಯೋ. ವಿದ್ಯಾವಿನೆಯೀತಿಸಿಸುಸಂಪುರಿತಕಾಣ್ಡ ರಾಜನಿಲವಗಹಪ್ರಧಾನಾಸಾ\n14 ವ್ಮ್ಯನಿಸೃನ್ಮಪುದ್ರಮಗಣ್ಯ ಶ್ರೀಮನಾನ್ಯಖ್ಯ ನೇಮಮಹಾಧಿರಾಜ ಅವಿನೇಕನಾಮದೆ.ಯುವತಸ್ಥೆ\n15 ದೇಷೀಗರಣೋಕ್ಸನ್ನಾ ಕಾನ್ನಾ ದ್ವಾಯೋಜುಗಣೇನಾ) ಭೂಟಾರ ಸಿಸನ್ಸ್ಯು ಅಥೇನನಿ ಭೂಟಾ ರಸಸ್ಯ ಸಖ್ಯಸ್ಯೆ\n16 ಸೀಳಭದ್ರಭಟಾಸಿಸೃಪ್ಯಸ್ಯಾ ಜಯಣಾವಿ ಭೂಟಾರಸಿಸ್ತೃತ್ಯ ಗುಣೇಣನಿ ಭೂಟಾರಸಸ್ಯೃ ಚೇಟ್ರಜಾಸಿ ಭಷಿರ\n  ರ್ಗೃ ಅಸ್ಮಾಯ ಅ\n17 ಸೀಳೀತುತ್ತರಸ್ಯ ತೃಯೋ:ಶತಸ್ಯೆ ಸಂಸತ್ಯರಸ್ಯ ಮೋಘವನಾಸೆ ಶೋಮವಾರೆಣ ಸೃತಿನೆಕ್ಷತ್ರ ಸುದ್ಧವಜ್ಞಮಿ\n  ಅಕಾಳೇ\n18 ವರ್ಷಪ್ಪಧುವೇಲಲ ಭಮ್ಮಿನು) ತಳವನನಗರೆನಿವಿ ಯುಜಿನಾಲಯಕ್ಕೆ ಪೂರ್ಣಾದ್ಧಾಸಹಸ್ರು ಎದೆನಾದಸೆ\n19 ವೃದ್ದಿಮಧ್ಯೆ ಬದನೆಗೆಪುನಪನಾಮ ಅವಿನಿಕೃತಮಾಧರಾಜಿನನತ್ರನಸನಡಿಯ ಅತೇಅಳಂ ಊರೂರ\n\n೩ ನೇ ಪತ್ರದ ಹಿಂಭಾಗ-\n20 ರೊರಪುನ್ನಿ ಕೃಣ್ಣಾಗ್ಯೆಯು ಅನ್ಯಲಿಮಣ್ಯಂಓಳವನಪುದ್ರೆಲ್ಲಳ ಲ್ಯವಿಕಿಯಮಣೆತೃಗಗೀತೆಯೊಲ್ಲೆ\n21 ನ್ನಿಕ್ಕಣ್ಯಂಗಂಇಂಕೆತೀಯೊಳಂಜರಾಮೂತೇ ಅಣಮೋದೇನಸನ್ನಿ ಕ್ಕೆಣ್ಣಿಗಮನೆನೇಹರಂದೆಂತು ಬಿಚನೆ\n  ಗುಪ್ಪಿ\n22 ಗ್ರಾಮಸ್ಯೆ ಸೀಏಮಾನನರಂ ಪೂರ್ಬ್ಯಕಸ್ಟಾಯಾ ರಿಸಿ ಕೊಂಜೆನೀ ಅಡೀವಜಸೆಲೆಯೊಕಿರೆಯಲ್ಲ್ಯ ಕೊಟ್ಟಗೆರಳು\n23 ದೆಣೆ ಸುಸ್ಸೆಯ ತ್ರಿನ್ಮನ್ಯಸೆಕ್ತಿ ಕೋಅಡು ಅಗ್ನಿ ಣೆಯದಿಂತ್ಯ ಬನ ನ ಕಾಳೇನತೂಕಾಠಂ ಪುದಕ್ಷಿಣಸ್ಯಾಂ\n24 ದೆನ ಬಹುಹತ್ಯು % ಯೊಬಲ್ಯೆಣನ್ಯಹಮೆ ಪುನಪಟ್ಟಿ ಮಮುಜೀದೇಸನ್ನು ಬಹುಮುಳಿ ಕನ್ಸಿನಯೆ ಪುನಪ\n25 ದಕ್ಷಿಣಸ್ಸುಯ್ಯ ಕೊಟ್ಟ ಗರಮುಖಟ್ಟಿ ಯು ತ್ರ್ಯಸನ್ಯ ಕೊಠತೆಪಣ್ಣೆ ಗಾಲ ಪುನಸ್ಸುರ್ರವ ಸೆನ್ನು ಕಥರವೆಷ್ರೈ", "roman_pages": [46, 51], "original_pages": [115, 115], "translation_pages": [91, 92]}, {"id": "epca|I|2", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 2, "find_spot": "On a stone at Bīliūr (in Kiggat-nād).", "date": "Date 888 A.D.", "translation": "Prosperity to the Jina-śāsana.\n    Of the years expired since the time of the Saka king, the eight hundred and ninth year\nbeing current,—\n    Be it well. Satyaśākya-Koṅguṇivarmma-dharma-mahārājādhirāja, boon lord of\nKovalāla-pura, lord of Nandagiri, in the eighteenth year of śrīmat-Permmaṇadi's anointing\nto the kingdom, on the auspicious fifth day of the month Phālguna, to the Śivānandi-siddhānta-\nbhaṭāra's disciple Sarvvaṇandi-dēva, for the Satyaśākya Jina temple of the Penne\nkaḍanga, Permmaṇadi gave the twelve hamlets of Bilitūr in Peddoregare, free of entry\nfrom all feet.³\n    They of the Ninety-Six Thousand, the five tributary chiefs, the seventy of Beddoregare,\nand the eight householders are witnesses to this.\n\n53\nThey of the Male Thousand, the Five Hundred, and the five ? garland-makers are\nguardians of this.\nWhoso destroys this destroys Bārāṇasi, a thousand Brāhmans and a thousand tawny\ncows, and is guilty of the five great sins.\nSedōja's writing.\nBiliūr will bring eighty gadyāṇas of gold and eight hundred (measures) of paddy.\n\nFootnote\n1. ¹ Baḍaneguppe still exists under the same name, and is in the north of the Chāmrājnagar tāluq of Mysore. Of the other villages mentioned in the boundaries and witnesses,—Dāsanūr is in Nanjangūḍ tāluq, Polma, now called Homma (see Ch 83) and Ummattūr are in Chāmrājnagar tāluq, Tagaḍūr is in Nanjangūḍ tāluq, Gaṇiganūr in Yelandūr, and Nandyāla is named in Yl 27.\n2. ² Generally the phrase is 'Sagara and others.'\n3. ³ Or, perhaps, 'free of all imposts.'", "text_roman": "Footnote\n8. bhadram astu Jina-śāsanāya Saka-nrip-atitā-kāla-saṁvatsaraṁgal* enṭunūr-ombattaneya varsham pravarttisuttire svasti Satyavākya-Koṁgunivarmma-dharma-mahārājādhirāja Kovalāla-puravarēśvara Nandagiri-nātha śrīmat-Permmaṇadiya rājyābhiṣēkaṁ geyda padi nenṭaneya * varshad andu Pālguna-māsada śrī-pañchame yandu Śīvapandi-siddhāntada- bhaṭārara śishyar Ssarvbaṇandi-¹⁰-dēvargge \"Penne-gadaṅgada Satyavākya-Jinālayakke Peddōregareya Biliūr-ppannir-ppalliīyumam sarvba-pāda-parihāra Permmaṇadi koṭṭō tom bhaṭṭaru-sāsirvbarum ay-sāmantarum Beddoregareya elpadimbarum enṭ-okkalum idakke sākshi Malo-sāsirvbarum aymurvbarum¹² ay-dāmarigarum idakke kāpu idan alidoṁ Bārāpāsiymum sāsirvbar-ppārvbarumam sāsiraiṁ kavileyuman aļidoṁ pañcha-mahāpātakan akkuṁ Sedōjana likhitta¹³ Beliūra¹⁴ enbattu-gadyāṇa ponnu enṭu-nūru-battamum teruvoṁ.", "text_original": "ಕೆಗ್ಗಟ್ಟೂ ದಿನಲ್ಲ ಬಲಿಯೂರೆ ಗ್ರಾಮದ ಕಡಂಗದಲ್ಲಿ ಬಿದ್ದ ರುವ ಶಿಲಾ ಶಾಸನ\n\n1 ಶ್ರೀ ಭದ್ರಮಸ್ತು ಜಿನಶಾಸನಾಯಸಕನ್ಯಪ\n2 ತಿಶ್ರತಕಾಲ ಸಂವತ್ಸರಗಳಲ್ಲಿನ ನಕ್ಷತೊಮೃತ್ತ ನೆಯೆವರ್ಷ\n3 ಮ್ಹಿನೆತ್ತೆ ಸುಕ್ತಿರೆ ಸ್ವಸ್ತಿ ಸತ್ಯವಾಕ್ಯ ಕೌಂಗುಣಿವಮ್ಮು ಧಮ್ಮಮ\n4 ಹಾರಾಜಾಧಿರಾಜಕೆಳವಳಾಳಪುರದವರೆೆಶ್ವರನ ದ್ವಾರನಾಥ ಶ್ರೀಮ\n5 ತ್ವಮೃ್ತ ನೆಯೋರಾಜ್ಯಾಭಿಷೇಕಾಗ್ದ್ಯ ಪದಿನ್ನೆಟ್ಟನೆಯವರ್ಷದನು ಪಾ\n6 ಲ್ಯಾಣಾಮದ ಶ್ರಿನಾತ್ಯಾ ಮುಯದ್ದು ಕೀವನಿಸಿ ಸಿದ್ಧನ ದ ಭಟಾರ\n7 ರಜಷ್ಯನ್ಯೃ ವೃಣ್ಯರಾವಿನಿದಿ ಧರ್ಮಕ್ ಪೆಟ್ಟಗೆಣದ ಸತ್ಯವಾಕ್ಷ್ಯಜಿನಾಲ\n8 ಯಕ್ಕೆ ಹೊಟ್ಟೊ ಡಾರಯೆಬಿಲ್ಲಾಣಪ್ಪುನ್ಯಪುಲ್ಯಯುಮಸವೃಪದವದಾರಿ\n9 ಹಾರನೆನ್ನಿಗೆನಿಸಿಕೊಟ್ಟೊತ್ತೊೆವೆತ್ತ್ರ ಆಸಸೀನ್ಮ್ಯ್ ರಮಯ್ಯಾಮನ್ನು ರುಂಬದೆಂಡ್\n10 ಜಿಗಿರೆಯೆನ್ನಿನ್ಯುಮೈ ಎಣ್ಮೈ ನುಲ್ಲು ಇದಕ್ಕೆ ಸಾಕ್ಷಿ ಮಲೆಸಪಿ\n11 ವೃದಾಯಮೃಯೆ ಪ್ರರಂಮಯ್ಯದಮರಗೆದು ಇದಕ್ಕೆ ಕಾಪ್ರಾ ಇದನಕಿದೆಂ\n12 ಬಾರಿತಾ ಸಿಯುವೆಮೂಸಾಸಿನ್ಯ್ಯಪ್ಪೆನ್ಯರಮೂನಾಪಕರೇಕವಿರಿಯಮುಂಲ\n13 ಜೆದೆೆಂಹಜ ಮಹಾಪಾತಕನನ್ಯಾಸ್ಯೋಜಿಜನಲಿಲಿತಂ\n14 ಬೆಳಿಳೂರು ಎಣ್ಣೆ ತೆಗದ್ಯಾಣೆಪೊನ್ನಂ ಎಣ್ಣ್ಯನೊಂಟುಬತ್ಯ\n15 ಮುಂ ತಬುಪ್ರೆಂ\n\n[Kannada original]\nಕೆಗ್ಗಟ್ಟೂ ದಿನಲ್ಲ ಬಲಿಯೂರೆ ಗ್ರಾಮದ ಕಡಂಗದಲ್ಲಿ ಬಿದ್ದ ರುವ ಶಿಲಾ ಶಾಸನ\n[English translation, Gemini-rendered, verify]\nA stone inscription lying in the trench of the village of Baliyur in Keggattu dinah.", "roman_pages": [51, 51], "original_pages": [116, 117], "translation_pages": [92, 93]}, {"id": "epca|I|3", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 3, "find_spot": "On a stone at Kotūr (same nād) in the Lakkunda forest.", "date": "Date about 890 A.D.", "translation": "Be it well. Satyavākya-Kongunivarmma-dharmma-mahārājādhirāja, boon lord of\nKuvalāla-pura, lord of Nandagiri, śrīmat-Permmaṇadi :—when on Jedala Ereyanga-\ngāvuṇḍa's son he bound the Permmadi-vattam, the order for the estate granted was as\nfollows :—the fixed land-rent forty gadyāṇas of gold, and of seed paddy one hundred\n(measures) of paddy ; thus for all time was a decree granted.\nBūvayyu's letters.\nProsperity. Kaḷnād for Ereyanga. Great good fortune.", "text_roman": "svasti Satyavākya-Koṁgunivarmma-dharmma-mahārājādhirājaṁ Kuvalāla-puravarēśvaraṁ\nNandagiri-nāthaṁ śrīmat-Permmaṇadigal Jedala Ereyanga-gāvuṇḍana magaṁge Perinmadi-\n\n1 The ta is inserted below the line between two vertical strokes.\n2 What looks like this name is inserted below the line here in a different cursive hand.\n3 The ya is inserted below the line.\n4 Generally Sagarādhibhiḥ.\n5 Properly sētum: the collocation dharma hētum recalls the Buddhist formula.\n6 Generally bhavina.\n7 Generally Ramachandraḥ.\n8 See note 2, p. 30.\n9 The first ne is inserted below the line.\n10 For the subscript va the earlier form of ða is used; also in 1. 8, 9.\n11 The sign for subscript na is the same as for na, as usual at this period.\n12 Read aynurvarum. The subscript wa in this and the next line has the modern form of ła.\n13 Read likhitam.\n14 This name begins with the old form of ða here, but with the new form in l. 8.\n\nvattaṁ gatti bitta stiti-kramam āvud endoḍe siddhāyada ponnoḷ pattu gadyāṇa ponnum\nbiltiya bhattadoḷ nūru-bhattamumam ellā-klakkam sāsanam āge biṭṭar Būvayyan akkaraṁ\nmangalaṁ Ēreyangamge kalnādu mahāśrī.", "text_original": "ಅದೋ ನಾಡಿನಲ್ಲಿ ಕೊತೂರು ಗ್ರಾಮದ ಲಕ್ಕಣದ ಕಾಡಿನಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\n1 ಸ್ವಸ್ತಿ ಸತ್ಯವಾಕ್ಯಕೊಂಗುಣಿವರ್ಮ್ಯ\n2 ಧರ್ಮ್ಯಮಹಾ ರಾಜಾಧಿರಾಜಂವವೆ\n3 ಆಳಪದವರೆಳೇರಂ ನನ್ನ ಗಿನನಾಥಂ\n4 ಶ್ರೀಮತ್ತೆಮ್ಮಗನಿದಿಗಲ್‌ ಜಿಡಲ\n5 ಎಪ್ಪೆಯೊ ಗಾವಉಣ್ಣಮಗಂಗೆಮ್ಮಾ\n6 ದಿವೆತ್ತ್‌ ಗಟ್ಟೆಬೆಟಿತ್ತ್‌ ತಿಕ್ರಮಮಾ\n7 ಪೃದಿನೋ ದೆಸಿದ್ಧಾದೃದ್ಪೋರ್ಣ್ಯ್ನಾ ರ್ಧ್ವತ್ತ\n8 ಗದ್ಯಾಣಪೊನ್ನು ಒಬಿತಿ ಯೆಭ\n9 ತೃದೆದಲ್‌ ನೆಔಉಬೆತ್ತ್‌ ಮುಮಂಎಲ್ಲಾ\n10 ಕಾಳಕ್ಕೊಳಾಸನವನಾ ಗೆಬೆ\n11 ಟ್ಟೆಟುಬ್‌ ಬೆಯ್ನ್ಯಕ್ಷರಮಂಗಳಂ\n12 ಎಜೆಯೊಗಂಗೆಳಣ್ಮ ದಮಹಾತ್ಮೇ", "roman_pages": [51, 52], "original_pages": [117, 117], "translation_pages": [93, 93]}, {"id": "epca|I|4", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 4, "find_spot": "On a stone at Peggūr (same nād).", "date": "Date 978 A.D.", "translation": "Be it well. Of the hundreds of years expired since the time of the Saka king, the\n899th, the year Īsvara being current :—\nBe it well. Satyavākya-Kongunivarmma-dharmma-mahārājādhirāja, boon lord of\nKōlāla-pura, lord of Nandagiri, śrīmat-Rāchamalla-Permmaṇadi, within that year, on the\nNandīsvara talpa day of the bright fortnight of Phālguna,—\nBe it well. When the valiant one adorned with powerful right arm—the abode of his\nsword—vigorous in seizing the priceless pearls scattered from the frontal globes of the troops\nof proud elephants of all his enemies, his elder brother's-warrior, a friend of the poor, śrīmat-\nRakkasa was ruling Beddoregare ;—\nProsperity to the Jina-śāsana. A resident of Belgoḷa, śrīmat-Anantavīryyayya, the\nbeloved disciple of śrī-Guṇasēna-paṇḍita-bhaṭṭāraka, who was the beloved disciple of śrī-\nBirasēna-siddhānta-dēva, acquired Peggadūr and the new trench, secure against obstruction.\nWitnesses to it :—They of the Ninety-six Thousand, the five tributary chiefs, the\nPeddoregare seventy, and the eight householders.\nGuardians of this :—The four Malepar (or hill chiefs), the Five Hundred, and the\nfive ? garland-makers.\nWhoso destroys Śrīpurusha'-mahārāja's gift destroys Bārāṇasi, a thousand Brāhmans\nand a thousand tawny cows, and is guilty of the five great sins. Who protects this\nacquires great merit.\nChandanandiyayya's writing. Grant of the Perggaḍūr basadi.\n\n54\n\nFootnote\n1. So apparently in the latest impression; but in those given in my first edition and in Ind. Ant. vi, 102, it was clearly Śrīpurada. It is doubtful if Śrīpurusha would have been read unless for this name being known familiar. It looks more like Śrī-parama-mahārāja.", "text_roman": "svasti Saka-nṛipa-kāl-ātita-samvatsara-sataṅga 899 ttaneya Īsvara-sa[ih]vatsaraṁ pra\nvarttise¹ svasti Satyavākya²-Koṅgivarmma-dharmma-mahārājādhirājā Kōlāla-puravar\nēśvara Nandagiri-nātha śrīmat Rächamalla-Parmmanadigal tad-varsh-[ā]bhyantara\nPhālguna-sukla-pakshada Nandisvaram talpa-devasam äge svasti samasta-vairi-gaja-ghat-ātōpa-\nkumbhikumbha-stala-spuțit-ānargghaya-muktāphala-grahana - bhikara - kar-āse - nivāsita - dak\nshina-dōrddanda-maṇḍita-prachaṇḍam annana³-baṇṭa badavara-nantaṁ śrīmat Rakkasa\nBeddoregareyan aluttire bhadram astu Jina-sāsanāya śrī-Belgola-nivāsigal-appa śrī-Birasēna\nsiddhānta-dēvara vara-śishyar śrī-Gonasēna-paṇḍita-bhaṭṭārakara vara-śishyar⁴ śrīmat\nAnantaviryyayyamgal Pe[r]ggadūrūm posa-vādagamuman abhyantara-siddhiyēge padedar\nadarkke sākshi tombhattaru-säsirbarum ay-sāmantarum Beddoregare-yēlpadi mbarum\nen-okkalum idam kāvar nnālvar Mmaleparum aynūrrbarum ay-dāmarigarum Śrīpurusha⁵-\nmahārājadattiyan avon orrban alidom Bānarāśiyum säsirba-Brāhmaṇarum sāsira-kavileyu\nman alida pañicha-mahāpātakan akkum idan är-orbar kädar avarge piridu punyam 6 Chanda-\nnandiyayana likhitam|| Perggadura basadiya säsanaṁ.", "text_original": "ಅದೋ ನಾಡಿನಲ್ಲಿ ಪೆಗ್ಗೂರೆ ಗ್ರಾಮದಲ್ಲಿರುವ ಶಿಲಾಶಾಸನ\n1 ಸ್ವಸ್ತಿ. ಸಕಲಪ್ರಶಾತಲತೆಸಂತವ್ರತಸತ್ತ್ಯ., VFF ಕೃನೆಯ ಕಸ್ಮರಸಂವ\n2 ತೈರಪುನವೆತ್ತಿನಾ ॥ ಸ್ವಸ್ತಿ ಸತ್ಯವಾಕ್ಯಕೊಂಗುಣಿವರ್ಮ್ಯಮಹಾ\n3 ರಾಜಾಧಿರಾಜಾ ಕೇರಳಳಪುದವರೆಳೇರನ ನನಿ ಗಿರಿವಘಟಾಟೀಣ\n4 ರಾಜಮಲಹಮ್ಮ್ಯನದಿಗಲ್‌ ತೆದ್ವಪಾರ್‌ಖ್ಯಣ್ಣ ರದಾಲ್ನಾ ಣಸೂಲ್ಕರಸಕದ ನ\n5 ಸ್ನಿಪ್ಪರೊತಲ್‌ಲದನೆಸಮಾಗೆ ಸ್ವಸ್ತಿ,ಸಮಸ್ತ ಮ್ವರಿಗಜಿಘಟಾಟೀಣ\n6 ಕುಂಬಿಕಂಭಂಸ್ಯ ಲಸ್ಸ್ಯತಿ ತಾನಬ್‌ ಮುಕ್ತಾಯ ಫಲಂಗದೊಣಭಿಳಕರಸಾಸ\n7 ನಿವಾಸತದಕ್ಷಿಣ ದೊದ್ದೆಣ್ನಗ್ಗಣ್ನ ಮುತ್ತೆ ತ ಪರ್ಜಣ್ಣಂ ಅಣ್ಣ ನಬ್ಬೆಣಾಬ\n8 ದವರದರಣ್ಣಂ ಶ್ರೀಮತ್‌ ರಕ್ಕಸಬೆದೊಣ ಜಿರೆಯೊನಾಳುತ್ತಿರೇಭದಮು\n9 ಸು ಜಿಳಕಸೇನಾಯ ಶ್ರೀ ಬೆಳ್ಳಣ್ಣ ಲನವಾಸಗರಳಪ್ಪ ಶ್ರೀ ಬಿಳಿಸೆದನಿಸಿ\n10 ದಾಣ್ಯದನೆದವರಬೆಕ್ಕಿ ರೇ ಗೋಣಸೇನಸಣ್ಣತತ್ವಟ್ಟು ರಕರವರ\n11 ತಿಸ್ರ್‌ ಶ್ರೀಮತ್‌ ಅನಸ್ತವಿವ್ಯ್ಮಾಽಯ್ಯಂಗೇರೆಗ್ಗ ೯ದೊರುಂಪ್ರೊ\n12 ಸವಾದಾಮಮುಸುಬೆಲ್ಲನ್ನೇರೆದ್ದಿಯೊಗ ಪದೆದರದೆಕ್ಕ್ಯಸಾ\n13 ಕೃತೊಂಭತ್ತುಣಸಾಬ್ಬ್ಯರಮುಮಯ್ಯಾಮನ್ರುರಂಬೆಡ್ಡೆ ಜಿಗೆರೆ\n14 ಯೆಡ್ದಿದುಬರುಮಿಬೊಕ್ಕಣಲಿವುದೇಂತಾವನ್ಯಾ ಗಲ್ಲಮ್ಯಾಳೇಸರು\n15 ಮಯ್ಯಾಣ ಬ್ಯ್ಕರುಮಯ್ಯಾ ಮಾರಿಗುಂ ಶ್ರೇಷ್ಠ ಇಷ್ಪ 1 ಮಹಾರಾಜಣ\n16 ದೆತೆಯಾನವನ್ನೊಬಖ್ಯರ್ನನತಿಕೊಂ ಬಾಣಾರಾಸಿಯಂ ನಸಾಬ್ಬೆ ಕಬ್ಬಾಹ್ಮ್ಯ\n17 ಣನುಂ ಸಾಸಿರಕವಿಲೆಯೊಮನುಸತಿದ ಸಣ್ಮಾಮಹಾಪಾತಕನಕ್ಯಂ\n18 ಇದನಾರೊಬ್ಯ್ಕಾಕ ದರವರಗಪಿರೆದು ಪುಣ್ಣೊ ಚನ್ನಣ್ಸಯ್ಯೊಯ್ಯನ ಲಿಖಿತಂ\n19 ವೆಗ್ಗರ್ದದೊರಬೆಜೆಯ ಶಿಲಾಸಾಸನ", "roman_pages": [52, 52], "original_pages": [117, 117], "translation_pages": [93, 94]}, {"id": "epca|I|5", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 5, "find_spot": "On a stone at Mercara Central School, brought from the country ;", "date": "Date 1000 A.D.", "translation": "Be it well. Fortune.\nIn the Śaka year 921, the year Sārvvari, the full moon day of the month Phālguna,\nUttarā-Bhādrapada, Sunday, -Ganagūr Riha-gāmuṇḍa's son Ilañcha[da] riwa-seṭṭi, having\nserved with Kupindora and finished his time,-made (or established) Kālūr, and by the\npower of his arm having acquired Bōkanahalli in Muḷḷūr-nāḍ, Gorabaḷli of Hakādivādi,\nand Kūḍalūr of . . . . -nāḍ; -first bathing away the guilt, and worshipping Rāmēśvara,-\ntogether with ? nine fowler's (front) yards, gave for dharma a khaṇḍuga of land.\nWhoso destroys this dharma incurs the guilt of destroying tawny cows.", "text_roman": "now in the Commissioner's office.\n\nsvasti śrī Śaka-varisha 921 neya Sārvvari-samvatsarada Phālguna-māsada puṇṇame Uttare-\nBhādrapada Arkkavarād-andu Gaṇagūra Biha-gāmuṇḍana magam Hañicha[da]rma-seṭṭi\nKunin dor-olege gēdu kālam tiḷidu Kāluṛam mādi Muḷḷūr-nnāḍa Bōkanahaḷḷiyu Hakādi\nvädiya Gorahaḷi . . yu . . . leyu-nāḍa Kūdalūrumam tanna bhuja-baladinda paḍedu\nmodal kālušiyam mindu Rāmēśvaram archi . . battu kabbil-angaleu dha[rmma]kke biṭṭa\nmaṇṇu khaṇḍuga i dharmmavau alidam kavile .", "text_original": "ಮಡಿಕೇರಿಯಲಿಲ್ಲಿ ಸೊಂಟಲೊ ಸುಮ್ಮಲಿನ ಬಾಗಿಲಲ್ಲ ತಂಮ್ದೆ ಇಟ್ಟಿದ್ದ ಶಿಲಾಶಾಸನ\n1 ಸ್ವಸ್ತಿ ಶ್ರೀ ಕಳವರಿ\n2 ಪ್ಪ ಕ೧೦ ನೆಯ ಸಾ\n3 ಮೈರ್‌ಲಿಸಂ\n4 ವಕ್ಷರರ್‌\n5 ದೆವತೊಲಗಿ\n6 ಣಾಮಾಸ\n7 ದಪ್ರಣ್ಣಮ್ಯೇ ಉತ್ತರೈಬ್ರಾ\n8 ದ್ರನಸೆ ಅಕ್ಕ್ಯವಾರದನ್ನು\n9 ಗೇಣಗೊರಬೀಕ್‌ಗಾಮು\n10 ಣ್ಣಮಗಹಂಹಣ್ಣ [ದ]\n11 ಮೋಸೆಟ್ಟಿ ಕುತತೆನ್ನೆರೊಳಗೇಗೆಡು\n12 ಕಾಲಾಂಶಿಟ್ಟಿ ಊರಾಳೂರುರೊಮಾ\n13 ಡಿಮುಲಕ್ಕಣ್ಮ್ಯಾಳಡಬೆಟೊಕನಹ\n14 ಲ್ಲ್ಯಮಹಕಾಡಿಯಾಡಿಯೆಗೆ\n15 ರಹಳ್ಳಿ . ಯೂ\n16 ಲೆಯುಮಾ ದೆಕಡೆಗೇರು\n17 ಮಾಂತಪ್ಪ ಭೂಮಿಬಲಿದಿನ\n18 ವಡೆದುವೆಧೆಲ್ಲಲ್ಯುಕ್ತೆ\n19 ಯೊಮ್ಮಿನ್ನು ರಾಮವೆಕ್ಯೋರ್ಮಚ\n20 - ಬಟ್ಯ ಕಬ್ಬಿಂಗರಗಳೂಧ\n21 [ಮ್ಯ್ಕ]ಕೃಬಿಟ್ಟ ಮಣ್ಣು ಬಣ್ಣಾಗ\n22 ಕಧಮ್ಯ್ರಳವನದೊಕೇವಿಲ\n\n1 Or P ಶ್ರೀಪುರದ, as in first edition, and IA, vi, 102.\n10-A\n76", "roman_pages": [52, 52], "original_pages": [117, 118], "translation_pages": [94, 94]}, {"id": "epca|I|6", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 6, "find_spot": "On a virakal at Niḍuta (in Yēlusāvirashime).", "date": "Date 1255 A.D.", "translation": "Be it well. In the victorious increasing Śaka year 1177, the year Rākshasa (the\nmonth) Vaiśākha, the 11th day of the bright fortnight; in the time (of the auspicious reign)\nof śrīmat-pratāpa-chakraverti Hoysana bhujabala śrī-Vira-Nārasimha-Rāya :-Sōmaiya, the\nson of Bira-gavuḍa of Kahigōḍu, shouting-, Bumbiya-nāyaka himself, taking with him his\nservants Bīmaiya and Sōmaṇṇa, fighting with him, he fell. In order that Sōmaiya may\nattain to the world of gods, Māri-gavuḍa who was born with him, and Māyiga, the son of\nthat Sōme-gavuḍa, have prepared and raised this vīragal. Great prosperity. Fortune.", "text_roman": "svasti śrī-jayābhyudaya-Saka-varusha 1177 ne Rākshasa-sam 1 Vaisakha śuddha 11 śi\nśrīmat-pratāpa-chakravarti Hoysana bhuja-bala śrī-Vira-Narasimha-Rāyana . . . kāl ad alli\nKahigōdina Bira-gavuḍana maga Sōmaiyanu boguṭṭā Bumbiya-nāyakanu tău dūta Bimaiya\nSōmaṇṇan odane yatti hōgi kädidalli biddanu a Sōmaiyanu dēva-lōkakke salla-bēkendu ātan\nodane-huṭṭida Māri-gavuḍanu Sōme-gavuḍana maga Māyiganu paripāya mādiṣida biragallu\nmangala-mahā śrī śrī śrī.\n\nFootnote\n1. The subscript t in this and the next word is formed in a peculiar manner. The engraver seems to have had some original ideas. See the stop in line 2, and nd in Nandagiri.\n2. Read Satyavākya.\n3. The double nane is here expressed by nna.\n4. These two phrases might be read devar avara śishyar and bhaṭṭārakar avara śishyar.\n5. The original impressions showed Srigurada.\n6. Read punyam.", "text_original": "[Kannada original]\nಯೂಳತ್ಸಾನೀರ ಗ್ರಾಮೀಯಲ್ಲಿ ನಿಡುತ್ತ-ಗ್ರಾಸಿನಲ್ಲಿರುವ ವೀರಕಲ್ಲು\n\n[English translation, Gemini-rendered, verify]\nHero-stone situated in the land of Nidutta-grāsa in the village of Yūlatsānīra\n\nಸ್ವಸ್ತಿ ಶ್ರೀ ಜಯಾಭ್ಯುದಯಕಲಿವರ್ಷ ೧೧೩೩ ನೇ ರಾಕ್ಷಸ ಸಂ. | ಸ್ವಸ್ತಿ ಶ್ರೀಯುಂ ೪೧೦ ಶ್ರೀಮತ್ಪತಾಪ ಚಕ್ರ\nವರ್ತಿ ಹೊಯ್ಸಣ ಭುಜಬಲ ಶ್ರೀ ವೀರನರಸಿಂಹರಾಯ್ಕ... ಕಾಲದಲ್ಲಿ ಕುಂಗೋಗಡಿನ ಬೀರಗವುಡನ ಮಗ ಸೋಮ\nವೈಯೆನು ಬೋಗುರಕತ್ತಾ ಬುಂಬಿಯೆನಾಯಕನ ತಾಳು ದೂತ ಬ್ಲಮ್ಮೆಯ ಸೋಮಯ್ಯನೊಡನೆ ಯುಕ್ತಿ ಜೋಗಳಿಕಾಡಿ\nಬೆಲ್ಲಿ ಬಿದ್ದನು | ಆ ಸೋಮೈಯನೊ ದೇವಲೇಕತ್ತಾ ಸಲ್ಬಬೇಕೆಂದು ಆಕರ್ಣಿಸಿದ ಹೊಟ್ಟೆದನೆ ಮಾರಿಗುಡ್ದೆನು ಆ ಸೋಮ\nಮಗುವಿನ ದನೆ ಮಾಯೆಗನು ಪರಿವಾಯಮಾಡಿದ ಬೀರಗಲ್ಲು, ಮಂಗಳ ಮಹಾ ಶ್ರೀ ಶ್ರೀ ಶ್ರೀ\n\n7 biṃsevaty,radevanehọmapūrvakṣētraṃ\n8 ceṃmikhyiniṇasū[ṭrī]guruvārandōmehāriha\n9 ṛe...kuṃdoringepūṇyaṃdeviheṃ\n10 ōṃgōseiluvelhaṇsmai,mōriyādiyi..kōṃ\n11 ṭṭukaṃmaṃtēvedehēṃnyrōṇyma makṣaṃ\n12 aṃgōṁti kti namarhaṃgalasuvuduet\n13 vuḍa mānayōṛlumānarējanakaṭa...\n14 nōelātay......pārīsi........\n15 kūṃciorōvadamayōlēroḷanaoci .\n16 kārimunangaḷ | mātahaiyuyanaśananyaṃ\n17 ēnālukamāṇaṣygyuṃdeḍāļajaṇabēṇaṭ\n18 hēgadehēlyiyamādanālabayōyaṃ\n19 rameḷigadōyuāgōḍugaḷomumyuāgā\n20 yōṃtiēruaḍuṉuvarakēṇaṇdvāṇityaṃ\n21 ruḷyubaṉarēkōṫsāsanaśameriyāṇīyavarat\n[daṃse\n22 navēṇoenjjiṇysuṉkaḷnyoēyda marlēo..", "roman_pages": [52, 71], "original_pages": [118, 139], "translation_pages": [94, 94]}, {"id": "epca|I|7", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 7, "find_spot": "*On another virakal at the same place.*", "date": "Date 1285 A.D.", "translation": "Be it well. In the victorious increasing Śaka year 1208, the year Pārthiva, (the\nmonth) Vaiśākha, the 12th day of the bright fortnight; in the time of the increasing reign of\nśrīmat-pratāpa-chakraverti Hoysana bhujabala śrī-Vira-Nārasimha-] dēvarasa :-Māra-Tamma\nof Kaibigōḍu, joining fight with his boasting bitter enemies, fell in the fight.\nIn order that Māra-Tamma may attain to the world of gods, his younger brother Maleya-\nnāyaka, and his sons Sōmaṇṇa . . . . . . . . . . . . . . . . . . . . . this vīragal.\nGreat prosperity. Fortune.", "text_roman": "svasti śrī-vijayābhyudaya Śaka-varusha 1208 Pārthiva-sam | rada Vaiśākha śudha 12\nśrīmat pratāpa-chakravarti Hoysapa bhuja-bala śrī-Vira-Narasimha-Dēvarasara rājyābhyu\ndaya-kāladallu Kahigōdina Māra-Tammanu tanna kochana-pratittu-matsara-virōdhangala\nkūdi kālagadallu kādi biddanu ǎ Māra-Tammanu dēva-lōkakke sala-bēkendu ātana tamma\nMaleya-nāyaka ǎ Māra-Tammana makkalu Sōmanna . . . . . vīragallu mangala mahā\nśrī śrī śrī.", "text_original": "ಅಮ್ನೆ ಗ್ರಾಮದಲ್ಲಿರುವ ಮತ್ತೊಂದು ವೀರಕಲ್ಲು,\n\nಸ್ವಸ್ತಿ, ಶ್ರೀಜಯಾಭ್ಯುದಯಕಲಿವರ್ಷ ೧೩೧೯ ಪಾರ್ಥಿವ ಸಂ. | ರದ ವೈಶಾಖ ಶುಧ ೧೧ ಶ್ರೀಮತ್ಪತಾಪ ಚಕ್ರ\nವರ್ತಿ ಹೊಯ್ಸಣ ಭುಜಬಲ ಶ್ರೀ ವೀರನರಸಿಂಹದೇವನರ ರಾಜ್ಯಾಭ್ಯುದಯದ ಕಾಲದಲ್ಲಿ ಕುಂಗೋಗಡಿನ ಮಾರ\nತಮ್ಮ್ಮನು ತಣ್ಣ ಕೋಜನ ಪ್ರತಿತ್ವು ಮತ್ಪರವಿರೋಧಗಳ ಕಾದಿ ಕಾರೆಗಡಲ್ಲ ಕಾದಿ ಬಿದ್ದನು | ಆ ಮಾರತಮ್ಮ್ಮನು\nದೇವಲೋಕಕ್ಕೆ ಸಲ್ಲಬೇಕೆಂದು ಆತನ ತಮ್ಮ್ಮ ಮಲಯನಾಯಕ ಆ ಮಾರತಮ್ಮ್ಯನ ಮಕ್ಮ್ಯಳು ಸೋಮಣ್ಣ ವೀರಗೆಲ್ಲ,\nಮಂಗಳ ಮಹಾ ಶ್ರೀ ಶ್ರೀ ಶ್ರೀ ಶ್ರೀ", "roman_pages": [61, 90], "original_pages": [118, 118], "translation_pages": [94, 94]}, {"id": "epca|I|8", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 8, "find_spot": "*On a stone in the Mahāliṅgēśvara temple at Pālūr (in Beṅgaṇād Kuyaṅgerinād,", "date": "Date about 1371 A.D.", "translation": "Be it well. Fortune.-Doing obeisance to Vināyaka the all-learned guru, and to the\ngoddess Sarasvatī,-- so far as I am able an auspicious śāsana will I make 1.\nBe it well. Fortune.-The disciple of Avidyāmṛityu-bhaṭṭāraka of the auspicious\nPurushōttama-parshad, Bōdharūpa-Bhagavar, had this stone śāsana made (for the god)\nMahādēva of Pālayūr. That whoso among the Śrīvaishnavas of the Eighteen countries,\nthe Valaijiyar (merchants) of the Eighteen countries, the arm-bearing Thousands of\nthe Eighteen countries, or the Brāhmaṇas of the Eighteen nāḍus, seeing it, will dutifully\nmaintain it, is this stone śāsana set up.\n\nWhoso does not pay 'as laid down by the amachchān after examination of the temple\nand the requirements of the worship, incurs the penalty of the man who murders his own\nfather, or takes to wife his own mother, or murders the king of the very nāḍu in which he\n1 The translations of the vernacular portions of this inscription and the next are in parts tentative.\n\nwas born, or cuts off the nose of him who having bound on the right side seizes on the\nleft, or marries a woman within the prohibited degrees of relationship.\n\nThe Valanijiyar of the Eighteenth countries and others . . . will have the daily\nexpenses and other provisions noted in the treasury accounts of the temple read out once\na year, and see that each item mentioned therein which has been omitted to be carried out\nis properly conducted as directed.\n\n**9**\n*Date about 1371 A.D.*\n\nBe it well. Fortune.—Doing obeisance to the guru by devotion,—Bṛihaspati (Jupiter)\nbeing in conjunction with Kanya (Virgo), in the great month named Vṛiśchika (Scorpio),\non the day following Bṛihaspati's (that is on Friday),—a universal sāsana, a sāsana for the\nguru, who is a form of joy, will I, Bōdharūpa, make even at the holy Bhagandāśrama also.\n\nWhen Mēlpundi-Kunniyarasa was ruling the nāḍu,—Bōdharūpa-Bhagavar-arasu of the\nauspicious Purushōttama-parshad, with others, had a copper plate engraved. Whoever\nstops for a day the daily expenses laid down in the plate, whether male or female, including\nKunniyarasa (himself), violates the order of the king ruling this nāḍu. The penalty\nfor such violation for one day is 12 kaṇam and twice the offerings for the god; and when\ncontinued for a whole week, 12 kaḷanju of gold of 7 touches to the king.\n\nThere will be 17 perpetual lamps. The quantity of rice to be supplied by the poduvāl\nfor daily offerings, etc., is 26 nāli. For the high oblation there will be 2 nāli, and for flowers\n4 nāli. There will also be supplied daily 32 garlands of flowers and 6 lamps in the month of\nVṛiśchika.\n\nWhoso does not pay as laid down by the amachchān after examination of the temple\nand the requirements of the worship, shall be looked upon as a traitor conspiring to\nmurder the king of the very nāḍu in which he was born, and incurs the penalty of the man\nwho cuts off the nose of him who having bound on the right side seizes on the left, and of one\nwho takes to wife a woman within the prohibited degrees of relationship. Should the king\nbe indifferent towards a man who does not pay the above fine, even after seeing and hearing\nhim, the people of his nāḍu will curse him. . . .\n\nThe people have to perform five items of service, of which the Mahābhārata is one. If\neven a single item of the expenses is stopped, the penalty shall be 2$\\frac{1}{2}$ kāṇam for every day.\n\nMay the arm-bearing Thousands of the Eighteenth countries and the Valanijiyar protect\nthe Vaganda temple. May the ascetics and the king ? prosper.\n\nWhatever is omitted here may be found in the treasury register and the copper plate.\nPakandala-āyāri's writing.\n\n**10**\n*Date 1544 A.D.*\n\nObeisance to śrī-Śāntinātha. Be it free from obstruction. Be it fortunate.\nMay it prevail, the auspicious supreme syād-vāda, a fruit-bearing token, the\ndoctrine of the lord of the three worlds, the Jina doctrine.\n\nBe it well. Of the śrī-Mūla-sangha, Dēśi-gana, Pustaka-gachchha, Kuṇḍakund-\nāuvaya, and Ingulēśvara circle, a bee intoxicated from the lotus feet of Gummata-Jin\nēśvara, the lord of the auspicious Belugula-pura, promoter of the religious merit of the\ntime, (was) Dharmāchārya, whose titles were as follows:—nourishing the groups of lotuses\nthe learned, he at the same time drove away the darkness from the minds of evil-speakers\nproud as the tortoise that bears up the earth, upholding the character of a Digambara\n\n56\n\nshining ornament, he ever protected the ruddy goose the Bhavyas (or Jains),—thus was\nthe sun Pandita-deva ever distinguished with the rays his gentle speech.\nBe it well. The auspicious Āchārya of the circle of the royal rājagurus, the great lord\nof powerful orators, a Brahmā of royal speakers, emperor of all the learned, preserver of the\nlife of Ballāla-Rāya,—distinguished with these and many other titles, was śrīmach-Chāru\nkītti-Pandita-deva; the disciple of whose disciple's disciple was śrīmad-Abhinava-Chāru\nkītti-Pandita-deva; whose beloved disciple, his elder brother's disciple, śrīmach-Chāru\nkītti-Pandita-deva's fellow-student, śrīmach-Chhliānikirttī-deva¹, in the Śaka year 1466\nexpired, the year Krodhi being current, on the 15th of the bright fortnight of Kārtika,\ncaused to be written a stone inscription as follows:—\nHis guru śrīmad-Abhinava-Chārukītti-Pandita-deva,—when, for the promotion of\nreligious merit in the Kali age, Śānti-tīrtheśvara and Anantanātha-svāmi themselves came and\nmanifested themselves from the Suvarṇāvatī river in the Śaka year 1453, the year\nVikritu, in Chaitra,—having paid a visit to the basadi of Śāntinātha-svāmi who dwells on the\nsummit of Anjanagiri, and made on the crest of the hill a basadi of wood—in the year Khara,\nin the month Chaitra, he caused it to be consecrated by the hand of his own younger brother\nKonasanaguḍḍa Śāntōpādhyāya, and left instructions for the erection of a stone basadi.\nAfter that, in the following year Krodhi, the 15th of the bright fortnight of Kārtika,\nthe stone work done to the foundation and the haladhāres were as follows:-to all the\nhalaru of Bemmatti Būtanhalli and Maganakere belonging to Nanjarāyajappaṭṭa, paid for\nstone work ga 200 honnu; to Ādi-Śrī-Avvagal of Hanasoge² for having the stone work of\nthe inner shrine done by Bhujabali-Śrī-Avvagal of Amman-Hósahalli, paid ga 30 honnu;\nto his guru śrīmach-Chārukītti-Pandita-deva for two sets of three haladhāre, and for a\ncurtain for the centre door at the one time of the offering, paid ga 50; and for a curtain at\nthe distribution of food ga 50\nIn the year Śubhakhritu, the 15th of the bright fortnight of Phālguna, all the halaru,\nthe Kannadiga halaru and Nānādeśi halaru of Bidire and Sītālamalige for the (god) Śāntis\nvara of Anjanagiri made a dharma and had it written in their dharma śāsana, saying the\n81 paṇa due for the footpath that we have built, we will give for distribution of food.\nWhoso fail in this dharma are guilty of murdering cows and Brāhmaṇs.\nIn the Śaka year 1465, the year Śubhakhritu, the 13th of the bright fortnight of\nChaitra, Wednesday, the Vrishabha-lagna, the family consecration was performed of the three\nsets of dēhāragalu³. For a dānaśāle the price of the Hallivayalu paddy field, 70 ga, and the\nsum given to the kōlāyuru for work at the new paddy field, 50 ga, both together an outlay of\n120 ga, was received from śrīmach-Chārukītti-Pandita-deva's disciples Ādi-Śrī-Avvagal of\nHanasoge and Bhujabali-Śrī-Avvagal, 24 ga; Basavapaṭṇa Anantamati-Avvagal paid through\nNēmi-Śrī-Avvagal 24 ga; Muddi-seṭți's Vijayi paid through Śrī-Avvagal 10 gu; through\nMuluganahalli Adyakka was paid 12 ga; from Haruva-seṭți and Vijeyana-seṭṭi, 30 ga; from\nKannanūr Dēvaramma-seṭți, 12 ga; .\nThree usual imprecatory verses.\nThat the dharma here made may endure as long as sun and moon it has been engraved\nin a śāsana. Great good fortune. Śrī, Śrī.\n\n57\n\nFootnote\n1. The translations of the vernacular portions of this inscription and the next are in parts tentative.\n1. i.e. śrīmat Śāntikīrtti-deva.\n2. It is a matter of special interest to note the existence of this sisterhood of Jain holy women mentioned in this inscription-Ādi-Śrī-Avvagal, Bhujabali-Śrī-Avvagal and so on, each probably attached to some temple.\n3. Bodyguards.", "text_roman": "Pādinālknād tāluq).*\n\nsvasti śrī | Vināyakam viśēshajñam gurum dēvim Sarasvatīm\n    namaskṛtya [ya]thā śaktyā karishyē śāsanam śubham |\nsvasti śrī | śrīma[t]-Purushōttama-parshad-Avidyāmṛityu-bhaṭṭāraka śishya\n    Bōdharūpa-Bhagavar Pālayū[r] Mahādēvārkkyu cheyda śilā-śāsanam |\npadineṇdēsi Śrīvaishṇavar muntāna padi[ne]dēsi Valanchiyar padinen-dēsi ppada-pidichcha- : "Pādinālknād tāluq).*$^{2}$\n\nsvasti śrī [1] namaskṛttya gurum bhaktyā | Kanyārudha-Bṛihaspatau[1]\n    Vriśchik-ākhyē mahā-māsē Bṛihaspatty-uttarā-dinē ||\n    karishyē śasana[m] sarvvam | gurōr ānanda-rūpiṇaḥ[1]\n    śāsanām Bōdharūpō-' haih śrī-Bhagandāsramē 'pi hi [1]\nMelpuṇdi-Kunniyarasan-nādu²-vālanikka śrīmat Pu[r]shōttama-pa[r]shat³ Bōdharūpa-Bhaga\nvar-arasu muntāy-chchaivitta cheppēttil akappatta nicheha-chchehilav-adayav-oru-nal tappich\nchānukku Kunniyarasan-muntāyāu-peṇu-akappaṇda mēl-in-nādu-vā lakkadav-arasan-āna āṇa\nttappu panniranḍu kāṇam pon kāsannī oru-nālukku iratṭippadi dēvarkku appadi śohchi-\nvattam adil ēril panniru-kalafichu pon-eḷu mārru araśukku nandāvilakku padinēlu | nāl-amu\ndu mudalāy poduvālar-iḍakkadav-ariy-iruvattāru nāli | olukk-avikk-iru-nāli pushpattukku\ndu mudalāy poduvālar-iḍakkadav-ariy-iruvattāru nāli | olukk-avikk-iru-nāli pushpattukku\n\nnā-nāļi agamañchu-māla muppatiṟaṇḍu Vṛiśchika-viļakk ādi sāntiunḍu pūvisthānau-\nnōkkiy amachchhānam uſchapadi cheluttanakil tau pīrantu nādu-vālum arasanaikalā-kuru\ndum-āpa avan nattil valattu kaţţiy-idattu piḍiochchhanāi mūkk-uṟuttu [a]van-pendilai-ttān\nkaļutra-vachoh[an] pada-kķadavada danqam ivv-ā ināṇa-miṟā nai kuṇḍum kētṭum-upēkshittu\npōm arasukku tan-nāţţil prakriti]āna āpatappi nādu vuqvittait-aijyattukku vidukkadavadar\nprakriti padaka muntaya paṇiy-añchu Mahābhāratam ongu i-chehilavil-oṇ-ṟu tappil nālukk-\nirand-arai-kkānam padinen-dēsi pada-piḍiochcha-Palāyiravar | Vaļāñchiyar | rakshikka Va\nkaṇdālaiya | sannāsyasialumm-ārasum muntayaidil mikkadu bhaṇḍāra-ppottukkattilum cheppėt\ntilum u. Pakandāla āyāri eluttu.\n\nFootnote\n1. *Read nēṭṭil.*\n2. *The stone is cracked across transversely, between the 18th and 22nd lines, — said to have been done by the followers of Tipu Sultān.*\n3. *Malayālam fa is used throughout in place of Tamil ṟa.*\n4. *Read parishad.*", "text_original": "ಪಾಡಿನಾಲ್ಕು ನಾಡ ತಾಲೂಕು ತೆವನಾಡು ಸಂಚಿನಾಡ ಭಾಗಮಂಡಲ ಗ್ರಾಮದ\nಭಗವಂತೇಶ್ವರದೇವಾಸ್ಥಾನದಲ್ಲಿರುವ ಶಿಲಾ ಶಾಸನ\n\nಪ್ರಮಾಣ 4'6\"×2'8\".\nಗ್ರಂಥ ಮತ್ತು ಅಕ್ಷರ\n\n1 ಸ್ವಸ್ತಿ ಶ್ರೀಮೃತ್ಸೃ] ಮಾರ-ಳೂಮುತ್ತುರ | ಕಲ್ಯು\n2 ೧-ಈ ಬ್ರಮಹಸ್ಥನ | ಳ್ಯಗ್ಲಕವೆೈ | ಹೋರಂರೊ\n3 ವೆೈ ವ್ರಹಮಸ್ಥಕ] ತ್ವರಾಶೆ | || ಹರಿಶೆಖ್ಯ | ಸಾರವಕ[೦]ವ\n4 ಜಿ | ಮಾರನಕಾಲ್ನಾ-ಇವಿಂಣೆ | ಸಾಳವಕಾಲ್ ಲೋಯಾಂಡ್ರುವೊ\n5 ಹೂಂ ಶ್ರೀಮಮನ್ನಾರೂವೆವೆಹಾಮಿ || ಡೋಣ್ಣಿಕಾ-ಶತಿಯಾವಹ್ರ\n6 ಡ್ರೂವಾರಿಾಧಿ ಶ್ರೀಸ್ಥೋ-ಬ್ರ್ಮ--ಸ್ತವೋಷ-ತೋಯಾಂಡ್ರುವೊ\n7 ಮವಾವಾಸಿವರ--ಹೋನಸರ್ವಿಲಿವೊಲಿತ ವೊಲ್ಪೋಕೊಳ್ಳುಡಿ ಕಿಲ್ಲು\n8 ಜಿರ್ವೆಾಡ್ಯಕೊವಾರ--ಕಾರ್ಕಲ್ಲುಗಾಕ-ಕಾಣೆ ಕೂಳಿಯಾವಸ್ತೋ\n9 ಕಾಯಾನ್ಣೆಂಪೂಲ್ ಕೀಕಿಲ್ಲಾ--ವಮ್ಮಾಲುವಾ\n10 ವಕಾಣಿ ಙಣಣತ್ತಿಷಾ ವತಿರಾಣ-ಕಾಂಡ್ರು ಪೊಳ್ಳಿಕೆ\n11 ೯ಅಸ್ತಿ ಳ್ಯ ಕಾಜ-ಠ್ರೂ ೬ ಹೂಯಿಲ್ದೈ ವೋದತ್ತೂ ಕಲುಪಿಳ್ಳು\n12 ವಜ್ಯ ಕಕಿಲ್ದೆಅಲ್ಲಿ ವತಿರಾಣಕಾಪು--ವೋದತೋ\n13 ಮುರೇಟ್ರು ಕಾಸೂ-ಠ್ರೂ ಕಡಣಿವ್ಯತೂ ವಶಿಕೊಳ್ಳ | ಕಾನಿ\n14 ತು ೯-ಕಾಗಾಯಿ ಪೊತ್ಸವಾರೀ ದಿಟ್ಟಲವಮಿರಿಷ-ವಸ್ತು\n15 ಕಾಳಿ ೧ಗುಲಗಿತ್ರಾ--ಕಾರ್ಳಿ ವಾಣತಿದ್ರೂ-ಕಾಶಾಳಿ\n16 ಕಮಶೋಯೋ--ಲ್ದತ್ರಿಣ-ಸ್ವಾಲ್ಯಲಿಖಿಲಿ\n17 ಕೂಳಿಸಾರಿಕೊಡಾ-- ವಳ್ಳಿಲೂಕದೋಕತಿಯೋ\n18 ಕಳ್ಳೆವುಳಿವೋ-ತಾರಿಕಾಲಿರತಿಪ್ರಕಾಡ-ವಾ\n19 ಮುರೇ ವಲಕೊಳೂಕಾಣ್ಕ-ಕೇಣ ಜವತ್ಪಳಿ\n20 ಲ್ ವರುಡು - ಕ್ಯಿಲಿತ್ತಾ ವಿಲ್ಲಿಯಾರೋಕಿಲಿ-ಅರು\n21 ಮುಡ್ಯ ಕವಶೀ ವೋಣ್ಣಿ ಕೊದೋನಜಾ ವತ್ಲ [ನ] ವಡಿ\n22 ಕೂಡ್ಯ ೨೨ ೪ ೬ ೩೨ಗಿನಾಕಾರ್ಡುಕೊಕಣ್ಮ-ಅ\n23 ಕಳ್ಳೆ --ವೆಕಿತೊವೇರೋಲ-ತಾರಾಕಾತ್ರ--ಪಿಲ್ಲೊರ\n24 ಕಿಯಾಂಡ ಗುಣಕಾರ್ಯಕಾಡ--ವಿಡಾ ವಿಶ್ಯಯಾಳ-ಕೊ\n25 ವಿಸ್ತೃ-ವಲ್ ವರಸ್ಯವ್ಯ-ಕಲೋನಾಯವಣಿಯಮಾ\n26 ೬ ಮೇಹನರಾಪ --ಒಂದು ಒಟ್ಟುಲಿವಿರೋತ್ಯಕಕ್ಲಿ\n27 ಲ್ ಕಾಜ-ತಿರಾಣ್ಡೊದೋಣ್ಡು ವಕಿಲ್ಕೋಣ್ಣಳಿಮ\n28 ಟವಪಿಳ್ಳುವುರಾಗಿವರಚ್ | ವಲಹಿಯರಿ | ಏಕಿಸ್ಥ ವ\n29 ಕಾಂಡೆಯೊ ವೆಟ್ಟೆ ರಾವಿಕಾ-ಜೋಳ--ಶೋಮಯ\n30 ಒಕಿಲಿತ್ಲಕ--ವಜೊ್ಜಾರ-ವೋತಕಳಿ ಡೋ-ಪಳ್ಳೆ\n31 ಷವೊಳ್ಳುಂ .. ವಕಂಡ್ರೂ ೪ಯಾರಿ ಎಳತ್ತು ||\n\n78\nಅಂಜನಗಿರಿಯಲ್ಲಿರುವ ಶಿಲಾ ಶಾಸನ\nಪ್ರಮಾಣ 5'5\" x 3'4\".\n1 ಶ್ರೀ ಶೀ ನಾಥಾಯ ನಮಃ || ನಿರ್ವಿಘ್ನಮಸ್ತು || ಶುಭಮಸ್ತು ||\n2 ಶ್ರೀಮತ್ತ್ರಿವರ್ಗಂಗಭಿರಾಶ್ಚದ್ವಾದ್ವಿಪಾವೇದೀಳಾಂ ಚ್ಯನೋ | ಜೀಯಾತ್ಸರ್ವೋದ್ಯೋನಾಥ\n3 ಸ್ಮ್ಯ ಶಾಸನಂ ಜಿನಶಾಸನಂ ॥ ಸ್ವಸ್ತಿ ಶ್ರೀ ಮೂಲಸಂಘ ದೇಶೀಗಣ ಪುಸ್ತಕ ಗ\n4 ಬ್ಬ ಕಂದಕಂದಾನ್ವಯದೆಯೋಂಗುಳೇಶ್ವರಳಯ ಶ್ರೀಮದ್ಭೆವರ್ಗಳ ಪುರವರಾ\n5 ಧೀಶ್ವರ ಸಮ್ಮತ ಜಿನೇಶ್ವರನಾಡ ಪದ್ಮಮತ್ತಮಧುಸಾರಾಯನನರಾದ ತ\n6 ತ್ತಾಲ ಧರ್ಮ ಪ್ರವರ್ತಕರಾದ ಧರ್ಮ್ಮಚಾರ್ಯರ ಬಿರುದಾವಳಿ ಯೊಕೇಂದೋದೆ ।\n7 ಪಂಡಿತ ಪೂಂಡರೀಕ ಕಾಲಮಂ ಪರಿಬೋಧಿಸುಯ್ಯೊರ್ಕೌಮ್ಯದ್ ಬುಂದೆ ಕುವಾವ\n8 ಹೃತ್ಸೆಮ್ಮನೋಡಿಸಿ ಕಾಡೆ ದಿಗಂಬರ ವ್ರ್ತಾಮಂದನ ವೃತ್ತಮೋಳದು ವಾಧೀಶ್ವರ\n9 ೧೯ ಮನ್ವೇಪುವಾತವಗಂಸಿತೆದೇವಸೊಯ್ದನದೇವೊಯವಾಜ್ಞೆಯಿಂನಿರಂತರಂ ॥\n10 ಸ್ವಸ್ತಿ ಶ್ರೀಮದ್ಮುಯದಾರಾಗಾರಮಂಡಲಾಚಾರ್ಯ್ಯ ಮಹಾದೇವಾವಾದೀಶ್ವರ\n11 ರಾಯವಾದಿಮತಮಹದ ಸಕಲ ವಿದ್ಯಜ್ಜನ ಚಕ್ರವರ್ತಿಗಳಾಲಂ ಬಲಣ್ಣರಾಯಜಿನೇಂದ್ರಪೂ\n12 ಳಕಾಧ್ಯಣಳೇ ಜಿರಿದಾರವಲ್ಲಿಯಂಜಿನಾನಂದಮವುಖ್ಯಮೆಮುತ್ಯ ರೊಕ್ಷಿತ್ಸಾ ಪಂಡಿತೇದೇವೊ\n13 ಗಳ ಪ್ರಶೇಕ್ಷರಾದ ತತ್ಸೃಷ್ಟಿ ಶ್ರೀಮದಜಿನನವಾತೇರ ಕೀರ್ತಿ ಸಂಪಾದಿತೇವರುಗಳ ಪ್ರಿಯ\n14 ಶಿಷ್ಯನಾದ ತಸ್ಮಾನ್ಯಸಚಿಷ್ಯ ಶ್ರೀಮತ್ತೆ ಜು ರಕ್ಷಿತ ಪಂಡಿತೇದೇವನಗರದ ಸೆಳೆತ್ತರಾದ ಶ್ರೀ\n15 ಮುತ್ತ್ಯಾಂಕಿತೃತ್ವದೇವಳರಯ ಕಳವದ || ೧೮೬೬ ಸಿಂದ ವತ್ಮನ್ಯವಾನ ಕೋಘಣಸೇವತ್ಸ\n16 ರದ ಕಾರ್ತಿಕ ಶುದ್ಧ ೧೫ ಲಕುಬರೆದೆ ಕೀಲಕಾಸವಿದ್ಧ ಕ್ರುಮವಿಂದೆಂದೆ ತವದು ಗುರು\n17 ಶ್ರೀಮದ್ಮಧುಸನಾತೇರ ಕಳಿಸುಪಂಡಿತೇದೇವರುಗಳಂ | ಕಳಿಕಾಲಧನ್ಯತೀರ್ಥನ್\n18 ಪುವತ್ವನ್ ನಿನತೆವ್ಯಾನಿ ಸುವತಾ್ತ ಕತಿವಿನೆಯಿಂದ ಸ್ವಯಂಪ್ರತ್ಯಫ್ಸಾರ ಶಾಂತಿ ತೀ\n19 ತೃತ್ಕರ್ಮನು ಅನಂತವಾಘಸ್ವಾಮಿಯುವ ಕಕವರುಚ ಗಳಿಷಿ ನಯ ವಿಶ್ವತು ಸಂವತ್ಸ\n20 ರದೆ ಹೈತ್ರದೆಯ ಬಿಜೇಮದೆಲಾಗಿ ಅಂಜಿನಗಿರಿಯ ಅಗ್ನಿನವಾಸೆಯಾಗಿದ್ದೆ\n21 ಕಾವಿನಾಪುಠಾನ್ಯಾಮಿಯ ಬಸದಿಗೆ ಬಿಜಿಮಾಪಿಸಿ ಗಿರಿಯಗ್ಯದಲ್ವಿ, ದಾರುಮಯದೆ ಬ ·\n22 ಸವಿಯನವಡಿಸಿ ಏರ ಸಂವತ್ಸರದೆ ದ್ಯೆತ್ತನಮಾದಲ್ಲಿ ಸಕ್ಕನಸಾಗಾರ ಕೌಣಾಸನಗರದ\n23 ಕಾಸೋಣಸಾಧ್ಯಾಲಯರ ಕಮ್ಮುಂಡ ಪ್ರತಿಷ್ಟ್ಯಮಾದಿಸಿ ಶೀಳಮಾಯವಾದ ಬಸೆ\n24 ದಿಯಮಾದಿನೆನ್ನು ಬಸ್ಸೆಗತಿಹಲಗಿ ಅಲ್ಲಿಂದ ಮುಂದೆ ಕೊಳ್ಳಿ ಸಂವತ್ಸರದ ಕಾ\n25 ತೀಕ ಶು ೧೯ ರಲೆಗೆ ಕಲು ಗೆಲಸಹಾಲಧಾರಗಳಳ ನಡೆಸಿದ ವಿಚೆರ ಸಂಜರಾಯ\n26 ಪೆಟ್ಟಣಕ್ಕೆ ಸಲವ ಬೊಮುತ್ತಿ ಬೂವನಹಲಮುಗನಕಡಿಯಸುಮ[ಸ್ಟ್ರ]ಹಲರಿಂ ಕಲಂಗೆ\n27 ಲಸಕ್ಕೆ ಸೆಂದೆ ಹೊಂನ್ನು ಗೆ ೧೦೦ ಹೆನಸುಗೆಯ ಅದಿಮ್ಯ ಅಪ್ಪಗಳರು ಅಮೆವನ್ ಹೆನಸೆ\n28 ಳಿಯ ಭೂಮಿದುತಿ ಸ್ಬೀಷಮೆಗಳಂದ ಗಬ್ಭಗ್ಗಳ್ಹವಗ್ಗಂವೆಲ್ಲಿ ಕಲಂಗಲ ರಕ್ಕ್ಯ ಸಂದದು ಗೆ ೨೦ ಹೊಂನು\n29 ತೆಂಗೆಉರು ಶ್ರೀಮಟ್ಟಾ ರಕ್ಷಕ್ತಿ ಪಂಡಿತ ದೇವ್ರುಗಳಿಗೆ ತಹವ್ರುಂದಕ್ಕೆ ಮೂಲಾ\n30 ಹಾಲದಾರದೆ ವೃದ್ಧ್ವಭಾಂಗಳ ದೆಮೊಂದಕ್ಕೆ ನೈವೇದ್ಯಕ್ಕೆ ಕೆಲೊಂದದು ಗೆ ೧೦ ಆಹಾರದಾರಾ\n31 ನಕ್ಕೆ ಕೇಶಿಸೆಂದುಗೆ ೫೦ | ಕುಭುಕ್ಚುತು ಸಂವತ್ಸರದ ಫಾಲ್ಕುನ ಶು ೧೫ ಲಂ ಅಂಜಿನೆ\n32 ಗಿರಿಯ ಶಾಂತ್ವಿಗಳಿಗೆ ಬಿಡಿಗೆ ಸೀತಾಳಮಳಗೆಯ ಸಮೆಸ್ಮ ಹಲರು ಕಾಂಡಿಸಿ\n33 ಗಹೇಲರು ನಾನಾದೆಷುಯ ಹಲರು ಮಾಡಿದ ಧಮ್ಮ್ಯಂ | ನಾಳು ಜೆಟ್ಟಿದ ಕಾಲು ನಡೆ\n34 ಪೋವದಕ್ಕೆ ಗೆ ೧೦ ವನು ಆಹಾರದಾನಾಕ್ಕೆ ಕೊಡುವೆಲು ಯಂದು ಬರೆದಿದ ಈ\n35 ಧರ್ಮ್ಮಶಾಸನ ಯೆ ಧಮಾರ್ಕಗೆ ತಪ್ಪಿದವರು ಗೋಬ್ರಾಹ್ಮರಕ ಕೊಂದ ದೋಷಕ್ಕೆ ಹೋವ\n36 ರು || (ಯದೇವಾರ್ಕೃಪ್)\n37 ಶಕ ವರುಷ\n38 ೧೮೬೬ ನೆ\n39 ಯೆ ಶುಭಕ್ರುತು\n40 ಸಂವತ್ಸರದೆ\n\n79\n41 ಜೈತ್ರ ಶುದ್ಧ ೧೩\n42 ಬುಧವಾರ ನ್ಯ\n43 ಶ್ರವಣ್ಥ್ಯ ದಲ್ಲಿ\n44 ಮೊಟು ಕೆಂಡ\n45 ದಹರಾಂಗಲು\n46 ಕುಲ ಪುತಿಷೆ\n47 ಯಾಮಿತೃ ॥\n48 ದಾಸಹಾರಿಗೆ\n49 ಹಲ್ಲಿನೆಯೂಲ\n50 ಗದ್ಯಯ ಕ್ರಯಂದೆ\n51 ಮಘಲ್ಯ ಗ ೩೦\n52 ಕೆಲಳಯರು ದೋ\n53 ಸನೆಗೆ ಗ್ಯದದ\n54 ಕೈ ಕೊಟ್ಟಮ ಗಂ\n55 ಉಭಯಂ ವಸ್ಥೆ\n56 ಗ ೧೦ ಕೆ ಅದಾ\n57 ಯ ಶ್ರೀಮತ್ಸಾ\n58 ರುಕೀತಿ್ತಪಂಡಿತ\n59 ದೇವೂರಲ್ ಶಿಷ್ಯ\n60 ರು ಗನಸೋಗೆಯಲ\n61 ದಿ ಪ್ರಿಯೆ ಅಮ್ವೆಗರೆಗೆ\n62 ಬೂಜಬಲಿ ಶ್ರೇ\n63 ಆಸ್ತಂಗಳಿ ಗ ೫೪\n64 ಬಿಸವೆಟ್ಟ ದ ಅನ\n65 ಚಮತಿ ಅನನರಲು\n66 ನೇ [೨೩] ಶ್ರೀ ಅಮ್ಮೆಗಳಂ ಸೆ\n67 ಇಂದು ಗೆ ೨೪ ಮು\n68 ದಿ ಸೆಟ್ಟಿ ಯವಜಿ\n69 ಯ ಶ್ರೀ ಅಮ್ಮೆಗಳ\n70 ೮೦ದದು ಗೆ ೧೦\n71 ಮುಲುಗನಹಳಿಯ\n72 ಅಧ್ಯಕ್ಷ್ಮಗಳಂಸೆಂ\n73 ಗೆ ೧೦ ಹಾರುವೆ\n74 ಸೆಟ್ಟಿಯ ವಿಜೆಯ\n75 ೧೩ ಸೆಟ್ಟಿಯಂ ಗೆ ೨೩\n76 ಕಂಣಸೂರ ದೇವರೆಂ\n77 ಮೇ ಸೆಟ್ಟಿಯಯಿಂದ ಗೆ ೧೦\n78 ಆಸೊಂದಿಯ ಅರಸೆ - -\n(ಬಲ ಪಾರ್ಶ್ವದ)\n79-106\nಧರ್ಮ ಕೀ;್ತಶಗಳು\n107 ತೇ ವನಾಡಿದ ಧ\n108 ಮ್ಮಗಳು ಆಜ್\n109 ಂವ್ಯಾಕ್ಯ್ ಸನ್ನಾ\n110 ಯಿಯಾಗಿ ನಡೆ\n111 ಯಲಿ ಯೆಂದು\n112 ಬರೆಸಿದ ಧಮ್ಮ್ಯ\n113 ಶಾಸನಕ್ಕೆ ಮಂ\n114 ಗಳಲ ಮಹಾ\n115 ಶ್ರೀ ಶ್ರೀೇ", "roman_pages": [61, 62], "original_pages": [119, 121], "translation_pages": [null, null]}, {"id": "epca|I|10", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 10, "find_spot": "On a stone at Añjanagiri.", "date": "", "translation": "", "text_roman": "śrī-Sāntināthāya namaḥ || nirvvighnam astu || śubham astu ||\nśrīmat-parama-gaubhīra-syād-vād-amōgha-lāñchchhanam ||\njīyāt trailōkya-nāthasya śāsanamli Jina-śāsanam ||\nsvasti śrī-Mūla-sangha Dēśī-gaṇa Pustaka-gachchha Kuṇḍakuindānuvayada Yuṁgulēsvara.\nvaliya śrimad-Belugula-puravar-ādhīśvara Guhmaţa-Jinēśvaru-pāda-padma-matta-madhu-\nkarayamānar-āda tat-kāla-dharma-pravarttakar-ādu Dharmmachāryyara birudavali yeiht\nemdode || pamdita-pundarika-kulamam paribōdhisiy urvivi-komrma-uddamda-kuvādi-hrit-\ntamaman-ōdisi kude Digainbara-prabhā-maimdana- vrttamam taledu Bhavya-rathāngaman-\nörut-āvagam Pamdita-dēva-sūryyan esedaṁ naya-våg-ruchiyim niramtaram|| svasti srimad-\nrāya-rājaguru-mamdal-āchāryya mahā-vāda-vādiśvara rāyavādi-pitāmaha sakala-vidvaj-\njana-chakravarttigalutm Bāllāļa-Rāya-jiva-rakshapālakādy-anēka-birudāvali-virājamānarum-\nappa śrimach-Chārukirtti-Paindita-dēvarugala praśishyar-āda tach-chhhishya śrimad-Abhinava-\nChārukirtti-Pamdita-dēvarugala priya-śishyar-āda tasy-āgraja-śishya śrimach-Chārukirtti-\nPamdita-dēvarugala sa-tirthhyar-ūda śrimach-Chhūmahātikirti-dēvaru [ga]lu Saka-varsha || 1466\nsanda varttamāna Krōdhi-samvatsarada Kārtika-śudha 15 lū barasida śilā-śāsanada kramav-\nemt-emdoode tamma guru srimad-Abhinava-Chārukirtti-Pamdita-dēvarugalu | Kali-kāla-\ndharmma-tirttha-pravarttana-nimittavāgi Suvarnnāvati-nadiyinda svayam-pratyaksharāgi\nSānti-tirthhēsvaranu Anananātha-svāmiyu Śaka-varsha 1453 neya Vikritu-saṁvatsarada\nChaitradalu bije-mādalagi Aṁjanagiriya-agra-nivāsiyāg-irdda Sāntināthā-svāmiya basadige\nbijemadisi giriy-agradalli dārumayada-basadiya mādisi Khara-saṁvatsarada Chaitra-māsadalli\nsvānujar-āda Konasanagarada Śāntōpādhyāyara kayyinda pratishțey-a mādisi śilā-mayavāda\nbasadiya mādisis-emdu buddhi gatisalāgi allinda munde Krōdhi-samvatsarada Kārtika-śu\n15 nelege kalu-gelasa hālādēregala nadasida vivara Namjarāyapattanakke saluva Bemmatti\nBūtanhali-Malaganakereya samasta-halarim kalu-gelasakan-da sahida homnnu ga 200 Hanasogeya\nĀdi-Śri-Avvagalu Ainnama-Hosahalliya Bhujabali-Śrī-Avvagalinda garbha-grihavagaivalli\nkalu-gelasakke sandadu ga 30 homnnu tarhma guru śrimach-Chārukirtti-Pamdita-dēvarugalige\ntāv ittaidakke mūru hälädēre madhya-bāgilali vomdu-hottina naiivedyakke sela samdudu\nga 50 āhāra-dānakke sela sandadu ga [50] | Subhakrutu-samvatsarada Pālguna śu 15 lū\nAṁjanagiriya Śāntisēvarage bidire sitaliya-maligeya samasta-halaru Kannadiga-halaru Nānādēsi\nya-halaru mādida dharmma[n]jau kattida kālu-nade vondukkake ga 0-1 vanu āhāra-dānakke\nkomda dōshakke hōvaru[(1)] (leyt side) śaka varusham 1466 neya Subhakrutu-samvatsarada\n\nChaitra śuddha 13 Budhavāra Vṛishabha-laghnadalli muru tamda dehāragalu kula-pratishṭe\nyāyittu || dānaśālege haḷḷi vayula gaddeya krayada mauliya ga 70 koḷayaru hosa gadde gaiduda\nkke koṭṭadu ga 50, ubbayam vechcha ga 120 kke ãḍāya śrīmach-Chārukirtti-Paṇḍita-dēvaru\ngaḷa śishyaru Hanasogeya Ādi-Śrī-Avvagaḷu Bhujabali-Śrī-Avvagalim ga 24 Basavapa\n[tna]da Anaīntamati-Avvagaḷu Nēmi-Śrī-Avvagalim samdadu ga 24 Muddi-sattiya Vijay[a]-\nŚrī-Avvagalim sumdadu ga 10 Maluganahaḷiya Ādyakkagaliim sam ga 12 Hāruva-saṭṭiya\nVijaya-ṇa-śuṭṭirim ga 30 Kaiṇpanūra Dēvarahma-saṭṭiyarim ga 12 [A]suh[di]ya A[ra] sa\n. . . (rest buried underground): (right side) [l. 79 to 107 contain the three\nusual imprecatory verses beginning with svadattām paradattām, dānāpalanayōr and svadallād-\ndvigunam]. I mādida dharmamaii āchamdrārkka-sthāyīyēli naḍeyali yeṁdu barasida dharmma-\nśāsanakke maṁgala-mahā śrī śrī.", "text_original": "[Kannada original]\n[English translation, Gemini-rendered, verify]", "roman_pages": [62, 65], "original_pages": [115, 115], "translation_pages": [null, null]}, {"id": "epca|I|11", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 11, "find_spot": "On a copper plate at Kaṭṭepura.", "date": "Date 1693 A.D.", "translation": "Be it prosperous.\nAdored be Śambhu, beauteous with the *chāmara*-like crescent moon kissing his lofty\nhead; the original foundation-pillar of the city of the three worlds.\nI praise the right tusk of the sportive Boar,—may it protect us,—on which the Earth,\nuplifted by it, was like a spot.\nBe it well. In the year 1615 of the victorious increasing Śālivāhana era, the year\nnamed Śrīmukha, the 12th of the bright fortnight of Pushya, Krishnappa-Nāyaka, the son of\nVēnkaṭādri-Nāyaka and grandson of Krishnappa-Nāyaka of Bēlūr, of the Kāśyapa-*gōtra* and\nĀpastamba-*sūtra*, caused to be written and given to Yōgapaiya, the son of Puṭṭarasaiya and\ngrandson of Subrahmanya-dēva, of the Vasiṣṭha-*gōtra*, Āsvalāyana-*sūtra*, and Rik-*śākha*,\na deed of gift of a village as follows:—Within the Bēlūr country, which formerly the\nrājādhirāja rāja-paramēśvara-śrī-vira-pratāpa śrī-vira-Kriṣhṇa-Rāya-Dēva-mahārāya bestowed\non our great-great-grandfather, a Gōvinda to the ocean, perfumed with camphor, in war a\nBhīma, boon lord of Manināgapura, obtainer of a powerful kingdom, Yara-Krishnappa-\nNāyakaraiya—in the Nirugunda-stala of Tungi-nād in Arakalgūd, the village of Kaṭṭepura—\nsituated east of Koniganahalli, west of the land to the south of the Hēmāvatī river, and north\nof Niluvāgilu,—together with Hirumanahaḷḷi,—to the east of Ippugaḷale.\n\nWe, Krishnappa-Nāyaka (descent, as above, repeated) to Yōgapaiya (descent, as above,\nrepeated) having given the village of Kaṭṭepura, together with Hirumanahaḷḷi, in the said\ntithi, at the auspicious time of the Makara-*saṅkramaṇa*, with presentation of a coin and pouring\nof water, that, acquiring the eight rights of full possession belonging to this village, namely,\npresent profit, future profit, hidden treasure, underground stores, springs, minerals, actualities\nand possibilities, you, your offspring and descendants, as long as sun and moon endure, with\npower of gift, exchange or sale, may continue to enjoy them in comfort, Krishnappa-Nāyaka,\nthe son of Vēnkaṭādri-Nāyaka and grandson of Krishnappa-Nāyaka, of the Kāśyapa-*gōtra*\nand Āpastamba-*sūtra*, to Yōgapaiya, the son of Puṭṭarasaiya and grandson of Subrahmanya-\ndēva, of the Vasiṣṭha-*gōtra*, Āsvalāyana-*sūtra* and Rik-*śākha*, have caused this deed to be\nwritten and given.\n\nThe just witnesses to this:—Sun and moon, wind and fire, sky, earth and water, heart\nand mind, day and night, morning and evening,—these know the deeds of a righteous man.\nOf giving or protecting a gift, than giving, protecting a gift is better; by giving, svarga\nis obtained; by protecting a gift, the eternal state. Than giving oneself, to protect another's\ngift is twice as meritorious; by taking away another's gift one's own gift becomes fruitless.\nLand given by oneself is a daughter, that given by one's father is a sister, that given by\nanother is a mother; therefore land given must not be abandoned. An only sister to all\nkings in the world, neither to be enjoyed nor taken in marriage, is land given to a\nBrāhman.\n(Signed) Śrī-Kriṣhṇa.", "text_roman": "śubham astu. ||\nnamas tuṅga-śiraś-chumbi-chandra-c -sākshigaḷu\n   āditya-chandrāv anilō nanalā cha dyaur bhūmir āpō hṛidayam manaś cha |\n   ahaś cha rātriś cha vubhe cha sandhyē dharmasya jānāti narasya vṛittam ||\n5-A\n\ndāna-pālanayor madhyē dānātr śrēyō'nupālanaṁ |\ndānāt-svargam avāpnōti pālanād achyutam padam ||\nsvadattā dviguṇaṁ puṇyaṁ paradattānupālanaṁ |\nparadattāpahārēṇa svadattam niṣphalam bhavēt ||\nsvadattā putrikā dhātrī pitri-dattā sahōdarī |\nanya-dattā sva-mātā cha datta bhūmim parityajēt ||\nyēkaiva bhaginī lōkē sarvēṣhām ēva bhubhujām |\nna bhōjyā na karagrāhyā vipradattā vasundharā ||\nśrī-Kṛiṣhṇa.", "text_original": "ಕತ್ತೆಪುರದಲ್ಲಿರುವ ತಾಮ್ರ ಶಾಸನ\nಕಭಮಸ್ತು ॥ ನಮಸ್ತುಂಗಿರೇತ್ಸಂಗಿ ಚಂದ್ರಚಾಮರಚಾರವೇ ತ್ರೈ ಲೋಕ್ಯನಗರಾರಂಭೇಮಲಸೇಗ್ಲಭಾಮು\nಕಂಛವೇ ॥ ವಂದ್ಯಲೀಲಮಾರಾಹಸ್ಯೆ ದಂಷ್ಟ್ವಾ ದಂಡ್ಯಪೊತಾತು ನಃ ಉದ್ಯೂತಾ ಮೆದಿನೀ ಯೇನ ಕಲಾಕಮಿವಯತ್ರನಾ ॥\nಸ್ವಸ್ತಿ ಶ್ರೀ ವಿಜಯಾಭ್ಯುದಯಶಾಲಿವಾಹನಶಕಾವರುಷಗಳು ೧೬೧೯ ನೇಯ ಶ್ರೀಮುಖನಾಮ ಸಂವತ್ಸರದ ಪುಷ್ಯ ಕು\n೨೧ಲು ಕಾಶ್ಯ್ಪಗೊತ್ರದ ಅಪಸ್ತಂಭ ಸೂತ್ರದ ಬೆಲೂರಕೃಷ್ಣಪ್ಪಣಾಯಕ ರ ಪೌತ್ರರಾದ ವೆಂಕುದಿನಾಯಕ ರ\nಪುತ್ರರಾದ ಕೃಷ್ಣಪ್ಪಣಾಯಕ ರ ವಶಿಷ್ಟಗೊತ್ರದ ಆಕ್ಷಾಯಣ ಸೂತ್ರದ ಮುಕ್ತಾಬಾಧ್ಯಾಯರಾದ ಸುಬ್ರಹ್ಮಣ್ಯ\nದೇವಗರ ಪೌತ್ರರಾದ ಪುಟ್ಟರೈಯನ ಪುತ್ರರಾದ ಯೋಗಸ್ನೇಯಿಗೆ ಬರಿಸಿ ಕೊಟ್ಟ ಗ್ರಾಮವಿನಾಸಾಸನ ಕ್ರಮವೆಂತೆಂದರೆ\nಪೂರ್ವದಿನ್ರ ಶ್ರೀಮದಾರಾಜರಾಜರಾಜಮೆಂಪರೆ ಶ್ರೀ ವೀರಪ್ರತಾಪ ಶ್ರೀವೀರರಾಜ್ಯ ರಾಮ್ಯದೇವರ ಮಹಾರಾಯರೆವರು\nನಮ್ಮ ವೃದ್ಧಿಪಾಂತಮಹಾರಾದ ಸಿನ್ನು ಗೋದಿನ ಬೊಮಕರಗದ್ನ ನವೇಲಾಂಶಭಿನವಮನೆಂಗಪುರವರಾಧೀಶ್ವರ ಬಲೀಯದದೆ\nಸೂಕ್ಷ್ಯತಹರಣಾರದ ಯರಕಪ್ಪನೈಣಾಯಕಯೆರಯನೆವರಿಗೆ ಪಾಲಿಸೈ ಬೆಲೌರಣೆಖೆಮಿಗೆ ಸಲುವೆ ಅರಕಲೆಣ್ದದೆಯಲಿ ತೆ\nದೆ ತೊಂಗನಾಡ ನೇರುಗೊಂದ ಲಲಿ ಕೆರೆಣಗನಹಳ್ಳಿಗೆ ಪೂರ್ವ ಹೇಮಾಬತಿ ನವೆದಿನೆ ದಕ್ಷಿಣದ ಜಮೀನಿಗೆ ಪಶ್ಚಿಮ ನಿಲು\nವಾನಿಗೆ ಪುತ್ರ ರಾವದೆ ಕತ್ತಿಪುರದೆಗ್ರಾಮ ಯುಷ್ಯಗಳಲಿಗೆ ಪೂರ್ವವಾದ ಹಿರುಮನೆಯಲ್ಲ ಸೆವಾ ಕಾಶ್ಯ್ಪಗೋತ್ರದ\nಅಪಸ್ತಂಭಸೂತ್ರದ ಕೃಷ್ಣಪ್ಪಣಾಯಕ ರ ಪೌತ್ರರಾದ ವೆಂಕುದಿನಾಯಕ ರ ಪುತ್ರರಾದ ಕೃಷ್ಣಪ್ಪಣಾಯಕ ರ ವಸಿ\nಷ್ಠಗೊತ್ರದ ಆಗ್ನಾ ಯಣ ಸೂತ್ರದ ಮುಕ್ತಾಬಾಧ್ಯಾಯರಾದ ಸುಬ್ರಹ್ಮಣ್ಯದೇವರೆಂಗೆ ಪೌತ್ರರಾದ ಪುಟ್ಟರೈಯನ\nಪುತ್ರರಾದ ಯೋಗಸ್ನೇಯಿಗೆ ಕೊಟ್ಟಪ್ರದೋಗ್ರಾಮ ಹಿರುಮನೆಯಲ್ಲ ಸಹ ಯಾತ್ರಾತೀಧಿ ಮಕರ ಸಂಕ್ರಮಣ ಪುಣ್ಯಕಾಲ\nತೆತ್ರೆರಾದ ಯೋಗಸ್ನೇಯಿಗೆ ಕೊಟ್ಟಪ್ರದೋಗ್ರಾಮ ಹಿರುಮನೆಯಲ್ಲ ಸಹ ಯಾತ್ರಾತೀಥಿ ಮಕರ ಸಂಕ್ರಮಣ ಪುಣ್ಯಕಾಲ\nತೆತ್ರೆರಾದ ಯೋಗಸ್ನೇಯಿಗೆ ಕೊಟ್ಟಪ್ರದೋಗ್ರಾಮ ಹಿರುಮನೆಯಲ್ಲ ಸಹ ಯಾತ್ರಾತೀಥಿ ಮಕರ ಸಂಕ್ರಮಣ ಪುಣ್ಯಕಾಲ\nತೆತ್ರರಾದ ಯೋಗಸ್ನೇಯಿಗೆ ಕೊಟ್ಟಪ್ರದೋಗ್
