ಕಾಣುವುದು)\n[English translation, Gemini-rendered, verify]\n13 ............yamu\n14 śaṁ...panida...mauḷa.........\n15 ...sunni r̐ pravāḷabhūta...barasida kāruṇeyū\n16 deva .....navajinakāya\n17 vaddige...teḷḷanebalyagiyombati resa....\n18 ......tadinavijeḷoḷ * khaṁ\n19 .. prathuvikoṅgālavanarasi...\n(This much is seen upon this stone)\n\n91", "roman_pages": [76, 76], "original_pages": [132, 133], "translation_pages": [108, 108]}, {"id": "epca|I|37", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 37, "find_spot": "*On the north wall of the same Pārśvanātha basti.*", "date": "", "translation": "*Date about 1050 A.D.*\n\nBe it well. Śrī-Rājādhirāja-Koṅgālva's mother Pōchabbarasi, lay disciple of Guṇasēna-\npaṇḍita-dēva of the Draviḷa-gaṇa, Nandi-saṅgha and Arungal-ānvaya, had this basadi made.\nGreat good fortune.", "text_roman": "svasti śrī-Rājādhirāja-Kōṁgāḷvan abbe Pōchabbarasiyar Dravila-gaṇada Nandi-sanghad\nArungal-ānvayada Guṇasēna-paṇdita-dēvara guḍḍi mādisida basada maṅgala mahā.", "text_original": "ಅದೇವ ಬಸ್ತಿಯಲ್ಲಿ, ಪಾರ್ಶ್ವನಾಥ ಬಸ್ತಿಯ ಉತ್ತರ ಗೋಡೆಯ ಮೇಲೆ\n\n1 ಸ್ವಸ್ತಿ ಶ್ರೀರಾಜಾಧಿರಾಜ ಕೋಂಗಾಳ್ವನೃಪತಿ, ಸ್ಸೊಬ್ಬಟರಸಿಯದರ್ಶವೀರ್ಜಜನದ್ಘಿ ಸಂಘದರು\n2 ಬ್ರ ಲಾಖ್ಯಮುದ ಗುಣಸಂಪನ್ನಂತ್ತೆ ದೆವೆರಗುಶಿಜ್ಞೆ ಮಾಡಿದಪೇಪಡಿ ಮಂಗಳ ಮಹಾ", "roman_pages": [76, 76], "original_pages": [133, 133], "translation_pages": [108, 108]}, {"id": "epca|I|38", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 38, "find_spot": "*On the basement of the same basti.*", "date": "", "translation": "*Date about 1050 A.D.*\n\nBe it well. Śrī-Rājēndra-Chōḷa-Koṅgālva's son Rājādhirāja]-Koṅgālva gave, with\npouring of water, . . . . as a dwelling place to his guru Guṇasēna-\npaṇḍita-dēva, of the Tivuḷa-gaṇa, Arungal-ānvaya and Nandi-saṅgha. Great good fortune.\nŚrī. Śrī.", "text_roman": "svasti śrī-Rājēndra-Chōla-Kōṁgāḷvana putra śrī-Rā[j]ādhirāja]-Kōṁgāḷva . . . . .\nvāsa-sthānamam tamma gurugaḷ Tivula-gaṇad Arungal-ānvayada Nandi-saṁghada Guṇasēna-\npaṇdita-dēvargge dhārā-pūrvvakaṁ koṭṭam maṅgala mahā śrī śrī.", "text_original": "ಅದೇವ ಬಸ್ತಿಯ ತಳಪಾವೇ ಕಲ್ಲು,\n\n1 ಸ್ವಸ್ತಿ ಶ್ರೀರಾಜೇಂದ್ರಚೋಳಾಳಕೋಂಗಾಳ್ವನ\nಪುತ್ರ\n2 ಶ್ರೀರಾ[ಜಾಧಿರಾಜ]...ಕೋಂಗಾಳ್ವ...\n3 ...ವಾಸಿಪದ್ಮಾನವಂತಮ್ಮಗರುಗ\n4 ಲೃವೃತಿಗಣದರುಂಗಲಾನ್ನಯದನ್ನಿದಿ\n5 ಸಂಬಂದಿಗಣೇಸನಸತ್ತ್ವತೇವಮ್ಮೆಗದ್ಧಾ\n6 ರಾಜೊಣ್ಯಾರ್ಚಕೋ ಕೊಟ್ಟಂ ಮಂಗಳಮ\n7 ಹಾ ಶ್ರೀ ಶ್ರೀ", "roman_pages": [76, 76], "original_pages": [129, 133], "translation_pages": [108, 108]}, {"id": "epca|I|39", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 39, "find_spot": "*On a stone near the Chandranātha basti in the same basti.*", "date": "", "translation": "*Date 1390 A.D.*\n\nBe it well. Fortune. In the 1813th Śaka year, the year Pra[mō]dūta, on the 3rd of the\nbright fortnight of Vaiśākha, Sunday,—of the śrī-Mūla-saṅgha, Dēsi-gaṇa, Pustaka-gachchha\nand Koṇḍakuṇḍānvaya, the Āryya Śubhēndu's offspring Vijayakītti-dēva's beloved disciple\nBāhubali-dēva having obtained this temple, restored it:\n\nŚrī-Rājā[dhīrāja], through Koṅgālva-Rugmiṇī-Dēvī's queen's bodyguard Vijaya-dēva,\nthat it might stand fast in order that merit might be to his mother . . . son, that Pōchab-\nbarasi had set up, and granted for it the village of Nulabihalli in Anilavādi (and other lands,\nwhose boundaries are given in detail, much effaced), with oil from one oil mill, to continue as\nlong as moon and sun. . . .\n\n(And) the joy of all people, reading the record of the dedication, with the view of con-\ntinuing it, the king Vīra-Harihara, who had been in many fights,—to the guardian of those\nwho come into the king's shelter, a cage of adamant to refugees, servant of the bearer of the\nbottom.\n\n67\nconch, discous and ? club, Gonkā-Raḍḍi-nāyaka,—whom Guṇdappa-daṇṇāyaka had noticed (for\nhis bravery)—gave Muḷḷu-nāḍ of his own favour.—(And) Siddha-gauḍa assembled the\nsubjects, and giving to Aṇṇādēvi's Kumāranahalli the name of Bhīmāpura, set up stones at\nthe four boundaries, and presented it, with pouring of water, And giving to Kāragoḍ the\nname An[na]gapura, presented it, with pouring of water, to Pārēvanātha, Also lands\n(specified) for gifts, grazing, etc. Arjuna wrote the śāsana. Imprecations.\n\nFootnote\n1. The writer's name usually comes at the end, but was put at the top perhaps for want of space at the", "text_roman": "svasti śrī Śaka-varsha 1313 neya Pra[m]dōta-saṁvatsarada Vaiśākha-su 3 Bhāna-\nvāradallu śrī-Mūla-samgha Dēsi-gaṇa Pustaka-gachchada . . . Koṇdakuṁd-ānvayar", "text_original": "ಅದೇವ ಬಸ್ತಿಯಲ್ಲಿ, ಚಂದ್ರನಾಥ ಬಸ್ತಿಯಬಳ್ಳಿ ಯಿರುವೆುದು\n\n1 ಸ್ವಸ್ತಿ, ಶ್ರೀಶಕವರ್ಷೆ೧ ೧೨ಸಿರಿ ರೊಯೆsus [ನೊಲ್ಲ] ದೋತ್ತ ಸಂವತ್ಸರದ ವೈಶಾಖ ಸು ೩ ಭಾನುವಾ\n2 ರದಲ್ಲು, ಶ್ರೀ ಮೂಲಸಂಘದ್ರೆ ಸಿಗಗಪುಸಂಘಕಚ್ಛೆದ... ಕೊಂದೆಕುಂಡದಾ\n3 ನ್ಯೊಯಾರ್ಯ್ಯು* ಶುಭೇಸ್ತು ಕಂದೆ ವಿಜಯಶಕ್ತಿ ದೇವನರೈಯ,ಶೇಷೆ ದ್ರವ್ಯಪಾಸುಬ\n4 ಲಿದೆವರು ಈ ಸ್ಥಾನಮುನವೆಟುದ್ದನ್ಸಿದವರು ಶ್ರೀರಾಜಾ[ಧಿರಾಜನು] ಕೋಂಗಾಳ್ವರುಂಗಿ\n5 ಣದೇವಿಯ ದೇವಿಯ ದೇಶಕರದ ವಿಷಯ ದೇವದತ್ತರೊರಾ ನೆಲೆನಿಂದುಮೆ ಸ್ಸೊಜನಿ...ತಪ್ಪಿ\n6 ತ್ರೆ...ಅಪೂಚೆಬ್ಬರೊಗೆ ಪುಣ್ಯಾಕ್ಷ್ಯಸವಾಗಿ ಪ್ರತಿಷ್ಠ್ಯಯಾಮಧ್ಯೆ ಅಜ್ಞಾ ಗಣ್ಯ ಭೋಗೇ\n7 ಬಟ್ಟ್ಟ ಊರು ಆನೆಲವಾವಿಮು ನುಲಬಿಳ್ಳೆಯಮೂ ನಾಯದೊಡತಿಣಸಳ್ಳೆಯಮು\n8 ಲಣ್ಣಾರಹಾರುವರಳ್ಳ ಪಿ ಸೀಮೆ ಮುಡಹಿನೊಬೆಳ್ಳ್ಯಳೆಕ...\n9 ಬಡಗಣ ಆಗಳ ನೆಟ್ಟ, ಕಲ್ಲ್ಯಸದೆವ ಬಟ್ಟೆ ಬಡಗೆಣ ಅ... ಕಾರೆಗೋದೆದೆ\n10 ಲ್ಲ್ಯಯುಸ್ಸಿಮೆ ಮೂಡನಿಲ್ಲ್ಯಯು ಹೋಷೆನಟ್ಟ ಕಲ್ಲು, ಕೆಂಚೆಟ್ಟ್ಯದೆ.....\n11 ಬಡಗಣಕಜೆ ಪರಿ ಈಶಾನ್ಯನ್ನಟ್ಟ ಕಲ್ಲು,ಮೊಳನ್ನೇರೆ ಗದ್ದೆ ಗಳಗಳವ್ಯಾನಿ ಬ ೧\n12 ...ಗತೆಯ ಕೆಳಗೆ ಖ ೧ ಅಗದೆಳಸು - - ಕೊ ೧೦ ಕನ್ಗೋಡಲ - - ಕೊ ೧೦ - -\n13 ಗಾಲುಂ ೧ ಕೊಡಗೆೋತಲು ಕೊ ೧ ಅಜ್ಜ ಗದ್ದೆ ಕೊ ೧೦ ಲೋಗೇಗದ್ದೆ ಕೊ ೧೦ ...\n14 ರ್ಜ ಸೊಂಗೆಗೆ ಗದ್ದೆ ಖ ೧ ಬೋಷೇಳಗದ್ದೆ ಖ ೧ ಕೊ ೯ ಅಲಡಕಾಡಿ ಖ ೧ ಕೊ ೧೦ ಅಸರವೆ\n15 ಕ್ಕೆ ಬ ೧ ಕೊ ... ವಿಸಿಕನಿ ಬ ೧ ನಿದೆಚೆ ಗೋಡಲು ಖ ೨ ಮೈಣಸದೆಯ್ಲಿ ಬ ೧ ಕೊ ೧೦\n16 ಹೋಷೆ ದೇವಿಯ ಸರಣ ಗೋಡಲು ಖ ೧ ಹೆಣ್ಣಾರ ಭೂಮಿ ಖ ೧ ಒಂದು ಗಾಣದ\n17 ಣ್ಣೆ ಬಟ್ಟ್ಟು ಆಚಾನಾ[ಕ್ಕ್ಯಸ ಸರ್ವ್ವಾಜನನಂದರ್ ದೀಸ್ಥೆತೆಯಷ್ಟು ಓದಿ ನವತಿ ಸೆಯೊಗೇವಿ\n18 ರಹರಿಹರೇ**ನ್ಮಿ೧ಕ ಫಲವರೇಕಾಡಿ ರಾಯಉಚೆವೈತ್ಯ್ಕರಾವ ಶರಣಾಗತವಸಿಜಂಜಿ\n19 ರ ಕಂಬುಚಕ್ಕ ಗೇದಾರಭ್ಭ ತೈ್ಯ ಗೋಂಕಾಳಣ್ಣಿ ನಾಮ್ಯುಗೆ ಗೊಂದಷ್ಯ ದೆಣ್ಣನಾಯ್ವರುಕು\n20 ರಿತುಮುಲ್ಯೆ ನಾಡೊ ಕುದುವಂತೊದಾರ್ ಸ್ವರಾಜಾಕ್ಷ್ಮಾಪ್ತವಾಗಿ ಸಿಧ್ಯಗೋದ ಪುಜೆಗಳ್ ಕ\n21 ರಕೊಂಡು ಇಂಟಾಣವೇಯ್ದಿಯ ಕುಮಾರನಸ್ಮಲ್ಲಯ ಭಾಷುಪುರಮೊದಂಡು ಪೆರೆ\n22 ರಿಟ್ಟು, ಚತುಸ್ಸಿಮೆಯ ಕಲ್ಲ್ಯನೆಟ್ಟು,ಧಾರಾಪೂರ್ವಕವಾಗಿ ಕೊಟ್ಟರೊ || ಕಾರೆ\n23 ಗೋಜುಂ ಅ[ಣಾ]೧ಂಗಪುರೆವಂದು ಮರೆನಿಟ್ಟು ಧಾರಾಪೂರ್ವಕ್‌ ಕಾವಾಗಿ ಪಾರ್ಶ್ವರಾ\n24 ಥಣಿಗತ್ರೊ ॥ [ಕಿ]೧ರತ್ನೈದೋರಕ್ಷ್ಯ ದಾನನಾಲ್‌ ಗೋವನಾಲ ಜಯಮಲಪಿರಿಯೊಲ್ಲಿ\n25 ಗದ್ದೆ ಖ ೨ ಗಣವತಿ ಗೋಡೆಲು ಖ ೨ ಹೊಸೇದಾಯ್ತು ಖ ೨ ಎರವತ್ತಾ\n26 ಜ್ಞಾನ ಶಾಸನೆ೧೦ || ಶ್ರೀ ||\n12-ಅ\n\n92\n\n* 27 ቍಥಮ್‌ಕಲ್‌ ಆಳಿಸಿ\n28 ದವರು ಹಸುನಿಸು\n29 ಹೆಣ್ಣು ಗುರುವಿನೆ\n30 ಕೊಂದಕೊೇಟ್‌ ಪಾಪದಲಿರ್‌ತ್ಯೆ\n31 ಹಾರುಹೂದಯಿಕೆಂಬರು", "roman_pages": [76, 79], "original_pages": [133, 134], "translation_pages": [108, 109]}, {"id": "epca|I|40", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 40, "find_spot": "On a stone near the maṇṭapa in front of the Chandranathā basti.", "date": "Date 1216 A.D.", "translation": "Be it well. Fortune. In the 1138th Śaka year, the year Dhātu, the 15th of the bright\nfortnight of Jēshṭa, Tuesday,-Immaḍi-A . . . . ya-Rāya's army chaplain (kaṭakāchāryya)\nVidyādhara-Būchidēvarasa expired . . . .", "text_roman": "svasti śrī Śaka-varsha 1133 ne Dhātu-samvatsarada Jeshṭa śu 15 Maṇ . . . . vāradallu\nImmaḍi-A . . . . ya-Rāya kaṭakāchāryyar appa Vidyādhara-Bāchidēv-arasaru muḍipi .", "text_original": "ಅದೇ ಚಂದ್ರನಾಥ ಬಸ್ತೀಯ ಎದುರಿರುವ ಮಂಟಪದಲ್ಲಿ\n1 ಸ್ವಸ್ತಿಶ್ರೀ ಕೇಶವವರ್ಷ\n2 ೧೧ನೆಯ ನೇ ಧಾತು ಸಂ\n3 ವತ್ಸರದ ಜೇಷ್ಠ\n4 ಕು ೧೫ ಮಂ. ವಾ\n5 ರದಲ್ಲ, ಇಂಮುಡಿ\n6 ಆ.................\n7 .....................\n8 ..............ಯರಾಯ\n9 ಕಟ್‌ಕಾಚಾಲ್ಯ್ ರಪ್ಪ...ವಿ\n10 ಧ್ವಧರಬಂಚಿ ದೇವಸರಮು\n11 ಡಿ.ಖ................\n12 ವೇಶಳು................\n13 ತಂತಮ................", "roman_pages": [79, 79], "original_pages": [134, 134], "translation_pages": [109, 109]}, {"id": "epca|I|41", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 41, "find_spot": "On the footprint stone in front of the Śāntisvara basti, in the same basti.", "date": "Date about 1030 A.D.", "translation": "The holy footprints of Guṇasēna-paṇḍita's gurū Pushpasēna-siddhānta-dēva.", "text_roman": "Guṇasēna-paṇḍitasya gurōḥ Pushpasēna-siddhānta-dēvasya śrī pādaṁ.", "text_original": "ಅದೇ ಬಸ್ತೀಯಲ್ಲಿ ತಾನ್ಹೇಶ್ವರಬಸ್ತಿ ಮುಂದೆ ಇರುವ ಪಾದದಕಲ್ಮ\n1 ಗುಣಸೇನಸನಟ್ಟಿ ತಸ್ಯ\n2 ಗುರುಣ ಪ್ರೇಮ್ಭ್ ಸನಸದಾಂಧ\n3 ದೇವಸ್ತೃತಿಪಾದಂ", "roman_pages": [79, 79], "original_pages": [134, 134], "translation_pages": [109, 109]}, {"id": "epca|I|42", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 42, "find_spot": "On a stone in the north-west angle of the enclosure of the same basti.", "date": "Date about 1050 A.D.", "translation": "Be it well. The Nāga well which Guṇasēna-paṇḍita-dēva caused to be dug as dharmma\nfor the town.", "text_roman": "svasti śrī-Guṇasēna-paṇḍita-dēvar agalisida Nāga-vāvi nakarada dharma.\n(Figure of a cobra)", "text_original": "ಅದೇ ಬಸ್ತೀಯ ಸೌಕಾರಾದಲ್ಲಿ ವಾಯವ್ಯ ಮೂಲೆಯಲ್ಲಿ ನಟ್ಟ ಕಲ್ಲು\n1 ಸ್ವಸ್ತಿ ಶ್ರೀ ಸಗಣಸನಸಕ್ಷೆ\n2 ಕ ದೇವರೆಗಳಸಿದನಾ\n3 ಗ ವಿನೆದರದೆದ\n4 ಮ್ಮೃ್ (ಸಹದೇ ಅಕಾರಾವಿಧಿ)", "roman_pages": [79, 79], "original_pages": [134, 134], "translation_pages": [109, 109]}, {"id": "epca|I|43", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 43, "find_spot": "On a virakal on the tank bund of the same village.", "date": "Date 1077 A.D.", "translation": "Fortune. In the 999th Śaka year, the year Pingala, . . . . . . . . . .\nwhen śrī-Rājēndra-Chōla-Koṁgāḷva was ruling the kingdom :-his crowned queen Padmala-\nDēvi having died, . . . . . . . . . . . . . . . . . . . . . . . . . from strong emotion, he and\nhis wife . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .", "text_roman": "śrī Śaka-varsha 999 neya Piṁgala-samvatsara . . . . . . . . . . ātana paṭṭad-arasi\n. . śrī-Rājēndra-Chōla-Koṁgālvam rājyam geyyutti i. . . . . . . . . . . . . . . . . .\nPadmala-Dēvi sattu . . . . . . . . . aṇpa kāvaradindam tānum tanna peṇḍa .\n\nFootnote\n1. No doubt a mistake for gaṇadhara.", "text_original": "ಅದೇ ಗ್ರಾಮದ ಕೆರೆ ವರಿಮೆ ಮೇಲಿನ ಇನ್ನೆ ವೀರ್‌ಕಲ್ಲು\n1 ಶ್ರೀಕೇಶವಪಶ FFF ನೇಯ ಪಿಂಗಳ ಸಂವತ್ಸರ\n2 ಶ್ರೀ ರಾಜೇಂದ್ರ ಜೋಳೇಕೋಂಗಾಳ್ಯಾಂ ರಾಜ್ಯಂ\n3 ಗಯುತ್ತೆ...\n4 ಅತನಪಟ್ಡದರಸಿ ವದ್ಯಲವೇನಿ ಸತ್ತು......\n5 ನಿಹರಾತವರದಿಂದೂ ತನುತಂತ್ಯೆ ಹೆಂಡು...", "roman_pages": [79, 79], "original_pages": [134, 134], "translation_pages": [109, 109]}, {"id": "epca|I|44", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 44, "find_spot": "*On a stone at the same place.*", "date": "Date about 1080 A.D.", "translation": "Uttama-Chōla-Seṭṭi . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .\n. . with a sword cutting off his head, died.", "text_roman": "Uttama-Chōla-Seṭi sa . . . . bāleya . . . . khalgadindam . . . . . tale\ngaḍisi sattam", "text_original": "ಅದೇ ಸ್ಥಳದಲ್ಲಿ\n1 ... ...ಅತ್ತಮಚೋಣಿ ಸೇತಿಸು...ಬಾಲೆಯ...\n2 ...ಖಿಲ್ಲಿದಿಂದೊ........ತೇರೆಗೆದಿಸೆತ್ವಂ ॥", "roman_pages": [80, 80], "original_pages": [134, 134], "translation_pages": [109, 109]}, {"id": "epca|I|45", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 45, "find_spot": "Āryya-Śubhēndu kamda Vijal[ya]kīrtti-dēvara priya-śishyar-appa Bāhubali-dēvaru", "date": "Date 1296 A.D.", "translation": "Ōm. Obeisances. Be it well. In the reign of—with all titles, the maṇḍalika-Nārāyaṇa,\nthe champion who put to flight Maleya, a cage of adamant to refugees,—śrī-Harihara-Dēva\nChōla-Dēva,—in the year Durrmukhi, on the 5th of the bright fortnight of Chaitra, Monday,\n—when Beluhu-nāḍ Goddumbāḍi, Mulivarāditya-nāḍ Mallikārjjuna, Niḍita Meṇasa, and\n—when Beluhu-nāḍ Goddumbāḍi, Mulivarāditya-nāḍ Mallikārjjuna, Niḍita Menasa, and\nothers the whole nāḍ, uniting, marched to the Muḷḷūr fort and besieging it, hewing down the barrier and\nfort,—Boppa-gauḍi's (son) Malleya, fighting the Muḷḷūr fort, hewing down the barrier and\nslaying, fell in the crooked entrance. On his falling, the three hundred men of the villages,\nespecially of Māsāvi, uniting, gave as a vīra-sēse for him 3 paddy-fields in the Mākōve land\n\n9-A\n\n68\nof the Mullūr paddy-fields, and 5 paddy-fields in Hidijagala; these eight paddy-fields Boppa-\ngaudi's (sons) Mālaiya and Mādaiya having exchanged for the new amāni tank and 9 ga, the\nMāsāvi village united and made over to them, free of all imposts. These boundaries are\nfixed.\nThis stone was made by Kengolali Bāchāchāri's son Bairōja. The Kopana-tīrttha\nsēnabōva, Sāteya, wrote the letters of this śāsana. Great good fortune. Śrī. Śrī.", "text_roman": "i-sthānaṁṁ paṇad uddharsidaru śri-Rājā[dhirājānu] Komgālva-Rugmiṇī-dēviya dēviya\ndēhärada Vijaya-dēvara dvārā nele nimd amdu sva janani . . ta putra ā-Pōchab\nbarasige punyārtthavāgi pratishṭheyam mādṣi aṁga-raṁga-bhōga biṭṭu ūru Anilavājiya\nNulabihalliyaṁ Nāḍudarasiṇahalli Muḷḷūra Hūruvahallie sime mūḍa Hariva-halla teṁka\nBadanaguttiga . . . baḍagaṇ agala naṭṭa kallu paḍuva beṭṭa-baḍagana agala Kāragōda\nhalliya sime mūḍa Nelliyahalli naṭṭa kallu teṁka beṭṭada kone harigala badaga kere ēri\nīśānya naṭṭa kallu Muḷḷūra gadde galegala vōni kha 1 . . digereya kelage kha 2 āgal ottu\nko 10 . kina gōdalu . . . ko 10 gāla kha 1 Koḍagōdalu [kha] 2 Abba-gadde\nko 10 Lōke-gadde ko 10 . . . . . nāgasampage-gadde kha 1 bō[la]-gadde\nkha 1 ko-ālada-kōdi kha 1 ko 10 asagavakki kha 1 kō . siku kha 1 Niḍitada gōdalu\nkha 3 Myaṇasadalli kha 1 ko [10] Honnedēviya saraṇa gōdalu kha 1 Heṇṇanūra bhūmi\nkha 2 oṁdu gāṇad eṇṇe biṭṭadu āchandrārkkam sarvvā-janānandar dikshateya paṭṭa ōdi\npravarttiseyāge Vira-Hariharōrvvīśa palavara kādi rāya-māre-vokkaṛa-kāva śaraṇāgata-\nvajra-paṁjara samkha-chakra-gajadāra¹-bhritya Gomkā-Raḍḍi-nāyakage Guṇdappa-\ndaṇanāykaru kurittu Muḷḷu-nādam kuḍuvantar-ādar svabhāvārtthavāgi Siddha-gauḍa\nprajagala karekomḍu Amnpā-dēviya Kumāranahalliya Bhīmapuram emdu pesar-iṭṭu chatus-\nsīmeya kallu naṭṭu dhārā-pūrvvakavāgi koṭṭarū || Kāragōḍam A[jinnā]mgapurav emdu\npesaran iṭṭu dhārā-pūrvvakavāgi Pārśvanāthāing ittarū || [Ki]ratyadugakke dānaśāle\ngōmāle Jayamālapuriyalli gadde kha 3 || Ganapati gōdalu kha 3 Hunisedāru kha l eļuṭṭ\nĀrjuna śāsanam || śri i dharmava aļipadavaru paśu siṇe heṇṇu guru ivara kōti [ko]mda\npāpadali hōharu handiya timbaru.\n\n*At the same village, on a virakal in Vīrarāja-gauḍa’s threshing-floor.*\n*(First section)* Õṁ namaḥ || svasti samasta-praśasti-[sa]hitam maṇḍalika-Nārāyaṇam\nMaleya-beṇkoṇḍa-gaṁḍanuiṁ ṡa, ra]jāgatavajra-parijaramarum appa ṡri-Harihara-Dēva-\nChōla-Dēvara rājyad aṁdu [Du]rmmukhi-saṁvatsarada Chai (Second section) tra-ṡuddha\npaṁchami Sōmavārad aṁdu Mu[l]lūra kōtege Beḷuhu-nāḍu Godduṁbāḍi Mulivarāditya-\nnāḍa Mallikārjjuna Nidita Meṇasa modalāgi nāḍ-ella nerad ettibaṁdu mutti kōteya hattisida\nalli Boppa-gauḍiya Malleyal Muḷlūra kōteya kādu ați hoy (Third section) du vaṁkai\nnerad-irddu Muḷlūra gaddeyolage Mākoveya mamṇolage gadde 3 Hiḍijegalladi gadde 5 yiṁt\neṁtu ga[d]de Boppa-gaudiya Mālaiya Mādaiyanavaru hosamāni-keṛe sa (round the stone)\nhita ga 9 kke Māsavi ūru neradu avarige sarvvā-bādhā-parihāravāgi māridaru I-mariyāde\nlēṡōdeṁ bamdadu || i-kalla Kōgolaiya Bāchāchāriya maga Bairōji māḍi[da] kal[l]u\nṡrī Kopana-tīrththada sēnābōva Sātaiya i-ṡāsanada akharava bareda maṁgaḷa mahā ṡrī ṡrī ṡrī.", "text_original": "ಅದೇ ಗ್ರಾಮದಲ್ಲಿ ಕಾರಗೌಡರು ಪಟೇಲ ವೀರರಾಜಗೌಡರ ಕೊೇಡಲಲ್ಲಿ ನಟ್ಟ ವೀರಕಲ್ಲು,\nಪ್ರಮಾಣ 4' 4\" x 2' 8\".\n1 ಓನ್ನಿ ಮೊತಿ ಸ್ವಸ್ತಿ ಸಮಸ್ತ ವೃಕ್ಷ್ಞೆ ಸೌತಮಂಡಳೇಕ ನಾರಾಯಣನಮುಲೆಯಂ\n2 ಬಂಕೆಣಣ ಗಂದನಂಕ[ರ]ಣಾಗತವೆಜಿಸುಂಜರಯಮಪ್ಪೈಹ\n3 ರಿಹರದೆವ ಜೋಳೇದೇವರೆರಾಜದೆವದ್ರು]ಮ್ಮ್ಯಮನಿ ಸಂವತ್ಸರದ ಚ್ಯೆ\n4 ತ್ರ ಕುದ್ದೆಪಂಚಮಿ ಸೋಮವಾರದಂದು ಮೂರ್ಖರಕೋeಟಿಗೆ ಬೆರಹಯನಾದ್ದು\n* ಈ 5 ಪತ್ತ್‌ಗಳ ಕಾಸನಡ ಮೇಲ್ಬಾಗದಲ್ಲಿ ಬರೆಯಲಟ್ಟಿದೆ.\n\n[Kannada original]\n* ಈ 5 ಪತ್ತ್‌ಗಳ ಕಾಸನಡ ಮೇಲ್ಬಾಗದಲ್ಲಿ ಬರೆಯಲಟ್ಟಿದೆ.\n[English translation, Gemini-rendered, verify]\n* This is written at the top of the inscription of these 5 plates.\n\n5 ಗೊದ್ದು ಬಾಧಿಮುಳವರವಡಿತಕ್ತ ನಾಡಮಲ್ಲಿ ಕಾಜ್ಜ ರ್ಸನ್ನಿದಿತೆಮಿನ\n6 ಸೇವೆಯೊಲಾಗಿನಾಡಲ್ಲನೆಡದತ್ತ ಬಂದೆಮುಕ್ತಿ ಕೊಣೇತಿಯುಹತ್ತಿಸೆದೆ\n7 ಲ್ತಿ ಬೊಪ್ಪಿಗೊಡೆಯಿಮಲೆಯ ಮುಳಕ್ಕಾರ ಕೊಣೇತಿಯ ಕಾಡಾಯ ಅಬಾಹೆಯಿ\n8 ದು ವಂಶಧಾರದೆ ಒಳಗಿಬಿಡ್ದೆ ನು ಬಿಡ್ದ ಲ್ಲಿ ಗೆಯತಲಗೆ ವೀರಸೇನೆಯಾಗಿ ಮಾಸಾ\n9 ವಿಮುಖವಾಗಿಲ ಲೂರೆ ಮೂನೊಕಾಲರು ನರೆದಿರು ಕ್ ಮೂಳಯ್ಯಗಗ್ಗದೆ ರೊಂ\n10 ಲಗೆ ಮೂಕಣಿಯೆಯಮುನೆನೊಳಗೆದನ್ನೆ ರಿ ಹಿಡಿಜೆಗೆಳಲಿಗೆದ ೪ ಯಿಂತೆಂತು\n11 ಗದ್ದೆ ಬೊಪ್ಪಿಗೊಡೆಯ ನುಳ್ಳೆಯ ಮಾಧ್ಯಯೆನನರು ಹೊಸಅಮಾನಿಕತಸೆ\n12 (ಅಲ್ಲಿನ ಸುತ್ತುಲೂ ಬದಿಯುವೆದು)\nರಂಹ ಗೆ ರ್ ಕೃ ಮಾಸಾವಿ ಊರುನೆರದು ಅವರೆಗೆ ಸರ್ವಾಣಬಾಧಾರೆಯಿನರವಾಗಿನಾವಾತಿರರು ಈಮರಿಯಾ\nದೇಶೀ ಸೊದುಬೆದರದು ॥ ಈ ಕಲ್ಲು ಕೊಣೇಗೊಲಕೆಯಜಾತ್ರಾಕಾರಿಯಮಗಚ್ಚುರೊಣೇಜೀವನಾಡಿ[ದೃ]ಕಲ್ಲ್ಯ ಶ್ರೀ\nಕೊಸಣ ತಿರತ್ಯಾದೆದಣ್ಣಿ ಬೋವಣಸತ್ತೆಯು ಈ ಶಾಸನದ ಅಂಬಿರದುದೆದೆ ಮಂಗಳಮಹಾಸೀ ಶ್ರೀ ಶ್ರೀ ಶ್ರೀ", "roman_pages": [79, 80], "original_pages": [134, 135], "translation_pages": [109, 110]}, {"id": "epca|I|46", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 46, "find_spot": "*On a stone at Mālambi (same hōbli), near the old village-site.*", "date": "Date 1004 A.D.", "translation": "Be it well. The sun in the sky the Chōla-kula which was like the stem of the tree of\nparadise the Solar race, the friend of the virgin daughter of Kavēra (that is, the Kāvēri river)\ndevoted to removing the sins of all people, - the great Chōla king Rājakēsarivarmma-\nPermmānadigal], - to Manija, who in the battle of Panasoge had massed (his forces) and fought,\nsaying I will not return till they are completely put down, so that those who opposed him\ndied, of his great grace, saying to bind a paṭṭa on him and give him a nāḍ, - sent word to\nPañchavan-mārāya, who bound on him a paṭṭa (inscribed with the title) as Kshatriya-śikhā\nmaṇi Kongālva, and gave him Mālavi [now Mālambi].\nTo this, gāvunda-Rāchamma's family are witnesses, - Kannavangala Āditya-gāvunda,\nand .. galani Nanniya Mēru, Keļane . . . cha-gāvunda, Nallūr Ereyanga-\ngāvunda, (the rest is effaced).", "text_roman": "svasti Sūryyānvaya-surataru-stambhāyamāna Chōla-kula-gaghana-gabhtimaji sakala-\njana - durita - haraṇa - nipuṇa - Kavēra - kanyakā-sakhīyamāna Chōla-mahā-mahīpati ṡrī\nManiRājakēsarivarmma-Permmanadigal jaṁge Panasogeya kålegadal otti keydam nerid ikku\nbarēn endu ātanan ¹ aḍahidar ssattar endu piriduṁ kāruṇyadinda ² paṭṭava kaṭṭi nāḍa\nkuḍug endu Paṁchavan - mārāyargg aṭal ātam Kshatriya - sikhāmaṇi- Kongalvan endu\npaṭṭavam kaṭṭi Mālavviyan ittar idarkke gavuṇḍa-Rachammana vaṁṡamē sākshi\nKaṇṇavaṁgalada Āditya-gāvuṇḍanum . galaniya Nanniya Mēruvuṁ Keḷane,\ncha-gāvuṇḍanum Nallūr Ereyamga-gāvuṇḍa . . . ḷiūr-nnāḍe Kel-nāḍe porag endu nuḍiyal\nkā. . . . . (the rest is effaced).", "text_original": "ಅದೇ ಹೋಬಳಿ ಮಾಲಂಬಿ ಗ್ರಾಮದ ಹಳೆಗ್ರಾಮ ನಿವೇಶನದ ಬಳಿ\nಪ್ರಮಾಣ 3' 2\" × 2' 8\" (ಈ ಕಲ್ಲು ೨ ತುಂಡಾಗಿದೆ)\n1 ಸೃಷ್ಟಿ ಸ್ವೌಯ್ಯನ್ವಯ ಸುರತರಸ್ತು ಜಯಮಯನೆ ಚೋಳಕು\n2 ಲಗೆನೆಗಾಗೆವಿರಾಮಿವತ್ಕಲ ಜನದಿತೆ ಹರಜನಿ\n3 ಪುಣಕನೆರೆ ಕನ್ಯಕರಾಸೀಮೆಯವೆಸನ ಜೋಜಾ ಮಹಾಮಹೋ\n4 ಪತಿಶ್ರೀರಾಜಾಸೇರಿವಮ್ಯ್ಕ ಹೆಮ್ಮ್ಯ ನಡಿಗೆಜ್ ನಿಜೊಗೆ\n5 ವನಸೊಗೆಯ ಕಾಲಗೆದಲೊಟ್ಟು ಕೊಂಡುಂಟಸಿಕ್ಕ್ಯಬ\n6 ರೇನಣ್ಣು ಅತನನಡದೊಡ್ಯಕತ್ರಯೆ ರಿಪುದುಕಾರು\n7 ಣ್ಣಾವಿನೆ ನುಟ್ಯವಕಟ್ಟೆ ನಡಕಡದೊಗನ್ನು ಪಣ್ಣ್ಯನೆಸ್\n8 ಮಾರಾಯಗ್ಸ್ ರಟ್ಟ ಲಾತಕೃತ್ಯಾಶ್ರಯೆ ಬಾಣೆ\n9 ಕೆಂಗಾಲಗ್ಸನೆನು ಪಟ್ಟ ನಡಕ್ಕೆ ಮಾಲಪ್ಪಿಯ್ಯನಿತೆ ರಿ\n10 ದಕ್ಕೇಣಾಗವುಣ್ಣ ರಾಜಖ್ಯ್ಯನವಕಮೆಣಸಕ್ಕಿ ಕಣ್ಣ ವೆಂಗಲ\n11 ದಡಕ್ಕ್ಯಾಗಪುಣ್ಣ್ಯನು ಗೇುನಿಯೊನ್ನಿ ಯಮೇಉಪಾತ್ರಂ\n12 ಕಟಿನು...ಚಾಗಪುಣ್ಣ್ಯನುನಲ್ಲೆ ರೊತಿಯೊಂಗಾವಪುಣ್ಯ\n13 ...ಲ್ಯೊನ್ಮ್ಯ ಕಡೇಕಲ್ಮಾ ದೆವೊಜನಗ್ಸನ್ಯನಡಿಯಲಕ್ಕೆ........(ಮುಂದೆಕಾಣುವುದಿಲ್ಲ)", "roman_pages": [80, 80], "original_pages": [135, 135], "translation_pages": [110, 110]}, {"id": "epca|I|47", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 47, "find_spot": "*On another stone at the same place.*", "date": "Date 1756 A.D.", "translation": "In the year Dhātu, on the 5th of the bright fortnight of Āśvija, - śrīmat VēnkaTādri-\nNāyaka's (son) Krishṇappa-Nāyaka granted to Mālambi Rāche-gauḍa the land-rent of 12 ga.\nTwelve varaha have we given.", "text_roman": "Dhātu-saṁvatsarada Āsva[i]-ṡudha 5 lū śrīmatu-Veṁ[ka]tādri-Nāyakara Krushṇappa-\nNāyakarru Mālambi-Rache-gaudage palisi komdadu [ka]ndāya ga 12 haṁneraḍu varahamnu\npālisi komdadu idhēve.", "text_original": "ಅದೇ ಗ್ರಾಮದ ಹಳೆಗ್ರಾಮ ನಿವೇಶನದ ದ್ವಾರದಲಿ\nಪ್ರಮಾಣ 1' 10\" × 1' 3\".\n1 ಧಾತೃಸಂವತ್ಸರದೆಳ\n2 ಸ್ಸೇಜೂಧ ಕ ಲಾ ಶ್ರೀಮು\n3 ತುವೆಂ[ಕ]ಟೂಪಾದಿನಾಯಕರುಶೃಷ್ಣ\n4 ವ್ರನಾಯಕರುಮಾಲಂಬಿಬರಾ\n5 ಜೆಗೌಡಗಪಲಿಸುಕೊಂಡದು\n6 ಕಂದಾಯ ಗ ೧೨\n7 ಹಂನದುವರಹನ\n8 ಇನುಪಾಲಿಣೆಕೊಂದ\n9 ದು ಇದ್ದೇವ", "roman_pages": [80, 80], "original_pages": [135, 135], "translation_pages": [110, 110]}, {"id": "epca|I|48", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 48, "find_spot": "*On a stone at Mesana (same hōbli), in the trench of the fort ruins.*", "date": "Date about 1050 A.D.", "translation": "Be it well. When śrī-Kongālva was ruling the kingdom :-Komaraya and Sundaraya,\nwhen the cows of ... were carried off, attacked those who drove them away, and\n......................\n(Images of Sundaran and Komaran, with the names attached).", "text_roman": "svasti ṡrī-Komgālva rājyam ge-e Komārayan Sundara . . . . . . ede tuṛu kole\nkaṭṭistaralli . . . . n ā-hāra turuhāran oṭṭi . . . . . . . . . sāmantara . . . da\nKomgā. . Gōkipayana. . Māra vūrā. . . . ppaṭṭi koṭṭa . . daṇida sēniyara . . . . .\n\n*(Images of Sundaran and Komāran, with the names attached.)*\n\nFootnote\n1. The first na is inserted below the line, with a cross above to show where it should come.\n2. ru is below the line, at the end.", "text_original": "ಅದೇ ಹೋಬಳಿ ಮೇಣಸದೆ ಹಾರೂಕೋಟಿ ಕೊಂಡು€ದಲಿ\n1 ಸ್ಸನ್ಮಿಸ್ಟ್ರೀಕೋಂಗಾ ಲ್ಯರಾಜ್ಯಂಗೆಏಕೊಮಾರಯಾಸುನ್ನರೆ.. ಜ.........\n2 ಎಡೆತುರುಕಳಕಳಟ್ಟಿ ಸ್ಯರೆಲ್ಲಿಂ...ನಾದಹರಕುರುಹಾರನೋಟಿ.......\n\n94\n\n3 . . . . ಸಾಮಂತರ... ದಕೋಽಗಾ... ಗೋಳೀಮಯನ...\n4 ಮಾರವ್ರೇರಾ... ಪುಟ್ಟಿ ಕೊಟ್ಟೆ... ದೇಶದಣೇನಿಯರ...\n(ಸುನ್ನ ರೇ- ಕೋಮಾರನ್)", "roman_pages": [80, 86], "original_pages": [135, 136], "translation_pages": [110, 110]}, {"id": "epca|I|49", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 49, "find_spot": "*On a stone at Hosahalli (same hōbli), near Paṇiyālada-katte.*", "date": "Date 1070 A.D.", "translation": "1 Be it well. In the 993rd Śaka year, the year Sādhārana, on new-moon day of the\nmonth Chaitra, - śrīmad Rājēndra-Prithuvi-Kongālva granted fifty khaṇdugas of land in the\nrice fields east and west under the Gaurati tank of Sulligōḍu and the enjoyment of the priest\nof the god Vira-Siddhēsvara of Hoshavaḷḷi, and made them over with pouring of water.\nAlso Rājavallabha-seṭti gave 40 gadyāṇas for the tank, and ādavala gadyāṇa 1½. Whoso\nfails in this has slaughtered cows. Whoso seizes on land given by himself or by another, is\nborn a worm in ordure for sixty thousand years.\n\n69\n\nFootnote\n1. One line and a half at the top, beginning with Svasti, is too illegible to make out its purport. It was perhaps a subsequent addition.", "text_roman": "(One line and a half at the top, beginning *svasti*, is illegible except for a letter here and\nthere. It is perhaps a subsequent addition.)\n\nsvasti Śaka-varsha 993 neya Sādhāraṇa-saṁvatsarada Chaitra-māsada amāvāse\nyamdu śrīmad-Rājēndra-Pṛituvi-Koṅgāḷvaṁ Suḷigōḍina Gauratiya-kereya kelagana\nmakke mūḍaṇa haḍuvaṇa gōḍa bālagāgi ayvattu-khaṇḍuga bida bhūmiyam Hosavaḷli-\nVīra-Siddhēśvara-dēvarggaṁ archchanā-bhōgakkaiṁ dhārā-pūrvvakaṁ biṭṭaṁ Rājāvallabha-\nseṭṭi kerege koṭṭa gadyāṇaṁ 40 ādavala gadyāṇaṁ $1\\frac{1}{2}$ tappidaṁ kavileyan aḷidaṁ sva-\ndattaṁ paradataṁ vā yō harēta vasundharāṁ shashṭir vva[rsha sahasrāṇi vishṭhāyāṁ jāyatē\nkrimih].", "text_original": "ಅದೇ ಹೊೇಷ್ಮಳ್ಳ ಹೊಸಹಳ್ಳ ಕಣ್ಮೆಯುಳ ಕಟ್ಟುಬಾಳ ನಟ್ಟ ಕಾಸನ\nಪ್ರಮಾಣ ೩* ೨\"* x ೩\"\n\nಇದರ ಮೇಲ್ಬಾಗದಲ್ಲಿ ಸ್ವಸ್ತಿಪ್ರಾರಂಭವಾಗಿ ಒಗ್ಗೆ ವಂಕ್ಕೆ ಸ್ಪಷ್ಟವಾಗಿ ಕಾಣಿಸುವುದಿಲ್ಲ\n1 ಸ್ವಸ್ತಿ ಶಕವರ್ಷ ೯೯೫ ನೆ ಯೂ ನಾ\n2 ಧಾರಣಸಂವತ್ಸರದತ್ಯ್ವತ್ರಮಾಸ\n3 ದಲಮಾವಾಸೆಯೊಂದುಶೋಮವಾರೇ\n4 ನ್ಮಸ್ತೃತುವಿನೋಂಗಾಲ್ಯಾನ್ಸುಳ್ಳಗೋಡಿನ\n5 ಗೋಷ್ಠೀಯೂಚತಿಯೂಕೇರುಗಾಮೇ\n6 ಕ್ಷಮೂದಣಾಹರುವಣಗೋಡ\n7 ಬಾಲಗಳಗಾಲಿಯುತ್ತು ಬಣ್ಮಗ\n8 ಬಿಡೇಭೂಮಿ ಸುಖೋಪವಸ್ವರ್ಯ\n9 ರಸಿದ್ಧಣ್ಹರಯೇನ್ಮಳಂರಂಜತ್ನನಾ\n\n10 ಭೋಗೇಕ್ಪಂಧಾರಪೂಣ್ಣ್ಯಃ ಕಾಂಬಿಟ್ಟಂ\n11 ರಾಜಾವಲ್ಲಭಸೆಟ್ಟಿಗೆ ಊಳಿಗೆಕೊಟ್ಟಿಗೆ\n12 ದಣ್ವಣಂ ಕಂ ಆದವೆಲಂಗದ್ಯಾ\n13 ಣಂ ೧೪ ತಪ್ಪಿದೊಳ್‌ವಿಲೆಯನಳದಂದೈದ\n14 ತಂ ಪರದತ್ತೆ ಣವಾಯೆಗ್ನಸುರೇತವೆಸುಂಧರಾಂ\n15 ಪಷಿ ವೃನ್ಮಾಸಹಸ್ರಾಣಿವಿಷ್ಠಾಯಾಂಜಾಯ\nತೇಕ್ರುಮಿಃ", "roman_pages": [85, 85], "original_pages": [136, 136], "translation_pages": [110, 111]}, {"id": "epca|I|50", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 50, "find_spot": "*On a stone at the sume village, in the paddy field near Timmayyana-kere.*", "date": "", "translation": "*Date 1070 A.D.*\n\nBe it well. In the 993rd Saka year, the year Sādhāraṇa, on new-moon day of the\nmonth Chaitra,—when sri-Rājendra-Prithuvi-Koṅgālva was ruling the kingdom :-for the\ngreat god Vira-Siddheśvara of Hosahalli he gave money and bought land in Posavalli Nira-\ngāvuṇḍa's field, and gave ten khaṇḍugas āḍavalam. Whoso fails in this has slaughtered\ncows.", "text_roman": "svasti Śaka-varsha 993 ne . . Sādhāraṇa-saṁvatsarada Chaitra-māsada amāvāsi yamdu\nśrī-Rājēndra-Pṛithuva-Koṅgāḷva rājyam geyutt-ire Hosavaḷli Vīra-Siddhēśvara-mahā-\ndēvargge Posavaḷliya Nīra-gāvuṇḍana keyyal ponnaṇe koṭṭu maṇṇare koṇḍu pattu-khaṇḍuveya\nādavalam koṭṭam tappidaṁ kavileyan aḷidam.", "text_original": "ಅದೇ ಗ್ರಾಮದಲ್ಲಿ ತಿಮ್ಮಯ್ಯನ ಕೋಜುಳಾ ಗದ್ದೆ ಯಲ್ಲಿ ನಟ್ಟ ಕಾಸನ\n1 ಸ್ವಸ್ತಿ ಸಮವರ್ಷ ೯೯೫ ನೆ\n2 ಸತಧಾರಣಸಂವತ್ಸರದತ್ಯ್ವತ್ರ\n3 ಮಾಸಲಮಾವಾಸೆವಾಸೆಯೊಂದುಶೆ\n4 ರಾಜೇಂದ್ರನೃಪಶುವಕೇ೧ಂಗಾಲ್ಕರ\n5 ಜ್ಯಂಗೋವ್ಯ್ತ್ರಿ ರೇಯೋಜನಪ್ಪೆಳಿನಿರ\n6 ಸಿಪ್ರಿಹ್ಲಾದಮಹಾದೇ[ಪ್ರ]ಗೌವ್ರ್ಮಸೆವಲ್ಲ್ಯ\n7 ಯನ್ನೇರೋಪೂರ್ಣನಸಕ್ಕೆಯೊಲ್ಲೇನ್ನ್ಯ\n8 ಅಡಿಕೊಟ್ಟುಮನ್ನಾ ಅಕೋಳಿಣ್ಯ ಪತ್ರುಖಿ\n9 ಣ್ಣ್ಮೆಯಲುಅಡವೆಲಂ ಕೊಟ್ಟುಂ ತಪ್ಪಿ\n10 ದಂಕಾಲಿಲೆಯುನಾಳದಂ", "roman_pages": [85, 85], "original_pages": [136, 136], "translation_pages": [111, 111]}, {"id": "epca|I|51", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 51, "find_spot": "*At Doḍḍa-Malate (same hōbli), on the sluice of Honnammana-kere.*", "date": "", "translation": "*Date ? 1106 A.D.*\n\nIn the fortunate year Pārtthiva, on the 10th of the bright fortnight of Phālguna,\nThursday,—Annadāni-arasa had this sluice built. The builders were Venkataiya and\nMalaiya. Bomarasaiya's writing. The god Basalinga was made in the time of Nanna-gauda.", "text_roman": "śrīmatu Pārtthiva-saṁvatsarada Phālguna-śu 10 Guruvāra Annadāni-arasinavaru yī-\ntūba kaṭṭisidaru kaṭidavaru Veṅkaṭaiya Malaiyya Bomarasaina baraha Basaliṅga-dēvaru\nNanna-gauḍana kāladali āyitu.", "text_original": "ಅದೇ ಹೊೇಷ್ಮಳ್ಳ ದ ದೊಡ್ಡ ಮಳತ ಗ್ರಾಮಕ್ಕೆ ಸೇರಿದ ಹೊಣ್ಣಮೃನಕರೆ ತೋಟಿನಮಾಲೆ\n1 ಶ್ರೀಮತ್ತು ಪತಿ೯[ಪ್ರ]ಸಂವತ್ಸರದಪಲ್ಲ೧ಣಸುಂ ಗುರುವಾರಲನ್ನ ದಾನಿಲರೆದಿನವರು\n2 ಯಾತುಖಬಾಟಿ ಸಿಡೆಸಾಕಿಡಿದವರುವಂಶಕೃತ್ಯಮ್ಮುಲೈಯುಂಬೊಮನ್ಸೆನಬಾರದೆ\n3 ಬಿಸಲಿಗಂದೇವರುನವನಗದಿನಕಾಳದಲಿಲಿಸುತು", "roman_pages": [85, 85], "original_pages": [136, 136], "translation_pages": [111, 111]}, {"id": "epca|I|52", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 52, "find_spot": "*On a stone at Ganagūr (same hōbli), near the village entrance.*", "date": "", "translation": "*Date ? about 1290 A.D.*\n\nIn the year . . . . . . ., on the 10th of the bright fortnight of Vaiśākha,\nTuesday,—an act of grace granted for the southern Guṇḍa-nāḍ Seventy :-If to . . . . .\n. . . there is no male, it will go to a female and to female children. Whoso causes\n* failure in this charity commits sin and has fallen into Naraka. He is guilty of slaughtering\ncows on the banks of the Ganges and of the murder of a Brāhman.\n\nThe great minister Paḍivala-Bānamarāja's son Heggade-Nākana wrote it. Great\ngood fortune . . . . . . . . . . . . . Vajjaragāla Bayala-nāḍ Bammōja made the\nśāsana", "text_roman": ". . . . . rada Vaiśākha-su 10 Maṅgalavāra-andu tenka-Gunda-nāḍ-\neppattakkaiṁ kāruṇyam geydu . . . . . rtoḍe gaṇd illadirddaḍe heṇṇinge heṇṇu-makkaliṅge\nsaluvudu I dharmmava tappa-nadadam pāpa Naraka bidda Gangeya tadiyalu kavileyam\nBrāhmaṇanu vam konda Brammātiyam koṇḍa śrīman-mahā-pradhāna Paḍivala-Bānam-\nmarājana putra Heggade-Nākana barada maṅgala mahā śrī . . . dattaṭṭa-vesa . .\n. . . . Vajjaragāḷa Bayala-nāḍa Bammōja geyda śāsana.", "text_original": "ಅದೇ ಹೊೇಷ್ಮಳ್ಳ ಗನ್ಗೂರು ಊರುಬಾಗಿಲ ಬಳಿ\n1 ......................\n2 ರದವಿನ್ಯಾಘಿಸು ೧೦ ಮಂಗಳವಾರೇ\n3 ದೆಂರುತೇಕಗಂಗೋಂದನಾಡಪ್ಪತ್ಯ್ಕರಾಂಉಂ\n4 ಗೆಯೆ ಯು - ಕೇಶೀಕಣಗೊದಿಲ್ವಿದ್ದೆ ೧ಡಿ\n5 ರೆನೆ ಗೆಹೆಣ್ಯ ಮೈಕ್ಕಳಂಗೋಸೆಲವು\n6 ದುಣಾಧಮ್ಮಾ೯ವಚನಂದದೇವಪಾಹರಕ\n7 ಬಿದ್ದೆಗಂಗೆಯ೨ಡಿಯುಲವಪಿರೆಯುಂ\n8 ಬ್ರಾಹ್ಮಣನವಂಕರೊಂದೆಬ್ರಂಮಾತಿಯಂ ಕೋಂ\nಡೆ\n9 ಶ್ರೀಮನ್ನಹಾಪ್ರಧಾನನಧಿವೆಳಬಾನಮ್ಮ ರಾಜನ\nಪುತ್ರಹ\n10 ಗ್ನೆ ದ್ನ್ಯಾಕಣಬರದೆದಮಂಗಳಮಹಾಶ್ರೀ ಶೇ\n11 ದೆವತೈ೨ನಸೆ... ಗರಕಾಪ್ಪಿ ರೌಲಾಬಯೆ\n12 ಲನಾಡಬವೆಣ್ಣಗೇಗೆಯ ಸಾಸನ", "roman_pages": [85, 85], "original_pages": [136, 137], "translation_pages": [111, 111]}, {"id": "epca|I|53", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 53, "find_spot": "*On another stone at the same place.*", "date": "", "translation": "*Date ? 1055 A.D.*\n\nWhen . . . . . . . . . . . . . . . . . . . . was ruling the kingdom of the\nworld:- . . . . . . . . . . -daṇḍanayaka, with others, of whom he was the chief,\nremitted the dues and gifts of the . . . ku-nāḍ Seventy for Vodeyappa and Honnapaya,\nand the money tribute . . . . . . . . . . . . . . . . . . . . all dues . . "I", "number": 56, "find_spot": "*On a stone at Doḍḍa Kaṇagālu (same hōbli), in the Gauda's field.*", "date": "Date? 1044 A.D.", "translation": "The tomb of Prabhāchandra-dēva, the beloved eldest disciple of . . . Śubhachandra-\ndēva, of the śrī-Mūla-sangha, Dēśīya-gaṇa, Pustaka-gachcha, Koṇḍakundānvaya, and\nIngulēśvara-bali. He obtained release (died) in the year Tāraṇa, on the fifth of the bright\nfortnight of Chaitra, Friday.", "text_roman": "śrī-Mūla-sangha Dēśīya-gaṇa Pustaka-gachchha Koṇḍakuṇḍ-ānvaya Ingulēśvarada-\nbaḷiya . . . Śubhabhandra-dēvara priyāgra-śishyarum-appa Prabhāchandra-dēvara nisidhi\nTāraṇa-samvatsara Chaitra-śudha-panchamī Śukravārad-andu muktar ādaru.", "text_original": "ಅದೇ ಹೋಬಳಿ ದೊಡ್ಡ ಕಣಾಗಲು ಗೌಡನ ಹೋಲದಳ್ಳಿ ೨ ನೇ ಕಲ್ಲು.\n1 ಶ್ರೀಮೋಸುಗಂದಪೇವಿಯಗೆಣಪಸ್ಮ ಶಾಳಿ\n2 ಭಕೌಂಡಿಕೌಂಡಾನ್ಯಯಂಇಂಗುಳೇಸ್ಮರದಬ\n3 ಆಯಮ.- ಅದೆ- ಸುಖಹೊದಧೇವರೇ-\n4 ಪ್ರಿಯಗಗ್ಗಿ ಸೀಕರಮನುಷ್ಯಣಿಭಾಚಂದದೇವದೇವನಿ\n5 ಸಿಧಿತರಣಸಂವತ್ಸರಧೆತ್ರೇತ್ರ ಸುಧಪಂಚಮಿ\n6 ಸಂಕ್ರಾವಾರದೊಂಡುಮುಕ್ಕರಾಧರು-\n\n[Kannada original]\n[English translation, Gemini-rendered, verify]\n96", "roman_pages": [86, 86], "original_pages": [137, 138], "translation_pages": [112, 112]}, {"id": "epca|I|57", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 57, "find_spot": "*On a stone at Yuḍūr (Yadava-nād), in the Suggidēva temple.*", "date": "Date 1095 A.D.", "translation": "Be it well. In the 1017th Śaka year, the year Yuva, the second of the bright fortnight\nof the month Śrāvaṇa, Sunday,—the śrīman mahā-maṇḍalēśvara, chief lord of Tripura, sun to\nthe lotus the Balindra-kula, champion of the Four-faced (Brahmā), a cage of adamant to\nrefugees, a lion to the elephant his enemies, a Bhīma of the powerful, a Rāmu in war, a\npleasure garden of the Malepas (or hill chiefs), praised by the eulogists, plunderer of foreign\nterritory, his father’s warrior, his head at the feet of Śiva, an ocean of truth, a saw to the\nheart of his enemies, a Rakkasa in war with kings,—with these and many other titles,—\nDuddharasa, born to Hitteyarasa and Junjala-Dēvī, being of great might and valour,\npossessed of fresh youth, the beloved of Vijaya-Lakshmī (the goddess of victory), protecting\nMaleya, terrifying and driving away his enemies, casting them out of their forts, an\nincarnation of prowess (or a Vīrabhadra), the Kali-yuga Yama,—protecting and ruling\nSamhatha-nād, Pākuvādi and other places,—having fifteen horses, fifty male servants, two\nhundred and fifty strong men, forty-five retainers of good family, and a retinue of many\nsubjects quarters relatives and landed proprietors,—on the application of his lawful wife . .\nChikala-Dēvī, . . . . . . . . . . having the Rāja(samudra) tank built, and the . . . . . . .\n. . . . . . erected, having set up a chatram for holy Brāhmans, having caused rice\nfields to be made at the river, and brightening many acts of dhamma,—when he gained the\nŚiva-lōka (died), his brother Jūjarasa, out of friendship performing his obsequies, had this\nvīra-śāsana written by Molate Buddha-malla, minister for peace and war, and sēnābhōva\nRājimayya's son Bamma-dēva. Whoso contemns the rice fields that Duddharasa thus\ncaused to be made, has slain cows and Brāhmans in Bāṇarāsi. Great good fortune. Śrī. Śrī.", "text_roman": "svasti Sakha-varsha 1017 neya Yuva-samvatsarada Śrāvaṇa-māsada sudi-bidige\nAdivārad-amdu śrīmanu-mahā-maṇḍalēśvara Tripurādhīsvara Balīndra-kuṇa-kamala-\nmārttanda Chaturmukha-gaṇḍa saraṇāgata-vajra-paṁjara vairi-gaja-kēsari baliyara-\nBhima samgrāma-Rāma Malepara-naṁdama-vanaṁ samstutya-vandi-janaiḥ para-maṇḍala-\nsūrekāra ayyan-aṁkakāra Śiva-pāda-sēkharam satya-ratnākaram ripu-hṛideya-karkkaśam\naras-aṁka-rrakkasan anēka-nāmāvali-mukhyan-appa Duddharasaṁ Hiṭṭeyarasam[ḽ]\nJuṁjala-Dēvigam puṭṭi atula-bala-parākraman-āgi nava-yauvan-ārūdhanam vijaya-Lakshmī-\nkāntanam-āgi Maleyam pratipālisi ripugalaṁ bedari beṁkoṇḍu kōtegalan nirddhātisi\nvīrâvatāranum Kaliyug[āṁ] (on the back) tekam Samhatha-nāḍumaṁ Pākuvādiyuṁ modal\nāgi pratipālisiy uḍu padinaydu-kudureyu ayvattu-lēmkarum innūr-ayvattu-ekkaṭigaruṁ\nnāluvatt-aydu kulapuṭṭigeg-āyad-āḷum anēka-praje-parivāra-baṁdhu-varggamum tala-\nvarggamum kula-strī-Chikala-Dēviyuṁ besakeyyye su . . jalideyimi Rāja . . kereyaṁ\nkaṭṭisi . . . yaman ettisi diva . . . ru Brāhmaṇargge chatramaṁ nilisi tore-galdeyaṁ\nmāḍisi sēnabōva-dhammama belagi Śiva-lōka-prāptan āgal sahōdaraṁ Jūjarasam snēhadim\nparōksha-vineyam geydu vīra-sāsanamam bareyisidaṁ Molateya Duddhamalla sandhi-\nvigrahi sēnabōva-Rājimayyana magam Bamma-dēvan ī intu Duddharasam māḍisida\ntore-galdeyam mārikonḍavaṁ Bāparāsiyalu hasuvuṁ hāruvanam koṁda maṁgala mahā śrī śrī||", "text_original": "[Kannada original]\nಯಡವನಾಡು ಯುಡೂರು ಸುಗಿ ದೇವೀರ ಗುಡಿಯಲ್ಲின ಶಾಸನ. \nಪ್ರಮಾಣ 4' 8\" x 1' 6\"\n[English translation, Gemini-rendered, verify]\nInscription in the Sugi Devīra temple at Yadanavāḍu, Yudūru. \nDimensions: 4' 8\" x 1' 6\"\n\n1 ಸ್ವಸ್ತಿಶ್ರೀವಷ೯ ೧೧೧೭\n2 ನೇಯಿಯುವಸವತ್ಸರದ\n3 ದೆಸವೃಷಣಮಾಸದಸುದಿಬಿ\n4 ದಿಗೆದಿವೀರದರೆಂದು\n5 ಶ್ರೀಮ್ಮನುಮಹಾಮಾ\n6 ಣ್ಣಲಿಸ್ತುರಿತ್ರಿಪುರಾ\n7 ಧಿನೆತ್ತರಬಲ್ಲೆನ್ಯಸಕು\n8 ಳಕಮಲಮಾತ್ರೂಣ್ಮಾ\n9 ಚತುಮ್ಮುಖಬಗಣ್ಯಸರ\n10 ಕಾಮಗವಜಪಂಸಂಜಗವೈ\n11 ೦ಗಜೇಕಣ್ಸಬಿಲಿಯ\n12 ರಘುಮಸಂಗ್ರಾಮರಾಮು\n13 ಮೆಲೆಪದಂದನವದನಂ\n14 ಸೆನ್ಸುತ್ತೈವಂದಿಜನವನ\n15 ರಮಣ್ನಾಳಸೆಟಿಕಾರಂ\n16 ಆಯುನ್ನಂಶಕಾರೊ\n17 ಮೆಸದಶೇಷುರಿಂಥ್ವರ\n18 ತಾಮ್ಯಕರದಿಂದಿಪುತ್ಥೆಯು\n19 ಕಲ್ಕಸೀಅಸಂಸೊಕರಕ್ಯಾ\n20 ಸೆನೆವೆಳ್ಕನಾಮಮಾಲ್ಯಮು\n21 ಖ್ಯನವಧುದ್ರೋಹರೊಂಟೆ\n22 ಯುರಸೆಂಗೊಜಾಪಲದೆವೆಂಗೊಪು\n23 ಟ್ಟಿಅತುಳಬಲವಾರಕಮಾಣಾಗಿ\n24 ನನೆಯೂಮಾಣದಸಣುವಿಜ\n25 ಯಲಕ್ಷ್ಮೀರಾನ್ಯನುಮಾವಿಗಮಾ\n26 ಲೆಯೊನ್ಪತಿಪಾಳಸಿರಿ\n27 ಪ್ಪುಗಳಲಂಬದೆಬೆಚೇಕೊ\n28 ಣ್ಣಾಕೆಕೊಟಿಗೆಗಳನಿನ್ನಾಟ್ಟಿನಿಸಿವೀ\n29 ರಾವತಾರಸಂಕರಕೆಯುಗಾಂ\n\n30 ತೇಕಸೊಂಭೆಥನಾದಮುಂ\n31 ಪಳಕಾಮವಾಡಿಯೊಂದೆದೆ\n32 ಲಗಿವೃತಿಪಾಳಸಿಯಾ\n33 ಬ್ಬವೆವಿನಯ್ದು ಕದುರೆ\n34 ಯುಲಮುತ್ತುಯೆಯ್ಮುಕಂಜೆ\n35 ನನ್ನಆಣ್ಪುತ್ಥೂಸ್ವಟ್ಟಿ\n36 ಗೆರುನಾಲುತ್ತಯ್ಯುಶು\n37 ರಪ್ಪಟ್ಟಿರ್ಗಾಯಿದಾಳಮು\n38 ನೇಳಪೂಜೀವಿವಿವರಬಂ\n39 ಧನನೆಗೆರಮುಂತೆದವಗೆ೯\n40 ಮುಂಕಾಲಸ್ಸಿ೧ಬಚೇಕಾಲವೆನಿ\n41 ಯುಂಬೆಜಸೆಕೆಯುಗಸು..\n42 ಜಲದೆವೆಯೊರಾಜು...\n43 ಕೆಣೆಯೊಂಕಟ್ಟಿಸಿ..\n44 ಯಮಯೆತ್ಸಿ೭ಜವೆ\n45 ರುಬ್ರಾಹ್ಮಣಗೆ೯ಚತ್ತಮಂನಿ\n46 ಲಿಸೆಟೂಗಟೊತಿ ಯುಮಾ\n47 ಡಿಸಿಅಸಲದೇವಮೋಬೆಳ\n48 ಗಿಕಿವೇಲೋಕವತ್ಪ್ರವನ್ನಾಗೆಲ್\n49 ಸೆಯೆಧೆರಂಜಾಜರೆಸೊನ್ನೆ೯\n50 ಹದಿದಂಪರೊಥ್ಯವಿನೆಯೊಂಗಯ್ದು\n51 ವೀರಸಾಹಸನವಂಬಿರೆಸುಸಿ\n52 ದೆಂವೊರಳೆಕಯೆದ್ದು ಮಲ್ಲೆನ\n53 ನ್ಸಿವಿಗಿರೀಗೆನನ್ನೆಬೆನರಾಜಿ\n54 ಮುಯ್ಯನುಮಂಗೊಬಮ್ಮದೆವೆ\n55 ನಿಂಚನ್ನು ದವ್ಯ ರೆಸೊಮಡಿಸಿ\n56 ದೆತೊಜೊಗೆಟಿ ಯೂಮಾಚಿಕೆತಿ\n57 ಣ್ಣಾಮೇವಲಾಬಾಸಿಯಲುಹದೆ\n58 ಸುಪ್ರೆಂಡಹರುಮನ್ರಕೊಂಡೆ\n59 ಮುಂಗಲಮಹೋ ಶ್ರೀ ಶ್ರೀ೯", "roman_pages": [86, 86], "original_pages": [138, 138], "translation_pages": [112, 112]}, {"id": "epca|I|58", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 58, "find_spot": "*At Kalakandūr (same nād), on the pedestal of Brahma-dēva.*", "date": "Date? 1380 A.D.", "translation": "In the year Raudri, on the fifth of the bright fortnight of Jēshta, Sunday,—the\nHandra . . dūr Pāri . . . paid a visit,—śrī-Mānika-dēva. Great good fortune. Śrī. Śrī.", "text_roman": "Raudri-samvatsarada Jēshṭa-suda-panchamī Adivārad-andu Handra . . dūra Pāri . . ru\nbije māḍisida śrī-Māṇika-dēvaru maṁgala mahā śrī śrī.", "text_original": "[Kannada original]\nಅದೆ ನಾಡು ಕಳಕದೊರು ಬ್ರಹ್ಮದೇವೀರ ಪೀಠದಮೇಲೆ ಬರೆದಿರುವುದು\n[English translation, Gemini-rendered, verify]\nIn the same nāḍu, written on the pedestal of the Brahmadevīra at Kaḷakadoru:\n\n1- ರಾಧ್ರಿಸಂವತ್ಸರದೆಜೇಷ್ಠ ಸುದೆಸಂಚಮಾವಿದಾರದಂದು\n2- ಹದುದ್ಯ...ದೊರಬಾರಿ,...ರಜಿಮೆಡಿಸಿದಿದೆ |\n3- ಶ್ರೀಮಾ೯ಣಕೆದೆಯವರುಮಂಗಲ\n4- ಮಹಾ ಶ್ರೀ ಶ್ರೀ\n\n97", "roman_pages": [86, 86], "original_pages": [138, 139], "translation_pages": [112, 112]}, {"id": "epca|I|59", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 59, "find_spot": "*On a stone at Chauḍlu (same nād), on the path near the Suggi temple.*", "date": "Date? 1297 A.D.", "translation": "Be it well. When śrīman mahā-maṇḍalēśvara, . . . . . . . . . . . Nārāyaṇa, . . .\n. . . Harihara-Dēva. . . . . . . . was ruling:—in the year Hēvalambi, on the fifth of the\nfirst half of the month Māgha, the nakshatra being Aśvini, Thursday,—the regulation formerly\nmade by Harihara . . . . . . . . for property accruing to a female in Kundūr was as\nfollows:—It will belong to a female, to female children and to children of female slaves.\n(Here follow a number of names)—These gaudas and others gave this regulation by śāsana\nto the towns of this nād, for as long as sun and moon endure. Sēnābōva Jinayya wrote it.\nMaloja engraved the stone.\n\n71", "text_roman": "svasti śrīmanu-mahā-maṇḍalēśvara . . . . . . . . . . . . . . . . . . . . Nārāyaṇa\n. . . . . . . . . . . . . . . . . . Harihara-Dēva . . . . . . . . . . . . . . . āḷutt-ire\nHēvilambi-saṁvatsarada Māgha-māsa pūrva-paksha panchamī Aśvinī-nakshatra Guruvārad-\nandu Harihara . . . . . . Kundūriṅge pūrvvadali heṇṇinge saluva svāste mariyādiya koṭṭa\nkramav-endade heṇṇinge heṇṇu-makkaḷinge tottina maṅkaḷinge saluvudu Chavada\n. . . māṉeyolu Māra-janakā . . Molateya . . . . . Pārisa. . . . . . . Kundūra\nthāvamānevolu Māchi. . . . . kāriyana gaha| Mācha-jīyana kaṇaṇ aiqaṇaleya Kāmanapalli\ngundada Ājana Benaḍha Heggadehalliya Mādana Abiyūra Mali-gauda yi gaudugalu\nmukhyavāgi yint i-nāḍu-nakharake chandrāditya-uḷḷannabara koṭṭa śāsana-mari yādiya\nbareda sēnabōva Jinayya kalla hoyda Malōja. . . . .", "text_original": "adê nāḍu cāōdhuṇṇi, guṣi bālaỵ dāriellā\n1 svasti, śrīmanmahāmaṇḍaleśvaran\n2 ...............nārāyaṇa . ṇa.......\n3 ......harihaṛdeva..........\n4 ṅge...\n5 ...............alāṃty rahesniḷaṃ", "roman_pages": [86, 89], "original_pages": [139, 139], "translation_pages": [112, 113]}, {"id": "epca|I|60", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 60, "find_spot": "*On a stone at Hārōhalli (same nād), in the Gauda's paddy field.*", "date": "Date ? about 900 A.D.", "translation": "Teyalayya Jūbu, washing his feet, gave Barar[ra]sa as an agrahāra. Moreover,\nChaṭṭayyam Dhāraka-Balahan Kongaṇivarmmaṁ, washing his feet, gave . . . . . to\nPonnamaṇṇa. . . . . . .", "text_roman": "Teyalayya Jūbu kālam kalchi . . . . . . . rvvadim Barariya Ereyaru . . . \nsange bitt agrahāra| mattam Chattayyam Dhāraka-balaha Koṅgaṇivarmmam kālam kalohi\nkoṭṭam . . bitta Ponna maṇṇange vaṭṭadim . . . .", "text_original": "adē nāḍu hārōehallya grāmada gaoḍana auṃbaļagadde kālavaeḷlyi\n1 teyayyujjabumkālonkaṭli........\n2 nycādiṃbujiyukōṭyaṃeējiya [ṛ]\n3 sōngebitugēhāre ! meṭtōmbalḍ\n4 ṭṭymuṃdōre kabaļaha kōṇgṇ\n\n5 vamṁyroṃtākaṇlaska. kōṭiṃ\n6 biṭṭpōnnụ maḳne iṅgatsyāḍio", "roman_pages": [89, 89], "original_pages": [139, 139], "translation_pages": [113, 113]}, {"id": "epca|I|61", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 61, "find_spot": "*On a virakal at Garandūr (Gaḍi-nād), in the path to Sāntaviramma's house.*", "date": "Date ? about 1085 A.D.", "translation": "(Very much effaced). . . . . Be it well. The śrīman mahā-maṇḍalēśvara,\nTribhuvanamalla Vīra. . . . . Changālva. . . . . to the mahā-ma[ṇḍalēśvara]\n. . . ditya-dēva. . . . .", "text_roman": ". . . . . . . . . . svasti śrīmanu mahā-maṇḍalēśvara Tribhuvanamalla Vīra\n. . . matu Changālva . . . mahā-ma . . . ditya dēvage . . . . . . .", "text_original": "gadīnāḍu hōeobala gaṛgaṃdōru śāstravīrmstyua manēdāriallyi nattj o ṃe vīregallụ\n6 .......mahāmau....\n3 svasti,śrīmenmanusamānuṇaṃ\n4 lēśyaratri bhuvanamalla vīre\n5 ......maķtu - cēṅga -\n7 ...ditrēdveṃg...\n8 .........fni..\n9 ......rdu...........", "roman_pages": [89, 89], "original_pages": [139, 139], "translation_pages": [113, 113]}, {"id": "epca|I|62", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 62, "find_spot": "*On a stone at Hārangi (same nād), on the north-east, in the bamboo forest of the Chikka matha.*", "date": "Date ? about 1100 A.D.", "translation": "Be it well. With all titles, śrīmat Shaṇmēdō-Kōkam, the Kaliyuga Brahma, ascended\n(to heaven).", "text_roman": "svasti samasta-praśasti-sahita śrīmat Shaṇmēdō-Kōkam Kaliyuga-Brahma ēriḍa.", "text_original": "adē nāḍu hāraṃgi grāmada kōśānya cikkmukada biviru kādinaḷli\n1 svasti samastapraśasṭi\n2 sēritvikiṇmakṣe\n3 nnyēmeōrkoēśarākali\n4 yougabrypūjide", "roman_pages": [89, 89], "original_pages": [139, 139], "translation_pages": [113, 113]}, {"id": "epca|I|63", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 63, "find_spot": "*On a stone at Tākeri (same nād) in Balagai-Irana's paddy field.*", "date": "Date ? 1348 A.D.", "translation": "In the year Sarvadhāri, on the 5th of the dark fortnight of Chaitra, Sunday,—Gauli-\nNajarrappaya and his elder brother granted this gaudike to Hānagal Linge-gauḍa.", "text_roman": "Sarvadhāri-samvatsara Chaitra ba 5 Ā lu Gauḷi-Nañjarappaya-aṇāvanarū Hānagala\nLinge-gaudaṛige hā . . ṭṭa gaudike.", "text_original": "adē nāḍu tākāri grāmada balggyi ḳurēṇa gadyayalli\n1 savadhārisoṃvakyara\n2 hēṭtyetw ḥ aḷuṅgalu\n3 aṇaṅjarpyualeaṇ\n4 navaruoḥanaṃleōṃ\n5 gaṅgasudārigahāṇa -\n6 ...ṭṭygaūḍikaḥ", "roman_pages": [89, 89], "original_pages": [139, 139], "translation_pages": [113, 113]}, {"id": "epca|I|64", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 64, "find_spot": "*On a stone at Kājūru (bilaha hōbli), lying north of the Basavana guḍi.*", "date": "Date ? about 1850 A.D.", "translation": "śrīmat Bilu-gauḍa and Aṇaba-gauḍa gave this village to the four—Bayiru . .\n. . . ka, Yirāma, Nāgajyaya, and Kempana.", "text_roman": "śrīmatu Biḷu-gauḍa Aṇaba-gauḍa Bayirukanigu Yīrāma Nāgajyaya Kempana nālvarige\nkoṭṭa grāma.", "text_original": "balaha hōeobala kācōru basavanaguāge utta ṛavalli, biḍdi rōvedu\n1 śrīmeutubilāṃgāḍelānebaṅgnyu\n2 ḍabaiyuru - kaniśuyuōramānā\n3 gajeyu\n4 kōmpāra\n5 nāllyaṛige\n6 kōtigrāmu", "roman_pages": [89, 89], "original_pages": [139, 139], "translation_pages": [113, 113]}, {"id": "epca|I|65", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 65, "find_spot": "*On a stone at Siraha (same hōbli), in front of the Rāmēśvara temple.*", "date": "Date 1175 A.D.", "translation": "śrī. In the year Jaya, on full moon day in the bright fortnight of Phālguna, Thursday,—\nwhen Hoysaṇa bhuja-bala śrī-Vīra-Ballāla-Dēvarasa was ruling the kingdom of the world:—\nto Māyanna, son of Biraya of the Kasapa. —gavuḍas of Siriyūr in the west of Biluhu-nād\nwere granted the eight rights of full possession, such as, hidden treasure, underground stores,\nsprings, minerals, and future profit, of the god Mallikārjuna of Sirivūr, together with the kāluga,\nby a śāsana, with pouring of water. Whoso destroys this will incur the guilt of slaughtering\ncows on the bank of the Ganges. Great good fortune. Śrī, śrī, śrī.\nThe guardian of those who take shelter. Śrī.", "text_roman": "śrī Jaya-samvatsara Phālguna-śuddha pavurnami Bṛihavāradali Hoysaṇa bhujabala\nśrī-Vira-Ballāḷa-Dēvarasaru pṛithvī-rājyam geyutt-iddalli Biluhu-nāda pada . . Siriyūra\nKasapa . . -gavudagala Birayana maga Mãyappange Śirivurada Mallikārjuna-dēvara ashta-\nbhōga-tējas-svāmīya nidhi-nikshēpa-jala-pāshāṇa-āgāmi-mukhyavāgi Mãyappange kāluga\nberasāgi dhāreya yeradu koṭa sāsana yidanu āru aḷihidade Gangeya tadiyali kavileya konda\ndōshadali hōharu maṅgala mahā śrī śrī śrī-. Mare-vokkara-kāvaru śrī.", "text_original": "ಅದೋ ಹೋಬಳಳ ಸಿನೆಹ ಗ್ರಾಮದ ರಾಮೇಶ್ವರದ ಗುಡಿ ಮುಂದೆ\n\n1 ಶ್ರೀಜಯಸಂಭವ\n2 ರದಫಲಣ್ಮ  ಣಸುವಥ\n3 ಪುನ್ಯ ಸಿಪುದ್ರುಹವಾರದಂ\n4 ಲಿಯೊಮ್ಮುಅಭುಜಬಲಕ್ಕೆ\n5 ವೀಿರಬಲ್ಲಾ [ಳ]ದೇವರೆಸರುಪು\n6 ತ್ಯಿರಾಜ್ಯಂಗಯೆತ್ತು ದ್ದ ಲ್ಲಬಳು\n7 ಹುನಾಡವದದರಿಯುರಕ\n8 ಸವೆ - ಗ್ಗೆಂದಗಿನಬೀರಯನ\n9 ಮೂಮಾಯಣನ್ಮ ದೆವರಪುರದ\n10 ಮಲ್ಲಿ ಕಣ್ಮಣ್ಮ ದೇವಅಪ್ಪ ಣೋಗೆ\n11 ಜನಸ್ವಾ ಮ್ಯಾನಿಧಿ ನಿತ್ಯೆಜಲಸನೆ\n\n12 ಣಳಣಾಗಮುಖ್ಯವಾಗಿಣವಾ\n13 ಯಣ್ಮ ಣ್ಮೆರಕಾಳುಣೆರಸನಾ\n14 ಗಿಧರೆಯೂಯೆದದುಕಂ\n15 ಟನಸನಯನಿದೆಯೂಅರು\n16 ಆಳಿಹದಿದೆಂಗೆಣಯಾ\n17 ತೇದಿಯಲಿಕವಿಲೆಯ\n18 ಕೊಣದದೇವರೆದಲಿಹೋಣ್ಮಳ\n19 ರುಮಂಗೆಳಮಾಶಾತ್ತೇ\n20 ಶ್ರೀ ಶ್ರೀ ಮೂಸಿವೆಕ್ಕ\n21 ರಣಕಾಮರು ಶ್ರೀ", "roman_pages": [89, 89], "original_pages": [140, 140], "translation_pages": [113, 113]}, {"id": "epca|I|66", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 66, "find_spot": "*On a stone at Mūdarahalli (same hōbli), under the tamarind tree at the village entrance.*", "date": "Date about 1755 A.D.", "translation": "(Sanskrit). May it be prosperous. Sending for the best of the paramahamsa sannyāsis,\nthe great Yōgi named Kaivalya, ever solely devoted to wisdom,—the Belūr king Krishna gave\nhim an elephant and the Mūdravalli village, as an auspicious offering to Krishna. If it be\nasked, for what reason was it given? (stops here).", "text_roman": "śubham astu\nśrīmat-parama-hamsānām parivrājaka-sattamam|\nKaivalyākhya mahā-yōgim sadā jñānaika-'atparam|\nBēlūru-Kṛishna-bhūpas tu āhūya ya . .-kuñjaram|\nMūdravalli cha grāmas tu dattam Krishṇārppaṇam śubham||\nkimartham dattam ity uktē (stops here).", "text_original": "ಅದೇ ಹೋಬಳಳ ಮೊದಿದವಲ್ಲಿ ಊರುಬಾಗೆಗಲ್ಲಿಲಿ, ಹುಣಸೆಮರದ ಕೆಳಗೆ\n\n1 ಕುಚಮಸ್ತು\n2 ಶ್ರೀಮ.ತ್ಪೈಮಾವರಂ\n3 ಸಾನತಾಃ । ಪರಿವಾರಾ\n4 ಜಿಶಾಸ್ತು ನಂ | ಸ್ವಸ್ತಿ\n5 ವಲತ್ಕಾಮಮಹಾ\n\n6 ಯೋಗೀಂ । ಸದಾ\n7 ಗ್ಜ್ಞಾನ್ಯುತ್ಕತ್ತಗಂ । ಖೇಲಾಯ್ಯುಷ್ಣಮ್ಬಣಂ\n8 ವಸ್ಯು | ಅಹೋಯತಿಯಿತಿಶಾುಜಿರಂ | ಮುದೆ\n9 ವಲ್ಲೇ ಯಚ್ಛಾಗ್ರಾಮಸ್ತು | ದತ್ತೊಹಸ್ವಸ್ತೀರ್ವಾಣಂ\n10 ಕುಭಂ | ಕಿಮುಖ್ಯಗಂಡತಿಮಿ ತೈಕ್ಯೋ *", "roman_pages": [89, 89], "original_pages": [140, 140], "translation_pages": [113, 113]}, {"id": "epca|I|67", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 67, "find_spot": "*On a stone at Huḷakōḍu (Koḍli hōbli), at the Kaṇṇēśvara temple, east of the village.*", "date": "Date ? 1360 A.D.", "translation": "In the year Vikāri, on the 5th of the bright fortnight of Phālguna, Saturday.—Trinamēra-\nDēvaṇṇa having gone below the Ghāts and . . . . . . . -Hulukōḍ Chikkaṇṇaya Bomma-\ngauḍa's biragal. Kalina-Bōja engraved it. Śrī . . . . . Demmaya and Chikkaṇṇaya\n\n72", "text_roman": "Vikāri-samvatsarada Phālguna-śuddha 5 Vadavāra-di Trinamēra-Dēvaṇṇavaru Ghaṭada-\nkelage hōgi . . li Huḷukōḍ-Chikkappaya Bomma-gaudana biragallu Kalina-Bhōja gaḍadu\n. . . Dēmmayyam Chikkannays . . ge . . .", "text_original": "ಕೊಡ್ಲಿ ಹೋಬಳಳ ಹುಳಕೋಡು ಗ್ರಾಮಕ್ಕ ಪೂರ್ವ ಕಣ್ಮ ಖ್ಯೆ ರ ದೇವರ ಗುಡಿ ಬಲ\n\n1 ವಿಕಾರಿಸಂವತ್ಸ ರದಫಾಗುಣಸುದಧ ೫ ವೇದನರದಿ\n2 ತ್ರಿನಮೇವದೇವನ್ಯ ನನರೋಷ್ಠ ತಿದೇಕಳಗೆಹೋಗೇ\n3 ಗಿಅಧಿಧಿಹಲುಲಕ ಣೋಡಿದಚಿಕ್ಕಣ್ಯ ಯೆಬೆಂಮ್ಯೆ ಗಾ\n[ಡ\n4 ನಭಿಬಿರಲಗ್ಯ ಕಳನಬೆರ್ಬೋಜಾಗದದಯೇ\n\n5 ಸಗಪು\n6 ದೆಟೊ\n7 ವ\n8 ಚೇ\n9 ನೈಯ್ಯೋ ೦ಚಿಕಣ್ಣ ಯಿರಿಗೆಮಂಗಳಮಅದೊರ", "roman_pages": [89, 89], "original_pages": [140, 140], "translation_pages": [113, 114]}, {"id": "epca|I|68", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 68, "find_spot": "On a stone at Heggadahalli (*Kanime hobli*), near the Basava temple.", "date": "Date 1731 A.D.", "translation": "Śrī. Be it well. In the 1652nd year of the victorious increasing Śālivāhana era, the\nyear Sādhāraṇa, on the 2nd of the dark fortnight of Māgha, Friday—in the presence of\nMañjunāthu-svāmi of Kuduma, for the service of the god, Hāvēri Virap-odęr gave, free of all\nimposts, Heggadahalli and Sirangāla, and had (boundary) stones set up to the 29 hamlets\nbelonging to the two places, and gave them.", "text_roman": "śrī svasti śrī-vijayābhyudaya-Śālivāhana-śakada varusha 1652 neya Sādhāraṇa-saṁvatsarada\nMāgha-ha 2 Bhārgavārādallu Kuḍumada Mañjunātha-svāmiyavara sannidhiyallu nadava\ndēvatā-śēve-bagye Hāvēri-Vīrap-odēru sarvamānya-saṁkētavāgi biṭṭa Heggadahalli Sirangala\n.. ublaya-gadige saluva upagrāma 29 nu śilā sthāpita mādisi biṭṭu koṭṭadu śrī.", "text_original": "ಕಣೇಮ್ಮೆ ಹೋಬಳಳ ಹಗೆ ಡಹಳ್ಳ ಬಸವನ ಗುಡಿಬಲ ೧ ನೇ ಕಲ್ಲ ನು\n\n1 ಶ್ರೀಸ್ವಸ್ತಿಶ್ರೀವಿಜಯಾಭ್ಯ\n2 ದಯಕಾಳಿವಾಹನಕಳದವರು\n3 ಶೈ ೧೬೫೧ ನೇಯ ಸಾಧಾರಣಸಂವತ್ಸ ರದ\n4 ಮಾಖೆಭ ೧ ಬಾಗಹ ೨ ವಾರ\n5 ದೆಲ್ಲ ಕಾಡುಮದದಮಂಜನಾಥೆ ಸನ್ವಾಮಿ\n6 ರುವರಸಂನಿಧಿಯಲ್ಲ ನಡದವದಪತೇಸನೆ\n\n7 ಬಗೆಹಾ ವೀ ರವಿ ರೆಯೆವಂತೆರೈದು | ಸರ್ವಮಾನ್ಯೋ\n8 ಸಂಕೋತವಾಬಟ್ಯೋ ಯೆಗೈ ದಹಳ್ಳಿಸಿರಂಗಾಲ ॥\n9 ಉಆಭಯದಿಗೇಸೆಲವಲುಪಾಗ್ರಾಮ ೧೯ ನು ಸಿ\n[ಲಾ\n10 ಸತ್ವಾಪಿತನಾಅಡಿ ಸಿಬೆಟ್ಟು ಕೊಟ್ಯ ಡು\nಶ್ರೀ", "roman_pages": [90, 90], "original_pages": [140, 140], "translation_pages": [114, 114]}, {"id": "epca|I|69", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 69, "find_spot": "On another stone at the same place.", "date": "Date 1731 A.D.", "translation": "The sign of Mañjunātha-svāmi of Kuduma.—(damaruga and triśūla.)", "text_roman": "śrī-Kuḍumada Mañjunātha-svāmiyavara saṅkēta śrī (*damaruga and trīśūla*).", "text_original": "ಅದೇ ಸ್ಥಳದಲ್ಲಿ ೨ ನೇ ಕಲ್ಲ ನು\n\n1 ಶ್ರೀಕಂಡಮುದೆಮಂ\n2 ಜನಾಥಸ್ಥಾಪಿನಿಯ\n\n3 ವರಸೊಕೇಥ ಶ್ರೀ\n†\n\n* ಇದಲ್ಲಿ ಬರೆದಿರಹದು.\n\n† ಇಲ್ಲಿ ಡಮುರುಗ ತಿಕಾಲ ಬರೆದಿದೆ.\n\n99", "roman_pages": [90, 90], "original_pages": [140, 141], "translation_pages": [114, 114]}, {"id": "epca|I|70", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 70, "find_spot": "On a third stone at the same place.", "date": "Date about 1175 A.D.", "translation": "Be it well. When the refuge of all worlds, the favourite of earth and fortune, the\nmahārājādhirāja, paramēśvara, paramo-bhaṭṭāraka, sun in the sky the Yādava-kula, crest-jewel\nof perfection, Rāja of the Malerājas, champion among the Malapas, ganda-bhēruṇḍa, unshaken\nin war, unassisted brave, single-handed hero, Śanivāra-siddhi, Giridurgga-malla, destroyer of\nMagara-Rāya. . . . . . śri-Vīra-Hoysaṇa [Vīra-Ballāla-Dēva was ruling]:—", "text_roman": "svasti samasta-bhuvanāśrayam śrī-pṛthvi-vallabham mahārājādhirāja paramēśvaram\nparama-bhaṭṭāraka Yādava-kulāmbara-dyumaṇi samyaktva-chūḍāmaṇi Malerāja-rāja Mala\nparoļu gaṇḍa gaṇḍa-bhēruṇḍa kadana-prachandaṇ asahāya-śūra ēkāṅga-vīra Śanivāra-siddhi\ngiridurgga-malla Magara-Rāya . . . . ranaya . . . . . gaṇḍa śrī-Vīra-Hoyisaṇa . .", "text_original": "ಅದೇ ಸ್ಥಳದಲ್ಲಿ, 3 ನೇ ಕಲ್ಲು,-\n1 ಸ್ವಸ್ತಿ ಸಮಸ್ತ ಭುವನಆಶ್ರಯೋಂತ್ಯೇ\n2 ಪ್ರಥ್ವೀವಲ್ಲಭಭೂಮಹಾರಾಜಾಧಿರಾಜ\n3 ಪರಮೇಶ್ವರಪರಮಭಟ್ಟಾರಕಯ\n4 ದವಕುಳಾಂಬರದ್ಧಿಮಣೇಸಮ್ಯಕುತ .\n5 ಜೋಡಾಮಣಿಮಲರಾಜರಾಜಮ\n6 ಲಪರೋಷಳಗಂಡಗಂಡೇಭರುಂಡೇಕದೇವಪ್ರಜಂ\n7 ದನದಹಾಮಸೇರಯೋಕಾಂಗವೀರಸದಿನವಾರೇ\n[ದ್ಧಿಗಿರಿವರ್ಗ\n8 ಮಲ್ಲಂಗೇರರಾಯ - ರಣಯ\n9 ........................\n10 ಗಂಡೆಗ್ಗಳವಿರೊತೆಯಿಸೇಣ ......\n11 ........................", "roman_pages": [90, 90], "original_pages": [141, 141], "translation_pages": [114, 114]}, {"id": "epca|I|71", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 71, "find_spot": "On a stone at Sirangāla (same hōbli), in the field of the Basava temple.", "date": "Date ? about 1700 A.D.", "translation": "Be it well. Śrī. Sirivangala Mācha-gāvunda Siriyama-tandi vira[gal]. Mācha-gonda's\nson Kava-gonda set up the stone. Mariyōja's work. Fortune.", "text_roman": "svasti śrī Sirīvangalada Mācha-gāvuṇḍam Siriyama-tandi vīra[gallu] Mācha-goṇḍana maga\nKāva-goṇḍa kalla niriṣidam Mariyōja besada maṅgalaṁ.", "text_original": "ಅದೇ ಹೊಟೇಲ ಸಿರಂಗಾಲದ ಬಸವನಗುಡಿ ಸಾರಿಗೆಯಲ್ಲಿ,\n1 ಸ್ವಸ್ತಿ ಶ್ರೀಸಿರಿವಂಗೇಲದಮತಾಡ\n2 ಗಾವುಪ್ರಣ್ಣೊಸಿರಿಯಮತನ್ನಿವೀರ॥\n3 ಮೂಚಗೊಂಡ್ಣನಮಗರಕಾಮಗಂ\n4 * ಣ್ಣಾಕಲ್ಲನಿಲಿಸಿವಂ\n5 ಮರಿಯೊಜೀಬಸೆದಮಂಗಲಂ", "roman_pages": [90, 90], "original_pages": [141, 141], "translation_pages": [114, 114]}, {"id": "epca|I|72", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 72, "find_spot": "On a stone at Bālāji (*in Beṭṭiyattu-nād, Kiggatnad tāluq*).", "date": "Date ? about 1300 A.D.", "translation": "There are six lines, but the whole of the letters have been so nicked as to be illegible.¹", "text_roman": "Illegible, owing to the letters being nicked all over.", "text_original": "ಕೆಗ್ಗಟ್ಟಂಡು ತಾಲ್ಯೂಕು ಬೆಟ್ಟೆಯಪುತ್ತು ನಾಡಿನಲ್ಲಿ ಬಾಲಾಜಿಗ್ರಾಮದಲ್ಲಿರುವ ಕೆಲ್ಲು,\nಪ್ರಮಾಣ 1' 6\" × 4' 3\"\n* ಪಂಕ್ತಿ ಗಳive: ಅಕ್ಷರವೆಲ್ಲಾ ಚುಕ್ಕೆ ಚುಕ್ಕೆ ಕೆದಿಸಿಬಿಟ್ಟಿವೆ", "roman_pages": [90, 90], "original_pages": [141, 141], "translation_pages": [114, 114]}, {"id": "epca|I|73", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 73, "find_spot": "On the wall of a temple at Bālele (*in Haṭgat-nād, same tāluq*).", "date": "Date ? about 1700 A.D.", "translation": "The stone station of the Jogi of the westerns.\nThe western royal stone.\nObeisance to the Jogi of the westerns.", "text_roman": "Paduṇara jōgi silā golā\nPaḍuva rāya silā\nPaḍubara jōgi namaḥ||", "text_original": "ಅದೇ ತಾಲ್ಯೂಕು ಹತ್ತು ಗೆಟುನಾಡಿನಲ್ಲಿ ಬಾಲಾಲೆ ಗ್ರಾಮ ದೇವಸ್ಥಾನದ ಗೋಡೆಯಮೇಲೆ\n1 ಪೆದುಬರ ಜೋಗಿಗಿ ಸೀಲಾಗೂಲಾಡ\n2 ಪೆದುವರಾಯಾಸೀಲಾ\n3 ಪೆದುಬರಜೋಗಿನಾಮೂ॥", "roman_pages": [90, 90], "original_pages": [141, 141], "translation_pages": [114, 114]}, {"id": "epca|I|74", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 74, "find_spot": "On a stone called Kārakuṇabulu-gālikallu, near Hardūr (*in Mercāra tāluq*).", "date": "Date about 910 A.D.", "translation": "Be it well. Śrī-Ereyapa's . . . . . while saying the end of the battle is good,\ndied, and obtained a kalnād. Whose destroys this, incurs the guilt of destroying cows\nand Bāṇārasi. One bālu free from taxes.\nGreat good fortune. Śrī.", "text_roman": "svasti śrī Ereyapana . . dāhanu raṇāntya val eṇṇuvaḷu sattu padeda kalnāḍum idan aḷivaṁge\nkavileyuṁ Bāṇārāsiyaṁ alida pātakam ondu bālu parihārain maṅgala mahā śrī.", "text_original": "26 ಮೇ ಪುನ ವಕ್ಷಿ ಮಸ್ತಂ ದಸಿ ಪೆಟ್ಟ ಧಿ ಲಪ್ಲಕ್ಷ್ಮನು ಸಾನ್ಸತ್ರೇತಿಯ ವಟವೃಕ್ಷಮೆ ಪುನತೊರೆನಲ್ಮನು ಉತ್ತ\n    ರಾಮನು\n27 ವಿಸೆನ್ನ ಬಯುಮುಲಿಕಹನ್ನಿಯಜಮ್ಮು ಯಡಿಯಕಹೂಕಮಿ ಪುನನಾಯವ್ಯಾದ ಗತೆಚೆಜಹವೃಕ್ಷಮೆ ಪುನವದೆನ\n    ಗುಸ್ತೆಯುಮುಯೆ ತ್ರಿಯುಕಾಲಯಕೊರಡೆಸಾರನ್ಸು ತೇಸ್ಕನ್ನಿಯ್ ಲಗುಂಬೆವಿಡುನೆಲಂಗ್ಲುಪುನೆಗಸೆಲೆ\n    29 ಯಾತ್ರಾನು ಲತಹರದಿಸಿ ಕಾಯ್ಮು ಮೊೆಡಿಜಿ ಇಡಿದೆಕುಬೆರಯೆ ಪುನಪೊಟ್ಟೈಕಮುಬಿದೆಸನ್ನ ಬಯುಮುಂ\n    ಶಿವ\n2 ಜ ನೆ ಪತ್ರದೆ ಮುಂಭಾಗ-\n30 ನಿ ಯೊ ಪುನಕಡಹಟ್ಟಿ ಗಾಲವೆಮುತ್ತುಮೆ ಪುನ ಇಸಾನವೆಟದನೆಗುಸ್ತೆಯು ದಾಸೆನರೊಪೆಯ್ಯದ ತ್ರಿಸನ್ನಿ ಯ\n    31 ಕಟೂಕಮೆ ಕೊಡಿಗಟ್ಟಜ್ಜಿನೃ ವೃಕ್ಷಮೆ ಕೆಂಜೆಟ್ಮಿನ್ನದಿನೆಡಂ ಪೂರ್ವ್ದಕಡೆಕಿದ್ಡು ಸೀಮಾನ್ರಂ ॥ ತಸ್ಯ\n    ಸಾಕ್ಷಿಣಾ\n32 ಗಜೇರಾಜಕುಲ ಸೆಕರಲಸ್ಪೆಯಿಥಪುರುಷಪ್ಪೆ ಕೃಣಾಣಮುತ್ತುಗರೆೆಯಸ್ಪೆ)ಕಗೆಬೆಜನಾಡಿನೆಗ್ಗಸ್ತನೆ ಮಣಿ\n    ಯು\n33 ಗುರುಯನಪ್ಯಾಲಿಸಂಬಾಳಾದವಳಿಖ್ಯಮುಾಂ ॥ ದೆಸಿನಸೃತೆಗಡೊರಕುಹುಗೋವೆರುಗೆಣಗೆನರತೆಗಡೆರು\n    ಅರೆನ್ಮ\n    34 ದತನನ್ಸ ಕರುಂ ಶೂನ್ಯತರಬೆಳ್ಳರ್ರಂ ಅಳಗೆಯರುಂ ಬದಹೆಗಸ್ತೆ ಯು ರುಂಸೆನ್ನ ತೆಳ್ಳ್ಯರುರವೆಗ್ಗಾವಿ\n    ಯಮುಾಂ ॥\n35 ಸ್ಪದತ್ತೆ ಪರದತ್ತ್ಯಾ ಯೊೇ ಹರೇಥೆवसुಂಧರೆ ಪೆಷ್ಠೆೀವೃಮಿಸಸ್ರಾಣಿ ವಿಸ್ಪತ್ಯೊಾಂ ಜಾಯುತೆಸ್ತೃಮಿಬವ\n    36 ಸುಭವೆದಿನಾಭುಕ್ತಂ ರಾಜಭಸ್ತೃಕರೋಜಭ ಯಸ್ಯಯಸ್ಯಯದಾಭೂಮಿ ತಸ್ಯತಸ್ಯತದಪಾಹರಂ ॥ ದೇವ\n    37 ಸ್ವನ್ಮವಿಷಘೋರೆಂ ನವಿಷಂವಿಷಮುಚ್ಚುತೆ ವಿಷೆಮೇತಾಕರೋಹ್ಯೆನ್ನಿ ದೇವಸ್ವಪುತ್ರಸಾತ್ರಿಕಂ ॥ ಸಾಮೋ\n    ನ್ಯೋಯಂ ಧ\n38 ಮ್ಯೊೇಹುತುಂ ನ್ವಪಾಣಾ ಕಾಲೇಕಾಲೇ ಪಾಲನೀಯೋ ಭವದ್ಭಿ ಸೆಬ್ಬಕ್ಕೋತಾಂಭಾಗಿನ ಪಾರ್ಥಿವೇ\n    ನಾ ಭುಯೋಭೂಯೋ\n39 ಯಾಚತೆ ರಾಮಭದ್ರಾ ॥ ವಿಸ್ಪಕನ್ಯೋಲಿವಿತಂ ॥ 2\n\nಮಡಿಕೇರಿತಾಲ್ಯೂಕು ಹರದೆನೂರು ಗ್ರಾಮ ತುಕ್ಕೇ ಸುಮಾಪ ಕೆರಿಕಣಬೈಲುಗಾಳಳ್ಳಿಯಲ್ಲಿ ಕಲ್ಲಿನಲ್ಲಿ\nಪ್ರಮಾಣ 2' 10\" × 2' 10\"\nಬಲಪಾರ್ಶ್ವ್\n1 ಸ್ವಸ್ತಿ ಶ್ರೀ\n2 ಎಜೆಯ\n3 ಪನ -\n4 - ದಾಹ\n5 ಸುರಣ್ಮಾನಲ್ಲಿ\n6 ವೇಳಣ ವೇ\n7 ಲುಸುತ್ತುವ\n8 ದೆದೆ ಕಲ್ಯ್\n9 ಡುಂ ಇದೆ\n10 ನೇಜಿಗೆಂಗೆ\n11 ಕವಿಲೆಯುಬಾಠಾ\n\nಮಧ್ಯೇಪಂಕ್ತಿ\n12 ಕಾರೇಸೆಯುಂ ಆತಿದೇವತಾತಕಂ\nಕಳಗಿನ ಪಂಕ್ತಿ\n13 ಒನ್ನು ಬಾವಟುಪರಿಸಹೂ\n14 ರಂ ಮಂಗಳೇಮಹಾಶ್ರೀ್ಯ\n\n* ಈ ಪಕ್ತಿ ಮೇಲ್ಬಾಗದಲ್ಲಿ ಬರೆದಿದೆ.\n\n18-A\n\n[Footnote *] ಈ ಪಕ್ತಿ ಮೇಲ್ಬಾಗದಲ್ಲಿ ಬರೆದಿದೆ.\n100", "roman_pages": [90, 90], "original_pages": [116, 142], "translation_pages": [114, 114]}, {"id": "epca|I|75", "volume": "Epigraphia Carnatica, Vol. I", "volume_short": "I", "number": 75, "find_spot": "On a stone in Mudduvīraṇa Puṭṭamma's coffee garden in Utuguli (*in the same tāluq*).", "date": "Date ? 1264 A.D.", "translation": "Be it well. Śrīman mahā-maṇḍalēśvara, subduer of Chaīṭu, in firm character Rāma,\nsupporter of Satyarāya, in solid adamant Rudra, guardian of refugees, śrīmad Vīra-Muni-\nvarāditya Gōkula-dēvarasa :—\nIn the year Raktākshi, the month Kanya,—when the Tengu-nāḍaka seized the cows\nof Yalaghalī—his brave servant Mēlali's infuriated wife Bidaḍe, wrestled with, over-\npowered, and throw him down, the rope to his legs ;-and received a nose-jewel (as reward).\n\nFootnote\n1. From its appearance this inscription might have supplied some information of value. It may have been for this reason it was defaced.", "text_roman": "svasti śrīmanu mahā-maṇḍalēśvara Chaṭuṭu-vibhēda chhaladanka-Rāma Satyarāya-saṁvaraṇa\ntira4-vajra-Rudira mare-vokkasa-kāva śrīmad-Vira-Munivarāditya Gōkula-dēvarasaru/\nRaktākshi-saṁvatsarada Kanyā-māsad andu Tengu-nāḍakam Yaḷaghaleya tuxu iḍidelli\nmāsala-baṇta Melaliya marulakāra-yōśiyālu Biḍade garuḍu vaśa tallibittu dānige kālege\nsandudu mukk-oḍave.", "text_original": "[Kannada original]\nಅದೇ ತಾಲೂಕಿನ ಕಾಲುವೆಲಿಗ್ರಾಮದಲ್ಲಿ ಮುದ್ದು ವೀರಪ್ಪ ಪುಟ್ಯ್ಮನಿನ ಕಾಫಿ ತೋಟದಲ್ಲಿ ಇರುವ ಕಲ್ಲು\nಪ್ರಮಾಣ ೧' ೯\" y ೧' ೯\"\n೧ ನೇ ಪಟ್ಟಿ\n೧ ಸ್ವಸ್ತ ಶ್ರೀಮನುಮಹಾ ಮಂಡಳೇಶ್ವರ ಬೆಳುಟ\n೨ ವಿಭಾಡ ಭಲವದೇಕಾರಮ ಸತ್ಯರಾಯಸಂವೆ\n೩ ರಣಾತಿರ ವಜುರುದಿರಮಟ್ಯೋಕವಶಕಾವ\n೪ ಶ್ರೀಮದ್ ವೀರಮುಮಿನರಾಧಿತ್ಯ ಗೋಳಸೇ\n೨ ನೇ ಪಟ್ಟಿ\n೫ ಲಚೆವೆರಸೆರು | ರಕ್ತಾಕ್ಷಿ ಸಂವತ್ಸರಕನ್ಯಾಮಾಸೆದೆಂತುಂ\n೬ ಗುನನಾಡಕೆಯುಟಫಳಯು ತುಟಬಸಿದಿಲ್ಲಿ ಮಾಸಲಬ\n೭ ಣ್ಣಾನ್ನಾಳಾಥಯಮರುಳಶಕಾರುಣ್ಯೋತಿಯಾಳರುಬಡೇಗಳುದು\n೮ ವಕತಲಬಬಿಟ್ಟು ದಾಣಿಗಳಾಲೆಗೆಂದುದುಮುಕ್ಕೈದವೆ\n\n[English translation, Gemini-rendered, verify]\nIn the same taluk, in the village of Kaluveli, in the coffee estate of Muddu Virappa Putyammani, the stone present.\nDimensions 1' 9\" by 1' 9\"\n1st plate:\n1 Svasti Srimanuma-maha-mandalēśvara Beluṭa\n2 vibhāḍa bhalavadēkārama satyarāyasamve\n3 raṇātira vajurudiramaṭyōkavaśakāva\n4 Srimad-vira-muminarāditya gōlasē\n2nd plate:\n5 lacheveraseru | Raktākṣi-samvatsara-kanyāmāsedentum\n6 Gunanaḍaka-yuṭa-phaḷai tuṭabasidilli masalaba\n7 ṇṇānnāḷāthayamaruḷa-śakāruṇyōtiyāḷarubaḍēgaḷudu\n8 vakatalababhiṭṭu dāṇi-gaḷālegendumudukkaidave\nSCALE 1 INCH = 8 MILES.\n__DISTRICT BOUNDARY\n------- TALUK BOUNDARY\n----- NAD BOUNDARY\n--- RESERVED FOREST", "roman_pages": [90, 90], "original_pages": [142, 144], "translation_pages": [114, 114]}]</script>
<script>
(function() {
  const records = JSON.parse(document.getElementById('record-data').textContent);
  const tbody = document.getElementById('tbody');
  const searchBox = document.getElementById('searchBox');
  const volumeFilter = document.getElementById('volumeFilter');
  const matchHint = document.getElementById('matchHint');
  const countBadge = document.getElementById('countBadge');

  // Populate the volume dropdown from whatever volumes are actually
  // in this build's data -- grows on its own as more volumes get
  // their own parser, no template change needed each time.
  Array.from(new Set(records.map(r => r.volume_short))).sort().forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = `Vol ${v}`;
    volumeFilter.appendChild(opt);
  });

  function esc(s) {
    if (s == null) return '';
    return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }

  // Wraps every case-insensitive occurrence of `q` in escaped `s` with <mark>.
  function highlight(s, q) {
    const safe = esc(s);
    if (!q) return safe;
    const qEsc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return safe.replace(new RegExp('(' + qEsc + ')', 'ig'), '<mark>$1</mark>');
  }

  function containsCI(haystack, q) {
    return !!haystack && haystack.toLowerCase().includes(q.toLowerCase());
  }

  function pageRange(pages) {
    if (!pages || pages[0] == null) return '';
    return pages[0] === pages[1] ? `p.${pages[0]}` : `p.${pages[0]}–${pages[1]}`;
  }

  function buildRow(r, q) {
    const tr = document.createElement('tr');
    const hitRoman = q && containsCI(r.text_roman, q);
    const hitOriginal = q && containsCI(r.text_original, q);
    const hasTextHit = hitRoman || hitOriginal;
    tr.innerHTML = `
      <td><button class="idchip" type="button" data-id="${esc(r.id)}" title="Copy ID">${esc(r.id)}</button></td>
      <td>${esc('Vol ' + r.volume_short)}</td>
      <td>${highlight(r.find_spot, q)}</td>
      <td>${highlight(r.date, q)}</td>
      <td>
        <div class="remarks-clamp">${highlight(r.translation, q) || '<em style="color:var(--text-dim)">no translation</em>'}</div>
        <button type="button" class="remarks-more-btn" hidden>Read more</button>
      </td>
      <td><button type="button" class="view-text-btn${hasTextHit ? ' has-hit' : ''}" data-id="${esc(r.id)}">${hasTextHit ? 'View text (match)' : 'View text'}</button></td>
    `;
    return tr;
  }

  function render() {
    const q = searchBox.value.trim();
    const vol = volumeFilter.value;
    tbody.innerHTML = '';
    let shown = 0;
    records.forEach(r => {
      if (vol && r.volume_short !== vol) return;
      const hay = [r.id, r.find_spot, r.date, r.translation, r.text_roman, r.text_original].join(' \n ').toLowerCase();
      const match = !q || hay.includes(q.toLowerCase());
      if (!match) return;
      tbody.appendChild(buildRow(r, q));
      shown++;
    });
    const scoped = vol ? records.filter(r => r.volume_short === vol).length : records.length;
    countBadge.textContent = `${scoped} record${scoped === 1 ? '' : 's'}` + (vol ? ` in Vol ${vol}` : '');
    matchHint.textContent = q ? `${shown} match${shown === 1 ? '' : 'es'}` : '';
    updateClamps();
  }

  function updateClamps() {
    document.querySelectorAll('.remarks-clamp').forEach(el => {
      const btn = el.nextElementSibling;
      // Compare scrollHeight to the clamped max-height to decide if truncation is actually happening.
      requestAnimationFrame(() => {
        if (el.scrollHeight > el.clientHeight + 2) {
          btn.hidden = false;
        }
      });
    });
  }

  tbody.addEventListener('click', (e) => {
    const idBtn = e.target.closest('button.idchip');
    if (idBtn) {
      const text = idBtn.dataset.id;
      const done = () => {
        idBtn.classList.add('copied');
        const original = idBtn.textContent;
        idBtn.textContent = 'Copied!';
        setTimeout(() => { idBtn.classList.remove('copied'); idBtn.textContent = original; }, 900);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
      return;
    }
    const moreBtn = e.target.closest('button.remarks-more-btn');
    if (moreBtn) {
      const clamp = moreBtn.previousElementSibling;
      const expanding = !clamp.classList.contains('expanded');
      clamp.classList.toggle('expanded');
      moreBtn.textContent = expanding ? 'Read less' : 'Read more';
      return;
    }
    const viewBtn = e.target.closest('button.view-text-btn');
    if (viewBtn) {
      openTextModal(viewBtn.dataset.id, searchBox.value.trim());
    }
  });

  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(ta);
    done();
  }

  // --- Text popup (Roman / Kannada Original tabs) ---
  const modal = document.getElementById('textModal');
  const modalClose = document.getElementById('modalClose');
  const modalTitle = document.getElementById('modalTitle');
  const modalSubtitle = document.getElementById('modalSubtitle');
  const bodyRoman = document.getElementById('modalBodyRoman');
  const bodyOriginal = document.getElementById('modalBodyOriginal');
  const tabRomanBtn = document.getElementById('tabRomanBtn');
  const tabOriginalBtn = document.getElementById('tabOriginalBtn');

  function setTab(which) {
    const romanActive = which === 'roman';
    tabRomanBtn.classList.toggle('active', romanActive);
    tabOriginalBtn.classList.toggle('active', !romanActive);
    bodyRoman.hidden = !romanActive;
    bodyOriginal.hidden = romanActive;
  }
  tabRomanBtn.addEventListener('click', () => setTab('roman'));
  tabOriginalBtn.addEventListener('click', () => setTab('original'));

  function openTextModal(id, q) {
    const r = records.find(rec => rec.id === id);
    if (!r) return;
    modalTitle.textContent = `${r.volume} — No. ${r.number}`;
    const parts = [];
    if (r.find_spot) parts.push(r.find_spot);
    if (r.date) parts.push(r.date);
    modalSubtitle.textContent = parts.join(' · ') || 'No further details recorded';

    const romanHasHit = q && containsCI(r.text_roman, q);
    const originalHasHit = q && containsCI(r.text_original, q);

    bodyRoman.innerHTML = `<div class="modal-pages">${esc(pageRange(r.roman_pages))}</div>` +
      (highlight(r.text_roman, q) || '<em style="color:var(--text-dim)">not present in this record</em>');
    bodyOriginal.innerHTML = `<div class="modal-pages">${esc(pageRange(r.original_pages))}</div>` +
      (highlight(r.text_original, q) || '<em style="color:var(--text-dim)">not present in this record</em>');

    setTab(originalHasHit && !romanHasHit ? 'original' : 'roman');
    modal.hidden = false;
    const activeBody = (originalHasHit && !romanHasHit) ? bodyOriginal : bodyRoman;
    const mark = activeBody.querySelector('mark');
    if (mark) requestAnimationFrame(() => mark.scrollIntoView({ block: 'center' }));
  }

  function closeModal() { modal.hidden = true; }
  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !modal.hidden) closeModal(); });

  let debounceTimer;
  searchBox.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, 120);
  });
  volumeFilter.addEventListener('change', render);
  render();
})();
</script>
</body>
</html>
